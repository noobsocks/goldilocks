  if(d.job){
    h+=row("일자리",`${JOB_NAME[d.job]} ${fmtPop(d.jobs)}`);
    h+=row("생산",`${rIco(d.res,11)} ${(DIST_YIELD[dk]||1).toFixed(1)} <small>/천명</small>`,"up");
  }else{
    h+=row("주거",`+${fmtPop(d.housing)}`,"up");
  }
  h+=row("유지비", Object.keys(d.upkeep).map(k=>`${rIco(k,11)}${d.upkeep[k]}`).join(" "), "dw");
  h+=row("건설비", costStr(x.cost), x.afford?"":"dw");
  h+=row("공사", `${Math.round(BUILD_DAYS/30)}개월`);
  if(x.cnt&&d.job) h+=`<div class="pjob">${dJobBar(key,d.job,info)}</div>`;
  let bl, bc;
  if(x.full){ bl="슬롯 없음"; bc="no"; }
  else if(!x.afford){ bl="자원 부족"; bc="no"; }
  else if(x.building||x.qn){ bl="줄 세우기"; bc="go"; }
  else { bl="착공"; bc="go"; }
  h+=`<div class="pact">`;
  h+=`<button class="pb ${bc}" ${x.can?`data-build="${dk}" data-key="${key}"`:``}>${bl}</button>`;
  if(x.cnt){

    h+=`<button class="pb del" data-demo="${dk}" data-key="${key}" data-tip="철거 — ${costStr(rf)} 회수(건설비의 50%)">철거</button>`;
  }
  h+=`</div></div>`;
  return h;
}
/* 팝업은 기본적으로 아이콘 위에 뜬다. 위쪽 공간이 모자라면 아래로 뒤집는다.
   (첫 줄인지 아닌지로 미리 정하면, 패널을 스크롤한 상태에서 잘려 보인다) */
/* ── 팝업 자리 잡기 ─────────────────────────────────────────────
   '첫 줄이면 아래로' 같은 규칙을 미리 정해두면, 스크롤한 상태에서는 그 규칙이
   틀려서 팝업이 잘린다. 그래서 실제로 재본다 —
   위/아래 중 덜 잘리는 쪽을 고르고, 좌우로 삐져나오면 안쪽으로 밀고,
   그래도 남으면 상자를 살짝 굴려 팝업 전체가 보이게 한다. */
function fitPop(box, sel, flip, anchor){
  if(!box) return;
  const pop=box.querySelector(sel); if(!pop) return;
  const cell=pop.parentElement; if(!cell) return;
  pop.style.marginLeft="";
  const br=box.getBoundingClientRect();
  const cut=()=>{ const r=pop.getBoundingClientRect();
    return Math.max(0, br.top+2-r.top) + Math.max(0, r.bottom-(br.bottom-2)); };
  cell.classList.remove(flip); const up=cut();
  cell.classList.add(flip);    const dn=cut();
  if(up<=dn) cell.classList.remove(flip);          // 덜 잘리는 쪽
  let r=pop.getBoundingClientRect(), dx=0;
  if(r.right > br.right-4) dx=(br.right-4)-r.right;
  if(r.left+dx < br.left+4) dx=(br.left+4)-r.left;
  if(dx) pop.style.marginLeft=Math.round(dx)+"px";
  r=pop.getBoundingClientRect();
  if(r.bottom > br.bottom-4)    box.scrollTop += Math.ceil(r.bottom-(br.bottom-4));
  else if(r.top < br.top+4)     box.scrollTop -= Math.ceil((br.top+4)-r.top);
  /* 꼬리를 실제 아이콘 중심에 맞춘다 — 열 위치·좌우 보정과 무관하게 항상 정렬된다 */
  if(anchor){
    let an=null; for(const s of anchor.split(",")){ an=cell.querySelector(s.trim()); if(an) break; }
    if(an){ const ar=an.getBoundingClientRect();
      const x=(ar.left+ar.width/2)-r.left;
      pop.style.setProperty("--ax", Math.round(Math.min(Math.max(x,12), r.width-12))+"px"); }

}

function checkWin(){
  const i=tierIndex();
  if(S.tierSeen===undefined) S.tierSeen=0;
  if(i>S.tierSeen){                       // 등급이 올랐을 때 알림
    S.tierSeen=i;
    if(i<TIERS.length-1) pushLog(`★ 제국 등급 상승 — ${TIERS[i].n}. 다음 목표: ${TIERS[i+1].d}`,"good");
  }
  if(won)return;
  if(i>=TIERS.length-1){ won=true; S.speed=0; syncSpeed();
    showModal(`<h2 style="color:var(--habit)">은하 문명 달성 ★</h2>
      <p>인류는 <b>${TIERS[TIERS.length-1].n}</b>에 도달했습니다.<br>
      거주 가능 행성 <b>${primeCount()}</b>곳 · 메가구조물 <b>${megaTotal()}</b>단계 · 총 인구 <b>${fmtPop(totalPop())}</b><br>
      제국 점수 <b style="color:var(--amber)">${fmt(score())}</b></p>
      <div class="row"><button class="act solid" id="mClose">계속 플레이</button></div>`,true);
    $("mClose").onclick=()=>closeModal(); }
}

/* ============ 알림 (자동 소멸 토스트) ============ */
function notify(msg,type){
  const log=$("log"); if(!log)return;
  const el=document.createElement("div"); el.className="logi "+(type||""); el.innerHTML=msg;
  log.prepend(el);
  while(log.children.length>3) log.lastChild.remove();   // 화면엔 최대 3개
  setTimeout(()=>{el.classList.add("out"); setTimeout(()=>el.remove(),450);}, 4200); // 4.2초 후 사라짐
}
let _lastNote="",_lastNoteAt=0;
/* ── 소식 기록 ────────────────────────────────────────────────
   토스트는 4.2초면 사라진다. 4배속으로 돌리다 보면 무엇이 지나갔는지 알 수 없어서,
   같은 내용을 소식함에 남긴다. 최근 100개까지. */
const NEWS_CAP=100;
function newsList(){ if(!S.news||!Array.isArray(S.news)) S.news=[]; return S.news; }
function addNews(html,type){
  const L=newsList();
  if(L.length && L[0].h===html && S.t-L[0].t < 2) return;   // 같은 줄이 연달아 들어오는 것 방지
  L.unshift({h:html, k:type||"", t:S.t, day:S.day});
  if(L.length>NEWS_CAP) L.length=NEWS_CAP;
}
function pushLog(msg,type){
  addNews(msg,type);                                    // 화면에서 사라져도 기록엔 남는다
  const now=Date.now();
  if(msg===_lastNote && now-_lastNoteAt<1500) return;   // 같은 알림이 연달아 뜨는 것을 막는다
  _lastNote=msg; _lastNoteAt=now; notify(msg,type);
}
function toast(msg,type){notify(msg,type||"warn");}
function renderLog(){}   // 알림은 이제 상시 표시하지 않음 (자동 소멸)

/* ============ 저장 ============ */
const KEY="goldilocks_v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* 예전 저장 파일의 기술 성과를 새 격자로 옮긴다.
   여러 옛 기술이 한 새 기술로 합쳐지므로 레벨은 더하되 새 상한에서 자른다. */
/* 상위 구역 8종은 v88에서 없앴다. 그걸 지어둔 세이브가 칸과 생산을 잃지 않도록
   같은 역할의 기본 구역으로 바꿔 넣는다 (칸 수는 1:1이라 슬롯이 흔들리지 않는다). */
const DIST_MIGRATE={fusion:"energy", singular:"energy", orbital:"housing", arcology:"housing",
                    deepmine:"mining", hydro:"agri", campus:"lab", foundry:"refinery"};
function migrateDistricts(st){
  if(!st || !st.colonies) return st;
  for(const key in st.colonies){
    const col=st.colonies[key]; if(!col) continue;
    const d=col.districts||{};
    for(const from in DIST_MIGRATE){
      if(!d[from]) continue;
      const to=DIST_MIGRATE[from];
      d[to]=(d[to]||0)+d[from]; delete d[from];
    }
    if(col.bld && DIST_MIGRATE[col.bld.dk]) col.bld.dk=DIST_MIGRATE[col.bld.dk];
    if(Array.isArray(col.q)) col.q.forEach(it=>{ if(DIST_MIGRATE[it.dk]) it.dk=DIST_MIGRATE[it.dk]; });
  }
  return st;
}
/* 예전에는 제국 전체에 연구 하나(ractive/rprog)였다 → 갈래별 슬롯으로 옮긴다 */
/* 옛 세이브에는 씨앗도 시작 조건도 없다. 씨앗 0 = 예전과 똑같은 은하라 배치가 바뀌지 않는다. */
function migrateSeed(st){
  if(!st) return st;
  if(!Array.isArray(st.news)) st.news=[];
  if(!Array.isArray(st.pend)) st.pend=[];
  if(st.scan===undefined) st.scan=null;
  if(typeof st.gseed!=="number") st.gseed=0;
  if(!STARTS[st.startId]) st.startId="standard";
  return st;
}
function migrateResearch(st){
  if(!st) return st;
  if(!st.ract || typeof st.ract!=="object") st.ract={};
  if(st.ractive && TECHS[st.ractive]){
    const br=TECHS[st.ractive].br;
    if(!st.ract[br]) st.ract[br]={k:st.ractive, prog:st.rprog||0};
  }
  delete st.ractive; delete st.rprog;
  return st;
}
function migrateTech(st){
  migrateDistricts(st); migrateResearch(st); migrateSeed(st);
  if(!st || !st.tech) return st;
  const old=st.tech, next={};
  for(const k in old){
    const lv=old[k]|0; if(lv<=0) continue;
    if(TECHS[k]){ next[k]=(next[k]||0)+lv; continue; }      // 이미 새 id
    const to=TECH_MIGRATE[k]; if(!to||!TECHS[to]) continue;  // 대응 없는 기술은 버린다
    next[to]=(next[to]||0)+lv;
  }
  for(const k in next){ const mx=TECHS[k].max; if(mx!==Infinity) next[k]=Math.min(next[k],mx); }
  /* 분기는 한쪽만 남긴다 */
  for(const k in next){ const T=TECHS[k];
    if(T.kind==="fork" && next[T.pair]) delete next[T.pair]; }
  /* 각인은 2개까지만 */
  let picked=0; DOCTS.forEach(([id])=>{ if(next[id]){ if(++picked>DOCT_PICK) delete next[id]; } });
  st.tech=next; return st;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=migrateTech(JSON.parse(raw));return true;}}catch(e){}return false;}
function exportSave(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function importSave(c){try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(o&&o.res&&o.colonies){S=migrateTech(o);won=primeCount()>=GOAL_PRIME;save();renderAll();return true;}}catch(e){}return false;}

/* 창은 전부 이 함수를 거친다. 오른쪽 위 X 를 여기서 한 번만 붙인다 —
   창마다 따로 닫기 버튼을 만들면 어떤 창은 아래, 어떤 창은 없는 지금 상태가 된다.
   closable=false 는 '반드시 골라야 하는 창'(사건 선택지)에만 쓴다. */
function closeModal(){ $("modal").classList.remove("on"); if(typeof syncTabs==="function") syncTabs(); }
function showModal(html,center,closable){
  const m=$("modal"), c=$("modalCard");
  const wasOpen=m.classList.contains("on"), keep=wasOpen?c.scrollTop:0;   // 새로 열면 맨 위, 갱신이면 위치 유지
  c.className="card"+(center?" center":"");
  c.innerHTML=(closable===false?"":`<button class="card-x" id="cardX" aria-label="닫기" data-tip="닫기">✕</button>`)+html;
  m.classList.add("on"); c.scrollTop=keep;
  const x=$("cardX"); if(x) x.onclick=closeModal;
}

}

/* 기술 아이콘 하나 — 그림이 없으면 이모지로 떨어진다 */
function tico(k,px){
  const b=TECH_SVG[k];
  if(!b) return (TECHS[k]&&TECHS[k].icon)||"";
  /* data-tip 속성 안에도 들어가므로 큰따옴표가 있으면 속성이 조기 종료된다 */
  const st = px ? ` style='width:${px}px;height:${px}px'` : "";
  return `<svg class='tgi${px?" inl":""}' viewBox='0 0 512 512'${st} aria-hidden='true'>${b.replace(/"/g,"'")}</svg>`;
}

/* ============ 기술 격자 화면 ============
   9계열(행) × 5시대(열) 격자. 시대 Ⅲ 뒤에 '택 1' 분기가 붙고, 아래에 각인 8개가 온다. */
const TG_BC={"확장":"var(--sky)","생산":"var(--marginal)","사회":"var(--j-research)"};
function tgState(k){
  const T=TECHS[k], l=techLvl(k);
  if(techBarred(k)) return "barred";
  if(T.max!==Infinity && l>=T.max) return "max";
  if(l>0) return "has";
  return techOpen(k) ? "open" : "lock";
}
function tgNode(k){
  const T=TECHS[k], l=techLvl(k), st=tgState(k);
  const ing=rIsActive(k), et=ing?rEta(T.br):null;
  /* 평소엔 '몇 레벨까지 올렸나', 연구 중일 땐 '이번 연구가 몇 % 왔나'를 같은 막대에 보여준다.
     연구 중인 노드는 테두리가 다르고 탭에도 점이 뜨므로 헷갈리지 않는다. */
  const pct = ing ? et.pct : (T.max===Infinity ? 100 : Math.round(l/T.max*100));
  return `<button class="tg-node ${st}${ing?" ing":""}${S.tsel===k?" sel":""}" data-tg="${k}"
    aria-label="${T.name}"><span class="ic">${tico(k)}</span><span class="fl${ing?" run":""}"><i style="width:${pct}%"></i></span></button>`
    + (S.tsel===k ? tgPop(k) : "");
}
/* 갈래 하나(계열 3개)를 3열 × 세로 시대로 그린다 */
function tgGrid(br){
  const trunk={}; TRUNK.forEach(([id,,,era,,ln])=>{ trunk[ln+"@"+era]=id; });
  const forkOf={}; for(let i=0;i<FORKS.length;i+=2) forkOf[FORKS[i][3]]=[FORKS[i][0],FORKS[i+1][0]];
  const lns = LINE_ORDER.filter(ln=>LINES[ln].br===br);
  let h=`<section class="tg-sec" style="--bc:${TG_BC[br]}"><div class="tg-g"><div></div>`;
  lns.forEach(ln=>{ h+=`<div class="tg-ch"><b>${LINES[ln].n}</b><u>${LINES[ln].own}</u></div>`; });
  for(let e=1;e<=5;e++){
    if(e>1) h+=`<div class="tg-vr">`+lns.map(ln=>
      `<i class="${techLvl(trunk[ln+"@"+(e-1)])>0?"lit":""}"></i>`).join("")+`</div>`;
    h+=`<div class="tg-el ${curEra()===e?"now":eraOpen(e)?"on":""}"
           data-tip="시대 ${ERAS[e].rn} · ${ERAS[e].n} — 기술마다 ${ERAS[e].max}레벨${eraOpen(e)?"":` · 아직 열리지 않았습니다 (시대 ${ERAS[e-1].rn} 기술 ${ERA_GATE[e]}종 필요)`}">${ERAS[e].rn}</div>`;
    lns.forEach((ln,ci)=>{
      const k=trunk[ln+"@"+e], T=TECHS[k], l=techLvl(k), st=tgState(k);
      h+=`<div class="tg-vc ${st} c${ci}${e===1?" dn":""}">${tgNode(k)}<span class="tg-cp">${T.name}</span>
            <span class="tg-lv">${l}/${T.max}</span></div>`;
    });
    if(e===3){
      h+=`<div class="tg-vr">`+lns.map(ln=>
        `<i class="${techLvl(trunk[ln+"@3"])>0?"lit":""}"></i>`).join("")+`</div>`;
      h+=`<div class="tg-el fk" data-tip="분기 — 계열마다 하나만 고를 수 있고, 고르지 않은 쪽은 영원히 잠깁니다">택1</div>`;
      lns.forEach((ln,ci)=>{
        const [a,b]=forkOf[ln], dec=techLvl(a)>0||techLvl(b)>0;
        h+=`<div class="tg-vc c${ci}"><div class="tg-fkb${dec?" dec":""}">${tgNode(a)}${tgNode(b)}</div>
          <div class="tg-fc">${[a,b].map(x=>{
            const c = dec ? (techLvl(x)>0?"on":"off") : "";
            return `<span class="${c}">${TECHS[x].name}</span>`;}).join("")}</div></div>`;
      });
    }
  }
  return h+`</div></section>`;
}
/* 초월 — 각인 8개(2개 선택) + 반복 연구 6개(모든 연구 완료 후) */
function tgTransc(){
  const left=researchLeft();
  let h=`<div class="emp-h">각인 <small>시대 Ⅴ · 8개 중 <b style="color:var(--j-research)">${DOCT_PICK}개</b>만 선택 · 되돌릴 수 없음 (${doctPicked()}/${DOCT_PICK} 선택함)</small></div>`;
  h+=`<div class="tg-doc">`+DOCTS.map(([id])=>{
    const T=TECHS[id], st=tgState(id);
    return `<button class="tg-d ${st}${S.tsel===id?" sel":""}" data-tg="${id}"><span class="ic">${tico(id)}</span>
      <div><b>${T.name}</b><u>${effText(id,1).replace(/<[^>]+>/g,"")}</u>
      ${S.tsel===id?`<em class="dhint">${tgHint(id)}</em>`:""}</div></button>`;}).join("")+`</div>`;
  h+=`<div class="emp-h" style="margin-top:12px">반복 연구 <small>${
    left ? `🔒 모든 연구를 마쳐야 열립니다 — <b style="color:var(--amber-2)">${left}개</b> 남음`
         : `열렸습니다 — 끝이 없는 무한 기술입니다`}</small></div>`;
  h+=`<div class="tg-doc">`+REPS.map(([id])=>{
    const T=TECHS[id], st=tgState(id), l=techLvl(id);
    return `<button class="tg-d ${st}${S.tsel===id?" sel":""}" data-tg="${id}"><span class="ic">${tico(id)}</span>
      <div><b>${T.name}${l?` <em style="font-style:normal;color:var(--amber)">Lv.${l}</em>`:""}</b>
      <u>${effText(id,1).replace(/<[^>]+>/g,"")}</u>
      ${S.tsel===id?`<em class="dhint">${tgHint(id)}</em>`:""}</div></button>`;}).join("")+`</div>`;
  return h;
}
/* 구조물 — 메가구조물 */
function tgMega(){
  let h=`<div class="emp-h">메가구조물 <small>후반부의 대형 건설 — 광물과 에너지를 대량 소모합니다</small></div>`;
  h+=`<div class="megas">`;
  MEGA_KEYS.forEach(k=>{
    const M=MEGA[k], l=megaLvl(k), mx=megaMax(k), done=l>=mx, c=megaCost(k);
    const ok=!done&&S.res.minerals>=c.minerals&&S.res.energy>=c.energy;
    h+=`<div class="mega ${done?'done':ok?'ok':''}">
      <div class="mg-h"><span class="ti">${uico("m_"+k,M.icon,17)}</span><span class="tn">${M.name}</span><span class="tl">${l}/${mx}</span></div>
      <div class="tbar">${Array.from({length:mx},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join("")}</div>
      <div class="te">${l?M.eff(l):''}${done?'':`<span class="nx">${l?' → ':''}${M.eff(l+1)}</span>`}</div>
      <div class="mg-d">${M.desc}</div>
      ${done?`<div class="tmax">완공</div>`
            :`<button class="act ${ok?'solid':''}" data-mega="${k}" ${ok?'':'disabled'}>건설 · ${rIco("minerals",12)}${fmt(c.minerals)} ${rIco("energy",12)}${fmt(c.energy)}</button>`}
    </div>`;
  });
  return h+`</div>`;
}
/* 상단 탭 — 확장 · 생산 · 사회 · 초월 · 구조물 */
const TG_TABS=["확장","생산","사회","초월","구조물"];
function tgTabs(){
  const cur=S.tgTab||"확장";
  return `<div class="tg-tabs">`+TG_TABS.map(t=>{
    let sub="", full=false, bc=TG_BC[t]||"var(--amber)";
    if(TECH_BRANCHES.includes(t)){
      let got=0,all=0;
      TECH_KEYS.forEach(k=>{const T=TECHS[k];
        if(T.br!==t||T.kind==="rep"||T.kind==="doct") return;
        all+=T.max; got+=Math.min(techLvl(k),T.max);});
      sub=`${got}/${all}`; full=got>=all;
    } else if(t==="초월"){
      bc="var(--j-research)";
      const rl=techLvl&&REPS.reduce((a,r)=>a+techLvl(r[0]),0);
      sub=`각인 ${doctPicked()}/${DOCT_PICK}${allResearchDone()?` · 반복 ${rl}`:""}`;
      full=doctPicked()>=DOCT_PICK;
    } else {
      bc="var(--habit)";
      const tot=MEGA_KEYS.reduce((a,k)=>a+megaMax(k),0);
      sub=`${megaTotal()}/${tot}`; full=megaTotal()>=tot;
    }
    const busy = TECH_BRANCHES.includes(t) && !!rOf(t);
    if(busy){ const e=rEta(t); sub=`${sub} · ${e.mo===null?"정지":e.pct+"%"}`; }
    return `<button class="tg-tab ${cur===t?"on":""} ${full?"full":""}${busy?" busy":""}" style="--bc:${bc}"
      data-tgtab="${t}"><b>${t}</b><u>${sub}</u><i></i></button>`;
  }).join("")+`</div>`;
}
function tgPanel(){
  const t=S.tgTab||"확장";
  if(t==="구조물") return tgMega();
  if(t==="초월")   return tgTransc();
  return tgGrid(t);
}
function tgWhy(k){
  const T=TECHS[k];
  if(T.kind==="rep"){
    if(!allResearchDone())        return `모든 연구 완료 후 · ${researchLeft()}개 남음`;
    return `한계 도달 — ${Math.round(CUT_LIMIT*100)}%보다 더 줄일 수 없습니다`; }
  if(!eraOpen(T.era))             return `시대 ${ERAS[T.era].rn} 미개방 · 시대 ${ERAS[T.era-1].rn} 기술 ${ERA_GATE[T.era]}종 필요`;
  if(T.kind==="fork"&&T.pre)      return `${TECHS[T.pre].name} 만렙 필요`;
  if(T.kind==="doct")             return `각인 ${DOCT_PICK}개 선택 완료`;
  if(T.pre&&!techLvl(T.pre))      return `${TECHS[T.pre].name} 먼저`;
  return "잠김";
}
/* 다음에 무엇이 일어나는지 한 줄 */
function tgHint(k){
  const T=TECHS[k], c=techCost(k);
  if(techBarred(k)) return `${TECHS[T.pair]?TECHS[T.pair].name:"반대쪽"} 선택으로 잠김`;
  if(T.max!==Infinity && techLvl(k)>=T.max) return "확보 완료";
  if(rIsActive(k)){ const e=rEta(T.br);
    return `연구 중 · ${e.pct}% · ${rEtaTxt(e)}`; }
  if(rOf(T.br)){ const e=rEta(T.br);
    return `${T.br} 트리에서 ${TECHS[rOf(T.br).k].name} ${e.pct}% 진행 중`; }
  if(!techOpen(k))  return tgWhy(k);
  if(S.res.minerals<c.minerals) return `광물 부족 (${fmt(c.minerals)} 필요)`;
  return `한 번 더 눌러 연구`;
}
/* 노드 위에 뜨는 작은 팝업 — 이름·효과·비용·다음 동작만 */
function tgPop(k){
  const T=TECHS[k], l=techLvl(k), c=techCost(k), st=tgState(k);
  const lv = T.max===Infinity ? `Lv.${l}` : T.max===1 ? (l?"보유":"미보유") : `${l}/${T.max}`;
  const canGo = !rOf(T.br) && techOpen(k) && S.res.minerals>=c.minerals;
  let hint=tgHint(k), cls = canGo ? "go" : (st==="max" ? "" : "no");
  if(canGo && T.kind==="fork") hint="한 번 더 눌러 확정 (되돌릴 수 없음)";
  return `<div class="tgpop">
    <div class="pn"><b>${T.name}</b><u>${lv}</u></div>
    <div class="pe">${effText(k,1)}</div>
    ${st==="max"||st==="barred"?"":`<div class="pc">${rIco("research",11)}${fmt(c.research)} ${rIco("minerals",11)}${fmt(c.minerals)}</div>`}
    <div class="ph ${cls}">${hint}</div></div>`;
}
function tgDetail(){
  const k=S.tsel && TECHS[S.tsel] ? S.tsel : "p1";
  const T=TECHS[k], l=techLvl(k), c=techCost(k), st=tgState(k);
  const kindTxt = T.kind==="fork" ? "시대 Ⅲ · 택 1" : T.kind==="doct" ? "시대 Ⅴ · 각인"
                : T.kind==="rep" ? "반복 연구 · 무한" : `시대 ${ERAS[T.era].rn} ${ERAS[T.era].n}`;
  let lockWhy = "선행 기술 필요";
  if(st==="lock"){
    if(T.kind==="rep")              lockWhy = allResearchDone()
      ? `한계 도달 — ${Math.round(CUT_LIMIT*100)}%보다 더 줄일 수 없습니다`
      : `모든 연구 완료 후 · ${researchLeft()}개 남음`;
    else if(!eraOpen(T.era))        lockWhy = `시대 ${ERAS[T.era].rn} 미개방 · 시대 ${ERAS[T.era-1].rn} 기술 ${ERA_GATE[T.era]}종 필요`;
    else if(T.kind==="fork"&&T.pre) lockWhy = `${TECHS[T.pre].name} 만렙 필요`;
    else if(T.kind==="doct")        lockWhy = `각인 ${DOCT_PICK}개를 이미 골랐습니다`;
    else if(T.pre)                  lockWhy = `${TECHS[T.pre].name} 먼저 연구`;
  }
  const stTxt = {barred:"포기함 — 영구 잠김", max:"확보 완료", has:"연구 중 아님 · 더 올릴 수 있음",
                 open:"연구 가능", lock:lockWhy}[st];
  /* 수치 칸에서는 '레벨당' 줄과 겹치는 이름을 떼고 숫자만 남긴다 (좁은 화면에서 3줄이 되던 문제) */
  const base=effText(k,1);
  /* '레벨당' 줄에 이미 나온 이름을 떼고 숫자만 남긴다.
     Lv0 에서는 다음 레벨 문구가 base 와 완전히 같아 예전엔 이름이 그대로 남았다. */
  const lbl=(base.match(/^[^+\-\u2212 0-9]*[^+\-\u22120-9]*/)||[""])[0];
  const trim=(t)=>{ if(T.max===1) return t;
    if(lbl.length>1 && t.startsWith(lbl)) return t.slice(lbl.length).trim();
    let i=0; while(i<t.length&&i<base.length&&t[i]===base[i]) i++;
    const cut=t.slice(0,i).lastIndexOf(" ");
    return cut>1 ? t.slice(cut+1) : t; };
  const one  = T.max===1;                                   // 분기·각인은 레벨이 하나뿐
  const now  = one ? (l>0?"적용 중":"미적용") : (l>0 ? trim(effText(k,l)) : "—");
  const next = one ? (l>0?"—":"적용") : ((T.max!==Infinity && l>=T.max) ? "만렙" : trim(effText(k,l+1)));
  const canStart = !rOf(T.br) && techOpen(k) && S.res.minerals>=c.minerals;
  let note = "";
  if(T.kind==="fork"){ const o=TECHS[T.pair];
    note = techLvl(T.pair)>0 ? `<b style="color:var(--hostile)">${o.name}</b>${josa(o.name,"을/를")} 골라서 이 기술은 영원히 잠겼습니다.`
         : `이걸 고르면 <b>${o.name}</b>${josa(o.name,"은/는")} 이 게임에서 영원히 잠깁니다.`; }
  else if(T.kind==="doct") note = `각인은 제국 전체에 붙습니다. <b>8개 중 ${DOCT_PICK}개</b>만 고를 수 있습니다.`;
  else if(T.kind==="rep")  note = `끝이 없는 반복 연구입니다.`;
  else note = `<b>${LINES[T.line].n}</b> 계열이 <b>${LINES[T.line].own}</b> 수치를 단독으로 담당합니다.`;
  return `<div class="tg-det">
    <div class="di">${tico(k)}</div>
    <div class="db">
      <h4>${T.name}</h4>
      <div class="dm">${T.br} · ${T.lineName} · ${kindTxt} · ${stTxt}</div>
      <div class="de">레벨당 ${effText(k,1)}</div>
      <div class="tg-vs">
        <div><u>기술 보정 수치</u><b>${now}</b></div>
        <div><u>다음 레벨</u><b class="${next==="만렙"?"na":"up"}">${next}</b></div>
        <div><u>레벨</u><b>${l} / ${T.max===Infinity?"∞":T.max}</b></div>
      </div>
      <div class="dm" style="margin:6px 0 0">${note}</div>
    </div>
    <div class="dc"><u>비용</u><b>${rIco("research",11)}${fmt(c.research)}</b><b>${rIco("minerals",11)}${fmt(c.minerals)}</b>
      <button class="act ${canStart?"solid":""}" data-start="${k}" ${canStart?"":"disabled"}>${
        st==="barred"?"잠김":st==="max"?"완료":rOf(T.br)?"연구 중":techOpen(k)?"연구 지정":"잠김"}</button></div>
  </div>`;
}

function openEmpire(){
  let h=`<h2 style="margin-bottom:2px">${uico("ui_tech","⚛",17)} 기술</h2>`;
  // ── 기술 격자 — 상단 탭으로 구역을 나눈다 ──
  if(!S.tgTab || TG_TABS.indexOf(S.tgTab)<0) S.tgTab="확장";
  h+=`<div id="tgTabs">`+tgTabs()+`</div>`;
  h+=`<div id="tgBox">`+tgPanel()+`</div>`;

  showModal(h);
  $("modalCard").classList.add("fixh");     // 탭을 바꿔도 창 크기가 그대로
  $("modalCard").querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startResearch(b.dataset.start));
  /* 탭과 격자는 클릭을 상자에 위임한다 — 다시 그려도 핸들러가 살아 있다 */
  const box=$("tgBox"), tabs=$("tgTabs");
  const redraw=()=>{ if(tabs) tabs.innerHTML=tgTabs(); if(box) box.innerHTML=tgPanel(); fitTgPop();
    if(box) box.querySelectorAll("[data-mega]").forEach(b=>b.onclick=()=>buildMega(b.dataset.mega)); };
  if(tabs) tabs.onclick=(ev)=>{ const t=ev.target.closest("[data-tgtab]"); if(!t) return;
    S.tgTab=t.dataset.tgtab; redraw(); };
  if(box) box.onclick=(ev)=>{
    if(ev.target.closest("[data-mega]")) return;                 // 메가 버튼은 자체 핸들러
    const n=ev.target.closest("[data-tg]");
    if(!n){ if(S.tsel){ S.tsel=null; redraw(); } return; }        // 빈 곳을 누르면 팝업을 닫는다
    const k=n.dataset.tg;
    if(S.tsel===k){                                              // 같은 노드를 한 번 더 → 연구
      if(!rOf(TECHS[k].br) && techOpen(k) && S.res.minerals>=techCost(k).minerals){
        S.tsel=null; startResearch(k); return; }
      S.tsel=null; redraw(); return;                             // 못 하면 팝업만 닫는다
    }
    S.tsel=k; redraw();
  };
  $("modalCard").querySelectorAll("[data-mega]").forEach(b=>b.onclick=()=>buildMega(b.dataset.mega));
  const ok=$("mOk"); if(ok)ok.onclick=()=>closeModal();
}
/* 기술 화면이 열려 있는 동안 진행 바·수치를 살아 있게 갱신한다.
   전체를 다시 그리면 스크롤이 튀므로 해당 요소만 손댄다. */
function refreshEmpireLive(){
  const m=$("modal"); if(!m||!m.classList.contains("on"))return;
  const box=$("tgBox"); if(!box) return;              // 기술 화면이 아닐 때는 무시
  /* 연구가 끝났거나 막 시작했으면 격자 상태가 달라진다 — 그때만 다시 그린다 */
  const sig=R_BRANCHES.map(b=>{const a=rOf(b); if(!a) return "-";
                               const e=rEta(b); return a.k+":"+e.pct+":"+(e.mo===null?"x":e.mo);}).join("|")
           +"|"+JSON.stringify(S.tech||{});
  if(box._sig===sig) return;
  box._sig=sig;
  const tabs=$("tgTabs"); if(tabs) tabs.innerHTML=tgTabs();
  box.innerHTML=tgPanel();
  box.querySelectorAll("[data-mega]").forEach(b=>b.onclick=()=>buildMega(b.dataset.mega));
  fitTgPop();
}
/* 설정 — 돌아가기 · 저장하기 · 종료(메인 화면으로) 세 가지만 둔다.
   게임 설명은 메인 화면의 '설명'과 상단 도움말 버튼에 있다. */
/* 설정 — 게임 관리를 여기 한 곳에 모았다.
   예전에는 상단 메뉴·도움말 창·설정 창 세 군데에 같은 버튼이 흩어져 있었다. */
/* ── 소식함 ─────────────────────────────────────────────────────
   미결(결정 대기) → 진행 중(상황·위기·조사) → 지난 소식 순으로 쌓는다. */
const NEWS_FILTERS=["전체","미결","경고","완료"];
function newsRow(cls,ic,title,body,right,rsub,attr){
  return `<button class="ni ${cls||""}" ${attr||""}>
    <span class="ni-i">${ic||""}</span>
    <span class="ni-x"><b>${title}</b>${body?`<u>${body}</u>`:""}</span>
    <span class="ni-r">${right||""}${rsub?`<b>${rsub}</b>`:""}</span></button>`;

function openNews(){

  let h=`<h2>${uico("ui_news","✉",17)} 소식</h2>`;

      return `<button class="${f===x?"on":""}" data-nf="${x}">${x}${n?`<i>${n}</i>`:""}</button>`;}).join("")+`</div>`;
  h+=`<div id="newsBox">${newsBody()}</div>`;
  showModal(h,false);

function bindNews(box){
  box.querySelectorAll("[data-pend]").forEach(b=>b.onclick=()=>openPending(b.dataset.pend));
  box.querySelectorAll("[data-sit]").forEach(b=>b.onclick=()=>{ closeModal(); openSituation(); });
  box.querySelectorAll("[data-cri]").forEach(b=>b.onclick=()=>{ closeModal(); openCrisis(); });
}
function newsBody(){
  const f=S.nFil||"전체", e=evState(), P=pendList(), L=newsList();
  let h="";
  // 결정을 기다리는 중
  if((f==="전체"||f==="미결") && P.length){
    h+=`<div class="nsec">결정을 기다리는 중</div><div class="nl">`;
    P.slice().sort((a,b)=>a.due-b.due).forEach(x=>{ const ev=evById(x.id); if(!ev) return;
      const mo=pendDueMo(x), n=ev.opts.filter(o=>!o.when||o.when()).length;
      h+=newsRow("act", evIco(ev.id,ev.icon,15), ev.title,
        `선택지 ${n}개 · 기한을 넘기면 그냥 지나갑니다`,
        dayStr(x.t0), `${mo}개월 남음`, `data-pend="${ev.id}"`);});
    h+=`</div>`;
  }
  // 진행 중
  if(f==="전체"||f==="미결"||f==="경고"){
    let mid="";
    if(e.crisis) mid+=newsRow("warn", evIco("c_void",CRISIS.icon,15), `${CRISIS.name} ${Math.round(e.crisis.prog)}%`,
      "자원을 투입해 막으세요", "진행 중","",`data-cri="1"`);
    if(e.sit){ const d=SITUATIONS[e.sit.id];
      mid+=newsRow(d.danger?"warn":"", evIco("s_"+e.sit.id,d.icon,15), `${d.name} ${Math.round(e.sit.prog)}%`,
        `대응 — ${(d.approaches.find(a=>a.id===e.sit.ap)||d.approaches[0]).t}`, "진행 중","",`data-sit="1"`);}
    if(S.probe){ const sy=sysById(S.probe.id);
      mid+=newsRow("", uico("ui_scan","🔬",15), `${sy?sy.name:"행성"} 조사 중`,
        `${Math.max(0,S.probe.left)}일 남음`, "진행 중");}
    if(mid) h+=`<div class="nsec">진행 중</div><div class="nl">${mid}</div>`;
  }
  // 지난 소식
  if(f!=="미결"){
    const rows=L.filter(x=> f==="전체" ? true : f==="경고" ? x.k==="warn" : x.k==="good");
    if(rows.length){
      h+=`<div class="nsec">지난 소식 <small>${rows.length}건</small></div><div class="nl">`;
      rows.slice(0,60).forEach(x=>{
        h+=`<button class="ni ${x.k==="warn"?"warn":""} plain"><span class="ni-x2">${x.h}</span>
             <span class="ni-r">${dayStr(x.t)}</span></button>`;});
      h+=`</div>`;
    }
  }
  if(!h) h=`<div class="tmax">아직 소식이 없습니다.</div>`;
  return h;
}
/* 게임 내 날짜를 짧게 (2200.03) */
function dayStr(t){ const d=Math.floor((t||0)*DAYS_PER_SEC);
  const y=2200+Math.floor(d/365), m=Math.floor((d%365)/30.4)+1;
  return `${y}.${String(m).padStart(2,"0")}`; }

let _nsPick="standard", _nsSeed=null;
function openNewGame(){
  _nsPick="standard"; _nsSeed=newSeed();
  const draw=()=>`<div class="ng-list">`+Object.keys(STARTS).map(k=>{
      const D=STARTS[k];
      return `<button class="ng-o ${_nsPick===k?"on":""}" data-ns="${k}">

/* 기본 배율 — 은하 전체(300개)를 한 화면에 뿌리면 별 사이 간격이 22px 밖에 안 돼서

   그래서 '지금 갈 수 있는 범위(사거리 원)'가 화면을 적당히 채우도록 맞춘다.
   사거리가 늘면 자동으로 넓어지므로, 게임 진행과 시야가 함께 커진다. */
const ZOOM_MIN=0.55, ZOOM_MAX=9;

/* ── 시야 단계 ──────────────────────────────────────────────
   별 55개를 한 화면에 다 뿌리면 다시 빽빽해진다. 그래서 거리로 4단계를 나누고,
   지도를 축소할 때마다 한 단계씩 더 먼 별이 드러나게 한다.
   각 단계는 '그 범위가 화면을 꽉 채우는 배율'을 갖고, 그보다 먼 별은 아예 감춘다.
   별 크기는 어느 단계에서나 화면상 35px 로 같다 — 그래서 축소해도 점이 작아지지 않는다. */
const VIEW_TIERS=[
  {n:"근거리", ly:25,       d:"태양계 이웃"},
  {n:"중거리", ly:120,      d:"인근 항성계"},
  {n:"원거리", ly:900,      d:"나선 팔 안쪽"},
  {n:"심우주", ly:Infinity, d:"은하 전체"},
];
const TIER_FILL=48;                       // 그 단계의 범위가 화면 반지름의 몇 %를 차지할지
function tierR(i){                        // 단계 i 의 화면 반지름(%)
  const t=VIEW_TIERS[i], d=(t.ly===Infinity)?GALAXY_EDGE:t.ly;
  return (Rof(d)/maxR)*44*MAP_SPAN;
}
function tierZoom(i){ return clamp(TIER_FILL/Math.max(tierR(i),0.5), ZOOM_MIN, ZOOM_MAX); }
/* 지금 배율이 어느 단계인지 — 핀치로 자유롭게 줌해도 단계가 따라온다 */
function curTier(){
  for(let i=0;i<VIEW_TIERS.length-1;i++){
    const mid=Math.sqrt(tierZoom(i)*tierZoom(i+1));      // 두 단계의 중간(로그 기준)
    if(zoom>=mid) return i;
  }
  return VIEW_TIERS.length-1;
}
const tierLy=()=>VIEW_TIERS[curTier()].ly;
function HOME_ZOOM(){
  if(!S||typeof maxR==="undefined"||!maxR) return 2.3;
  /* 시작 배율 — 내가 실제로 쓰는 범위(식민지·탐사)를 담는 가장 좁은 단계 */
  let used=0;
  for(const k in (S.colonies||{})){ const sy=sysById(k.split("|")[0]); if(sy) used=Math.max(used,sy.dist); }
  for(const id in (S.surveyed||{})){ const sy=sysById(id); if(sy) used=Math.max(used,sy.dist); }
  for(let i=0;i<VIEW_TIERS.length;i++) if(used*1.15<=VIEW_TIERS[i].ly) return tierZoom(i);
  return tierZoom(VIEW_TIERS.length-1);
}
let zoom=2.6, panX=0, panY=0;
function applyMapTransform(){
  const z=$("mapzoom");
  if(z){ z.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
    /* 별·이름표는 역수로 되돌려 화면상 크기를 유지한다 (아주 축소했을 땐 조금 작게 둔다) */
    z.style.setProperty("--iz", (1.6/zoom).toFixed(3)); }   // 어느 단계에서나 별은 화면상 35px
  const mw=$("mapwrap"); if(mw){ mw.classList.toggle("zoomed",zoom>1.7);
    if(typeof curTier==="function"){ const t=curTier();
      mw.classList.toggle("farview", t>=2);
      mw.classList.toggle("artview", t===0); } }
  /* 배율이 바뀌면 이름표 간격도 바뀐다 — 3% 넘게 바뀌었을 때만 다시 정리한다(핀치 중 매 프레임 계산 방지) */
  if(_lblZoom>0 && Math.abs(zoom-_lblZoom)/_lblZoom>0.03 && typeof layoutLabels==="function") layoutLabels();
  if(typeof curTier==="function"){ const t=curTier();
    if(t!==_shownTier){ _shownTier=t; updateNodes(true); if(typeof renderLanes==="function"&&LANES.length) renderLanes(); renderTierChip(); } }}
let _shownTier=-1;
function renderTierChip(){
  const el=$("tierChip"); if(!el) return;
  const i=curTier(), t=VIEW_TIERS[i];
  const shown=SYSTEMS.filter(s2=>s2.dist<=t.ly).length;
  el.innerHTML=`<b>${t.n}</b><span>${t.ly===Infinity?"전체":"~"+t.ly+"ly"} · 별 ${shown}/${SYSTEMS.length}</span>`
    +`<i class="tdots">${VIEW_TIERS.map((_,k)=>`<em class="${k===i?'on':''}"></em>`).join("")}</i>`;
}
function zoomBy(f,cx,cy){const old=zoom; zoom=clamp(zoom*f,ZOOM_MIN,ZOOM_MAX); const k=zoom/old; panX=cx-(cx-panX)*k; panY=cy-(cy-panY)*k; applyMapTransform();}
function setupMapControls(){
  const mw=$("mapwrap");
  mw.addEventListener("wheel",e=>{e.preventDefault(); const r=mw.getBoundingClientRect(); zoomBy(e.deltaY<0?1.12:0.893, e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2);},{passive:false});
  /* 포인터 이벤트로 통일 — 마우스·터치·펜을 한 코드로 처리. 손가락 2개면 핀치 줌. */
  const pts=new Map(); let sx=0, sy=0, pinchD=0, pinchC=null, moved=0;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const mid =(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  /* 겹친 별 위에서 탭하면 브라우저는 'z축 맨 위'를 고른다 — 어느 별인지 예측할 수 없다.
     대신 손가락 지점에서 가장 가까운 별을 고른다. 화면상 거리로 판정하므로
     확대 배율과 무관하게 '누른 곳에서 제일 가까운 별'이 잡힌다. */
  function nearestNode(cx,cy,maxPx){
    let best=null, bd=maxPx;
    document.querySelectorAll(".node:not(.offtier)").forEach(n=>{
      const r=n.getBoundingClientRect();
      const d=Math.hypot(cx-(r.left+r.width/2), cy-(r.top+r.height/2));
      if(d<bd){ bd=d; best=n; } });
    return best;
  }
  mw.addEventListener("pointerdown",e=>{
    if(e.target.closest(".zoomctl,.panel-reopen,.maphint,#log")) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ sx=e.clientX; sy=e.clientY; moved=0; mw.classList.add("grabbing"); try{mw.setPointerCapture(e.pointerId);}catch(_){} }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; pinchD=dist(a,b); pinchC=mid(a,b); }
  });
  mw.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){                                   // 핀치 줌
      const [a,b]=[...pts.values()], d=dist(a,b), c=mid(a,b), r=mw.getBoundingClientRect();
      if(pinchD>0&&d>0) zoomBy(d/pinchD, c.x-r.left-r.width/2, c.y-r.top-r.height/2);
      pinchD=d; pinchC=c; e.preventDefault(); return;
    }
    panX+=e.clientX-sx; panY+=e.clientY-sy; moved+=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy);
    sx=e.clientX; sy=e.clientY; applyMapTransform(); e.preventDefault();
  });
  const endPt=e=>{
    // 끌지 않았으면 '탭' — 가장 가까운 별을 연다
    if(pts.size===1 && pts.has(e.pointerId) && moved<8 && !e.target.closest(".zoomctl,.panel-reopen,.maphint,#log")){
      const n=nearestNode(e.clientX,e.clientY,34);
      if(n){ const app=document.querySelector(".app");
        app.classList.remove("panel-closed"); app.classList.remove("sheet-peek");
        selSys=n.dataset.id; renderPanel(); updateNodes(true); }
    }
    pts.delete(e.pointerId);
    if(pts.size<2) pinchD=0;
    if(pts.size===1){ const p=[...pts.values()][0]; sx=p.x; sy=p.y; }
    if(pts.size===0) mw.classList.remove("grabbing"); };
  // iOS/안드로이드 웹뷰의 '뒤로가기 스와이프'가 지도 드래그와 겹치지 않도록 터치 기본동작을 차단
  mw.addEventListener("touchstart",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
  mw.addEventListener("touchmove",e=>{ e.preventDefault(); },{passive:false});
  mw.addEventListener("pointerup",endPt);
  mw.addEventListener("pointercancel",endPt);
  mw.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse") endPt(e); });
  /* ＋ − 는 시야 단계를 한 칸씩 옮긴다 (핀치는 그대로 자유롭게) */
  const goTier=i=>{ i=clamp(i,0,VIEW_TIERS.length-1); zoom=tierZoom(i); panX=0; panY=0;
    applyMapTransform(); updateNodes(true); if(LANES.length) renderLanes(); renderTierChip(); };
  $("zIn").onclick=()=>goTier(curTier()-1);
  $("zOut").onclick=()=>goTier(curTier()+1);
  $("zReset").onclick=()=>{zoom=HOME_ZOOM();panX=0;panY=0;applyMapTransform();updateNodes(true);if(LANES.length)renderLanes();renderTierChip();};
  zoom=HOME_ZOOM(); applyMapTransform(); renderTierChip();
}
/* ============ 은하 배경 (Sa 정상나선은하) — 별 배치와 정렬 ============ */
function drawNebula(){
  var c=$("nebula"); if(!c)return; var ctx=c.getContext("2d");
  var dpr=Math.min(window.devicePixelRatio||1,1.5);
  var W=c.clientWidth||800, H=c.clientHeight||800;
  c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, R=Math.min(W,H), mw=W/2.2;   // mw=mapwrap 폭(네뷸라 px 기준)
  // 원반 헤일로 (부드러운 원반빛)
  var disk=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.42);
  disk.addColorStop(0,'rgba(50,70,138,0.20)');disk.addColorStop(.5,'rgba(42,60,122,0.08)');disk.addColorStop(1,'rgba(42,60,122,0)');
  ctx.fillStyle=disk;ctx.beginPath();ctx.arc(cx,cy,R*0.42,0,6.2832);ctx.fill();
  // 색 성운 구름 (동심원 아닌, 흩어진 소프트 패치) — 나선은 별이 그림
  var neb=[[0.34,0.36,0.26,'120,70,205',0.16],[0.66,0.35,0.24,'50,165,185',0.14],
           [0.64,0.66,0.26,'220,80,120',0.13],[0.36,0.64,0.24,'70,140,205',0.12],
           [0.20,0.50,0.18,'60,180,150',0.10],[0.80,0.55,0.18,'170,100,210',0.11]];
  neb.forEach(function(n){var x=n[0]*W,y=n[1]*H,rad=n[2]*R;var g=ctx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,'rgba('+n[3]+','+n[4]+')');g.addColorStop(1,'rgba('+n[3]+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,6.2832);ctx.fill();});
  // 팽대부 (Sa 큰 노란 팽대부)
  var bulge=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.16);
  bulge.addColorStop(0,'rgba(255,236,198,0.40)');bulge.addColorStop(.4,'rgba(255,210,152,0.16)');bulge.addColorStop(1,'rgba(255,205,145,0)');
  ctx.fillStyle=bulge;ctx.beginPath();ctx.arc(cx,cy,R*0.16,0,6.2832);ctx.fill();
}
function starfield(){
  const c=$("stars");if(!c)return;const ctx=c.getContext("2d");let w,h,dpr,stars=[];
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=c.parentElement.clientWidth;h=c.parentElement.clientHeight;c.style.width=w+"px";c.style.height=h+"px";c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(600,Math.floor(w*h/2600));stars=[];for(let i=0;i<n;i++){const big=Math.random()<0.06;stars.push({x:Math.random()*w,y:Math.random()*h,r:big?Math.random()*1.1+1:Math.random()*1+.25,b:Math.random()*.55+.25,tw:Math.random()*6.28,sp:Math.random()*.02+.003,am:Math.random()<.08});}if(reduce)draw(true);}
  function draw(stat){ctx.clearRect(0,0,w,h);for(const s of stars){if(!stat)s.tw+=s.sp;let a=s.b+Math.sin(s.tw)*.28;if(a<0)a=0;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.2832);ctx.fillStyle=s.am?`rgba(246,183,60,${a})`:`rgba(200,216,240,${a})`;ctx.fill();}if(!stat)requestAnimationFrame(()=>draw(false));}
  resize();window.addEventListener("resize",()=>{resize();updateReach();});if(!reduce)requestAnimationFrame(()=>draw(false));
}

  else{selSys="sol";won=primeCount()>=GOAL_PRIME;
    /* v55.2 이전 세이브에는 일자리 배정(col.jobs)이 없다. 한 번 채워 넣는다. */
    for(const key in (S.colonies||{})) if(!S.colonies[key].jobs) rebalanceJobs(key); }
  rebalanceAll();                     // 어느 경로로 왔든 배정을 맞춘 상태에서 시작한다
  initMap();renderAll();renderLog();try{drawNebula();}catch(e){}try{starfield();}catch(e){}try{setupMapControls();}catch(e){}
  window.addEventListener("resize",function(){try{drawNebula();}catch(e){}});
  document.querySelectorAll("#speed button").forEach(b=>b.onclick=()=>{S.speed=+b.dataset.s;syncSpeed();save();});
  syncSpeed();
  /* 정적 HTML 안의 아이콘 자리를 실제 아이콘으로 채운다 (탭바·상단 메뉴) */
  document.querySelectorAll("[data-ui]").forEach(el=>{
    const h=uico(el.dataset.ui,""); if(h) el.innerHTML=h; });
  $("helpBtn").onclick=()=>openHelp(false);
  $("empBtn").onclick=openEmpire;
  // 바텀 시트(폰): 핸들로 접고 펼치기
  {const app=document.querySelector(".app"), hd=$("sheetHandle");
   if(hd) hd.onclick=()=>{ app.classList.toggle("sheet-peek"); };
   if(isPhone()) app.classList.add("sheet-peek");        // 폰은 지도부터 보여준다
   window.addEventListener("resize",()=>{ if(!isPhone()) app.classList.remove("sheet-peek"); });}
  window.addEventListener("keydown",e=>{
    if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
    if(e.key==="Escape"){ const m=$("modal");
      if(m.classList.contains("on") && $("cardX")) { closeModal(); return; } }
    if(e.key==="t"||e.key==="T"||e.key==="ㅅ"){ e.preventDefault();
      const m=$("modal"); if(m.classList.contains("on")) m.classList.remove("on"); else openEmpire(); }
  });
  // 행성 패널 닫기/열기
  const appEl=document.querySelector(".app");
  $("panelClose").onclick=()=>appEl.classList.add("panel-closed");
  $("panelReopen").onclick=()=>appEl.classList.remove("panel-closed");
  initTips();   // 통합 툴팁 (마우스 오버 / 터치 길게 누르기)
  {const pn=$("panel");
   if(pn){ ["pointerdown","pointermove","scroll","touchstart","touchmove","wheel"].forEach(ev=>
     pn.addEventListener(ev,markPanelBusy,{passive:true})); }}
  {const tb=$("tabbar"); if(tb) tb.querySelectorAll("button").forEach(b=>
     b.onclick=()=>setTab(b.dataset.tab));}
  {const sb=$("statBtn"); if(sb) sb.onclick=()=>openEmpireStats();}
  {const sb=$("setBtn"); if(sb) sb.onclick=openSettings;}
  setupTitle();
  timer=setInterval(tick,TICK_MS);
  showTitle();        // 언제나 메인 화면부터
}
boot();
</script>
