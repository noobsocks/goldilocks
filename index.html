<title>골디락스</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Gothic+A1:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --void:#080b12; --void-2:#0b0f18; --panel:#10151f; --panel-2:#151c29;
    /* 대비는 실측 기준이다 (WCAG AA 4.5:1). 예전 --dim(#5b6879)은 3.0~3.5로 미달이었고
       CSS 51곳에서 쓰이고 있었다 — 화면 곳곳이 읽히지 않던 가장 큰 원인. */
    --line:#334160;        /* 구분선 (대비 1.7~1.9) */
    --line-2:#4a5a78;      /* 누를 수 있는 요소의 테두리 (대비 2.5~2.8) */
    --line-soft:#212a3c;
    --ink:#eaf0fa;         /* 15.0~17.2 */
    --muted:#a3b0c4;       /* 7.8~9.0 */
    --dim:#75859c;         /* 4.6~5.2 — AA 통과 */
    --amber:#f6b73c; --amber-2:#ffcf6b; --amber-soft:rgba(246,183,60,.1); --amber-line:rgba(246,183,60,.45);
    --habit:#56d67f;
    --marginal:#ff8f3d;    /* 앰버와 ΔE 13.5 → 27.0 으로 분리 (같은 색으로 읽히던 문제) */
    --hostile:#f2685f; --sky:#6db6e8;
    /* 노동 구성 바 — 색상환에서 고르게 벌리고 명도도 겹치지 않게 */
    --j-goods:#63c8f0; --j-energy:#f7c948; --j-minerals:#7f8da6; --j-research:#bf90ff; --j-alloy:#ff7a52;
    /* 라틴은 기존 얼굴, 한글은 Gothic A1 로 통일 — 앞 얼굴에 한글 글리프가 없어 자연스럽게 넘어간다.
     (교체 지점: --f-ko 하나만 바꾸면 전체 한글 서체가 바뀐다) */
    --f-ko:"Gothic A1","Malgun Gothic",system-ui,sans-serif;
    --f-d:"Chakra Petch",var(--f-ko); --f-b:"IBM Plex Sans",var(--f-ko); --f-m:"IBM Plex Mono",var(--f-ko),ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* 웹앱: 더블탭 확대·더블탭 스크롤을 막는다.
     touch-action:manipulation 이 실제로 이를 끄는 규칙이다 (iOS는 user-scalable=no 를 무시한다).
     지도만은 직접 팬/핀치를 처리하므로 touch-action:none 을 따로 유지한다. */
  html,body{overscroll-behavior:none;overscroll-behavior-x:none;
    touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,.r,.dtile,.pol,.tk,.si,.jchip,.menu-btn,.act,.ev-o,.sheet-handle{touch-action:manipulation}
  .side-scroll{overscroll-behavior:contain}
  body{background:var(--void);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::selection{background:var(--amber);color:#1a1206}
  button{font-family:inherit;cursor:pointer;color:inherit}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  [data-tip]{cursor:help}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  /* 하단 탭바 — 폰에서만. 데스크톱은 지도+패널 좌우 배치가 더 넓게 쓰인다. */
  .tabbar{display:none}

  /* TOP BAR */
  .top{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));flex-wrap:wrap}
  .brand{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand b{color:var(--amber)}
  .res{display:flex;gap:7px;flex-wrap:wrap;flex:1 1 260px;min-width:0}
  /* 시간·메뉴는 각각 한 덩어리로 묶는다. 통째로 다음 줄로 내려갈 뿐,
     안에서 쪼개져 날짜와 배속이 갈라지는 일이 없다. */
  .tgrp,.mgrp{display:flex;align-items:center;gap:6px;flex:none}
  .mgrp{margin-left:auto}
  .r{display:flex;align-items:center;gap:6px;background:var(--void-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 10px;font-family:var(--f-m);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .r i{width:7px;height:7px;border-radius:50%;font-style:normal;flex:none}
  .r .rate{color:var(--dim);font-size:10.5px}
  .r.pos .rate{color:var(--habit)} .r.neg .rate{color:var(--hostile)}
  .r.near{border-color:rgba(246,183,60,.55)}
  .r.full{border-color:var(--amber);background:rgba(246,183,60,.14)}
  .capb{font-family:var(--f-m);font-size:10px;color:#1a1206;background:var(--amber);border-radius:3px;padding:1px 5px;margin-left:2px}
  .rt-cap{display:flex;align-items:center;gap:8px;margin:7px 0 4px;font-size:10.5px;color:var(--muted)}
  .rt-capbar{flex:1;height:5px;border-radius:3px;background:var(--void);border:1px solid var(--line);overflow:hidden}
  .rt-capbar i{display:block;height:100%;background:var(--sky)}
  .rt-capbar i.near{background:var(--amber)} .rt-capbar i.full{background:var(--hostile)}
  .r.depleted{border-color:var(--hostile);background:rgba(242,104,95,.14);animation:depPulse 1.1s ease-in-out infinite}
  .r.depleted .ric{filter:grayscale(.3)}
  .depb{font-family:var(--f-m);font-size:10px;color:#fff;background:var(--hostile);border-radius:3px;padding:1px 5px;margin-left:2px;letter-spacing:.02em}
  @keyframes depPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,104,95,.0)}50%{box-shadow:0 0 8px 1px rgba(242,104,95,.5)}}
  .r .lbl{color:var(--muted);font-size:10.5px;letter-spacing:.06em}
  .r .ric{font-size:14px;line-height:1;flex:none}
  .r.stat{background:none;border-color:var(--line-soft)}
  .divider{width:1px;height:22px;background:var(--line);margin:0 2px}
  .speed{display:flex;gap:4px}
  .speed button{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-family:var(--f-m);font-size:12px;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;line-height:1;letter-spacing:-1px;white-space:nowrap;flex:none}
  .speed button.on{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600}
  .menu-btn{background:var(--void-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 11px;font-family:var(--f-m);font-size:12px;color:var(--muted);white-space:nowrap}
  .menu-btn .mb-i{margin-right:5px}
  .menu-btn.help{border-color:var(--amber-line);color:var(--amber-2)}
  /* 세이브 코드·새 게임은 도움말 > 게임 관리 안에 그대로 있다. 상단바에서는 뺀다. */
  #ioBtn,#resetBtn{display:none}
  .gsys{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .gsys-h{font-family:var(--f-m);font-size:10.5px;letter-spacing:.13em;color:var(--dim);margin-bottom:9px}
  .gsys-b{display:flex;flex-wrap:wrap;gap:8px}
  .gsys-b .act{flex:1;min-width:104px}
  .gsys-n{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.6}
  .act.danger{border-color:rgba(242,104,95,.5);color:var(--hostile)}
  .act.danger:hover{background:var(--hostile);color:#fff}

  /* COACH BAR */
  .coach{display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(90deg,rgba(246,183,60,.14),rgba(246,183,60,.03));border-bottom:1px solid var(--amber-line)}
  .coach .tgt{font-family:var(--f-d);font-weight:700;font-size:12px;color:#1a1206;background:var(--amber);border-radius:20px;padding:3px 12px;letter-spacing:.06em;white-space:nowrap;flex:none}
  .coach .msg{font-family:var(--f-b);font-size:14px;color:var(--ink);flex:1;min-width:0}
  .coach .msg b{color:var(--amber-2)}
  .coach .go{font-family:var(--f-d);font-weight:600;font-size:12.5px;background:none;border:1px solid var(--amber);color:var(--amber-2);border-radius:4px;padding:6px 14px;min-height:40px;white-space:nowrap;flex:none}
  .coach .go:hover{background:var(--amber);color:#1a1206}
  .coach.warn{background:linear-gradient(90deg,rgba(242,104,95,.16),rgba(242,104,95,.03));border-bottom-color:rgba(242,104,95,.4)}
  .coach.warn .tgt{background:var(--hostile);color:#fff}
  .coach.done{background:linear-gradient(90deg,rgba(86,214,127,.14),transparent);border-bottom-color:rgba(86,214,127,.4)}
  .coach.done .tgt{background:var(--habit);color:#08210f}

  /* MAIN */
  .main{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0;position:relative}
  .mapwrap{position:relative;overflow:hidden;border-right:1px solid var(--line);background:#04060b;touch-action:none;-webkit-user-select:none;user-select:none}
  #stars{position:absolute;inset:0;z-index:1;opacity:.9;pointer-events:none}
  #mapzoom{position:absolute;inset:0;z-index:2;transform-origin:center center;will-change:transform}
  #nebula{position:absolute;left:-60%;top:-60%;width:220%;height:220%;z-index:0}
  #lanes{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;overflow:visible}
  #lanes line{stroke:#3a4a66;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
  #lanes line.unknown{stroke:#46577a;opacity:.3}      /* 아직 모르는 길 — 은하의 뼈대만 */
  #lanes line.far{stroke:#6b7ea6;opacity:.5;stroke-dasharray:3 4}  /* 길은 있는데 한 번에 못 건넌다 */
  #lanes line.live{stroke:#6f86b8;opacity:.8}
  #lanes line.open{stroke:var(--amber-2);stroke-width:1.6;opacity:1}
  #map{position:absolute;inset:0;z-index:2}
  .mapwrap{cursor:grab}
  .mapwrap.grabbing{cursor:grabbing}
  .zoomctl{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:5px}
  .zoomctl button{width:30px;height:30px;border-radius:6px;background:rgba(11,15,24,.8);border:1px solid var(--line);color:var(--muted);font-size:15px;display:grid;place-items:center;line-height:1;font-family:var(--f-m)}
  .zoomctl button:hover{border-color:var(--amber-line);color:var(--amber-2)}
  .zoomctl #zReset{font-size:13px}
  .node.offtier{display:none}
  /* ── 근거리 단계: 별 점 대신 '대표 행성의 얼굴' ──
     상태(본거지·식민지·거주후보)는 색 점에서 테두리 링으로 옮긴다 — 정보는 그대로 남는다 */
  .node .pdisc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;z-index:1}
  .node .pdisc svg{display:block;border-radius:50%}
  .mapwrap.artview .node.surveyed .pdisc{width:27px;height:27px;overflow:visible}
  /* 22px 격자보다 큰 링은 그리드가 가운데 정렬을 못 해서 8px 틀어진다 — 절대 위치로 직접 맞춘다 */
  /* 근거리에서는 행성 얼굴 하나만 둔다 — 상태 링과 개수 배지는 화면을 시끄럽게 만들었다.
     색은 '지금 고른 별'과 '무슨 일이 있는 별'에만 쓴다. 어디가 내 식민지인지는 이름표로 안다. */
  .mapwrap.artview .node.surveyed .star{position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);width:32px;height:32px;background:none;box-shadow:none}
  .mapwrap.artview .node.surveyed .cbadge{display:none}
  .mapwrap.artview .node.sel .star{transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px var(--amber-2),0 0 0 6px rgba(246,183,60,.30),0 0 18px rgba(246,183,60,.55)}
  .mapwrap.artview .node.surveyed:hover .star{transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px rgba(246,183,60,.55)}
  /* 멀리서 볼 때는 아이콘 배지를 숨긴다 — 개관 화면이 보라색 점으로 뒤덮인다 */
  /* 시야 단계 표시 — 지금 어디까지 보고 있는지 */
  .tierchip{position:absolute;left:12px;top:12px;z-index:5;display:flex;align-items:center;gap:8px;
    background:rgba(11,15,24,.82);border:1px solid var(--line);border-radius:7px;padding:5px 10px;
    font-family:var(--f-m);font-size:11px;color:var(--muted);pointer-events:none;backdrop-filter:blur(3px)}
  .tierchip b{color:var(--amber-2);font-weight:600;font-family:var(--f-d);letter-spacing:.02em}
  .tierchip span{color:var(--dim)}
  .tierchip .tdots{display:flex;gap:3px;margin-left:2px}
  .tierchip .tdots em{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
  .tierchip .tdots em.on{background:var(--amber-2)}
  .reach{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:1;border:1px solid rgba(246,183,60,.22);box-shadow:0 0 60px rgba(246,183,60,.06) inset, 0 0 20px rgba(246,183,60,.08)}
  /* 별 이름과 같이 확대 배율의 역수를 곱해 화면상 크기를 일정하게 유지한다 */
  .reach-lbl{position:absolute;left:50%;transform:translateX(-50%) scale(var(--iz,1));transform-origin:top center;font-family:var(--f-m);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;pointer-events:none;z-index:1}

  /* 별은 확대해도 커지지 않는다 — 지도 배율의 역수를 곱해 화면상 크기를 고정한다.
     그래야 확대가 '별이 부풀기'가 아니라 '별 사이가 벌어지기'로 작동한다. */
  .node{position:absolute;transform:translate(-50%,-50%) scale(var(--iz,1));background:none;border:none;padding:0;width:22px;height:22px;display:grid;place-items:center;z-index:3}
  .node .star{width:7px;height:7px;border-radius:50%;border:none;background:#b6c3dc;box-shadow:0 0 5px rgba(170,195,240,.5);transition:.12s;position:relative}
  .node .nm{position:absolute;top:calc(50% + 10px);left:50%;transform:translateX(-50%);font-family:var(--f-m);font-size:10.5px;color:#d7deea;white-space:nowrap;letter-spacing:.02em;max-width:130px;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 0 2px #05070d,0 0 4px #05070d,-1px 0 2px #05070d,1px 0 2px #05070d,0 1px 3px rgba(0,0,0,.95)}
  .node .dist{position:absolute;top:calc(50% + 23px);left:50%;transform:translateX(-50%);font-family:var(--f-m);font-size:10px;color:#8993a8;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 0 3px #05070d,0 1px 2px #05070d}
  /* 라벨 LOD: 상시 표시는 내 제국(본거지·식민지)+선택+코치 추천만. 나머지(스캔 가능·탐사 완료)는 호버 시. */
  .node.home .nm,.node.colonized .nm,.node.sel .nm,.node.rec .nm,.node:hover .nm{opacity:1}
  /* 이름표가 겹치면 우선순위가 낮은 쪽을 숨긴다 (누르거나 마우스를 올리면 다시 보인다) */
  .node.nolabel:not(:hover) .nm{opacity:0}
  .node.lbl-up .nm{top:auto;bottom:calc(50% + 11px)}   /* 아래가 막히면 이름을 위쪽에 단다 */
  .mapwrap.artview .node.surveyed .nm{top:calc(50% + 19px)}
  .mapwrap.artview .node.surveyed.lbl-up .nm{top:auto;bottom:calc(50% + 19px)}
  /* 아이콘만 남긴 말풍선은 동그란 배지로 — 가로로 긴 알약이 별 이름을 덮지 않게 */
  /* 이상 현상·단서 표식 — 별 왼쪽 위에 얹는 작은 원. 멀리 축소하면 사라진다 */
  .node .amark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    margin-left:-7px;margin-top:-7px;width:11px;height:11px;border-radius:50%;
    display:none;place-items:center;font-size:7px;line-height:1;z-index:4;pointer-events:none;
    background:#c98bf0;color:#1b0c28;box-shadow:0 0 0 1.2px #0a0e16,0 1px 3px rgba(0,0,0,.6)}
  .node.anomaly .amark,.node.clue .amark{display:grid}
  .node.clue .amark{background:#ffd98a;color:#2a1e05}
  .mapwrap.artview .node.surveyed .amark{margin-left:-12px;margin-top:-12px;width:16px;height:16px;font-size:10px;box-shadow:0 0 0 1.5px #0a0e16,0 1px 3px rgba(0,0,0,.6)}
  .mapwrap.farview .node .amark{display:none}      /* 원거리·심우주에서는 감춘다 */
  .node:hover .dist,.node.sel .dist{opacity:1}
  .node:hover{z-index:20}
  .node:hover .star{transform:scale(1.25)}
  .node:hover .nm{color:var(--muted)}
  .node .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--amber);color:#1a1206;font-family:var(--f-d);font-weight:600;font-size:10px;padding:2px 8px;border-radius:3px;white-space:nowrap;opacity:0;transition:.15s;pointer-events:none;letter-spacing:.03em}
  .node.scannable:hover .tip,.node.rec .tip{opacity:1}
  .node .tip:empty{display:none}   /* 내용 없는 말풍선이 작은 색 막대로 남던 문제 */
  .node.surveyed .star{background:#8fa0bd;box-shadow:0 0 6px rgba(143,160,189,.45)}
  .node.surveyed .nm{color:var(--muted)}
  .node.scannable .star{width:11px;height:11px;background:var(--amber-2);box-shadow:0 0 12px rgba(246,183,60,.8)}
  .node.scannable .nm{color:var(--amber-2)}
  .node.home .star{width:12px;height:12px;background:var(--sky);box-shadow:0 0 16px rgba(109,182,232,.9),0 0 4px #fff}
  .node.home .nm{color:var(--sky)}
  .node.hasprime .star{background:var(--habit);box-shadow:0 0 12px rgba(86,214,127,.8)}
  .node.colonized .star{width:12px;height:12px;background:var(--amber);box-shadow:0 0 16px var(--amber),0 0 4px #fff}
  .node.colonized .nm{color:var(--amber-2)}
  .node.sel .star{transform:scale(1.4);box-shadow:0 0 0 3px rgba(246,183,60,.35),0 0 14px rgba(246,183,60,.6)}
  .node.locked{opacity:.5}
  .node.locked .star{width:4px;height:4px;background:#8e9bb4;box-shadow:0 0 3px rgba(142,155,180,.4)}
  .node.rec .star{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,183,60,.55)}50%{box-shadow:0 0 0 8px rgba(246,183,60,0)}}
  .node .cbadge{position:absolute;top:-6px;right:-6px;font-family:var(--f-m);font-size:10px;background:var(--amber);color:#1a1206;border-radius:6px;padding:0 3px;font-weight:600}

  .maphint{position:absolute;left:16px;bottom:14px;z-index:4;font-family:var(--f-m);font-size:11px;color:var(--dim);letter-spacing:.03em;background:rgba(8,11,18,.72);padding:8px 11px;border:1px solid var(--line-soft);border-radius:4px;line-height:1.7}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%}

  /* SIDE PANEL */
  .side{background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
  .side-scroll{overflow-y:auto;padding:18px 18px 18px;flex:1}
  /* 패널 닫기/열기 */
  .panel-x{position:absolute;top:9px;right:11px;z-index:6;width:26px;height:26px;border-radius:5px;background:var(--void-2);border:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;place-items:center;line-height:1}
  .panel-x:hover{border-color:var(--hostile);color:var(--hostile)}
  .panel-reopen{position:absolute;top:50%;right:0;transform:translateY(-50%);z-index:6;width:24px;height:64px;border-radius:7px 0 0 7px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-right:none;color:var(--amber-2);font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:-4px 0 16px rgba(0,0,0,.3)}
  .panel-reopen:hover{color:var(--amber);background:var(--panel-2)}
  .app.panel-closed .side{display:none}
  .app.panel-closed .main{grid-template-columns:1fr}
  .app.panel-closed .panel-reopen{display:flex}
  .eyebrow{font-family:var(--f-m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .eyebrow::before{content:"";width:16px;height:1px;background:var(--amber-line)}

  .sys-head{font-family:var(--f-d);font-weight:600;font-size:21px;letter-spacing:-.01em;margin-bottom:2px}
  .sys-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;margin-bottom:2px}
  .sys-toggle:hover .sys-head{color:var(--amber-2)}
  .sys-toggle .chev{color:var(--amber);font-size:12px}
  .sys-toggle .sys-head{margin-bottom:0}
  .sys-sub{font-family:var(--f-m);font-size:12px;color:var(--muted);margin-bottom:14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-family:var(--f-m);font-size:12.5px;margin-bottom:14px}
  .kv .k{color:var(--dim);letter-spacing:.04em}
  .kv .v{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}

  .planet{border:1px solid var(--line);border-radius:5px;margin-bottom:9px;background:var(--panel-2);position:relative;overflow:hidden}
  .planet.open{background:var(--panel-2)}
  .planet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:1}
  .planet.prime::before{background:var(--habit)} .planet.marg::before{background:var(--marginal)} .planet.host::before{background:var(--hostile)} .planet.home::before{background:var(--sky)}
  /* 아코디언 헤더 */
  .phead{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;padding:11px 13px;text-align:left;transition:background .12s}
  .phead:hover{background:rgba(255,255,255,.03)}
  .planet.open .phead{border-bottom:1px solid var(--line-soft)}
  .chev{color:var(--amber);font-size:10px;flex:none;width:10px}
  .phead .pn{font-family:var(--f-d);font-weight:600;font-size:14.5px;color:var(--ink)}
  .phead .hsum{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
  .phead .hsum b{font-weight:600}
  .pbody{padding:12px 13px 13px}
  .planet .pn{font-family:var(--f-d);font-weight:600;font-size:15px}
  .planet .tier{font-family:var(--f-m);font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:3px;white-space:nowrap}
  .tier.prime{color:var(--habit);background:rgba(86,214,127,.12)} .tier.marg{color:var(--marginal);background:rgba(224,169,74,.12)} .tier.host{color:var(--hostile);background:rgba(242,104,95,.12)} .tier.home{color:var(--sky);background:rgba(109,182,232,.12)}
  .planet .ptype{font-family:var(--f-m);font-size:11px;color:var(--muted);margin:3px 0 10px}
  /* 행성 사실 — 유형·ESI·크기·온도를 한 줄로 (예전엔 3칸 박스 + 별도 줄이었다) */
  /* 행성 헤더의 ? — 유형·ESI·크기·온도·슬롯을 툴팁 하나로 모았다 */
  .pinfo{position:absolute;right:10px;top:11px;z-index:2;
    width:19px;height:19px;display:grid;place-items:center;border-radius:50%;
    border:1px solid var(--line);background:var(--void-2);color:var(--dim);
    font-family:var(--f-m);font-size:10.5px;cursor:help;transition:.12s}
  .pinfo:hover{border-color:var(--amber-line);color:var(--amber-2)}
  .planet{position:relative}
  .phead{padding-right:34px}
  /* 구역 카드 안의 일자리 — 뒤에 채움 막대가 깔린다 */
  /* 숫자를 막대 위에 겹치면 채움을 어둡게 깔 수밖에 없어 전체가 검게 보였다.
     숫자와 막대를 한 줄에 나란히 두고, 막대는 '노동 인구 구성'과 같은 밝은 단색을 쓴다. */
  .dt-job{display:flex;align-items:center;gap:7px;margin-top:4px;
    font-family:var(--f-m);font-size:10px;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .dt-job .dj-v{flex:none}
  .dt-job .dj-t{flex:1;min-width:24px;height:5px;border-radius:3px;
    background:var(--line-soft);overflow:hidden}
  .dt-job .dj-t i{display:block;height:100%;background:var(--bar-c,#63c8f0);transition:width .25s ease}
  .dt-job.j-goods    .dj-t i{background:var(--j-goods)}
  .dt-job.j-energy   .dj-t i{background:var(--j-energy)}
  .dt-job.j-minerals .dj-t i{background:var(--j-minerals)}
  .dt-job.j-research .dj-t i{background:var(--j-research)}
  .dt-job.j-alloy    .dj-t i{background:var(--j-alloy)}
  .dt-job.full .dj-v{color:var(--habit)}
  .dt-job.empty .dj-v{color:var(--hostile)}
  .dt-job.empty .dj-t i{background:var(--hostile)}
  /* 행성 정책 — 기본은 접혀 있고 현재 정책만 보인다 */
  .polbox{margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:var(--void-2)}
  .polbox>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    padding:8px 11px;font-family:var(--f-m);font-size:11px}
  .polbox>summary::-webkit-details-marker{display:none}
  .pb-l{color:var(--muted)}
  .pb-cur{display:flex;align-items:center;gap:4px;color:var(--amber-2);font-weight:600}
  .pb-more{margin-left:auto;color:var(--dim)}
  .polbox[open] .pb-more::after{content:""}
  .polbox[open]>summary{border-bottom:1px solid var(--line-soft)}
  .polbox .pols{padding:9px 10px;margin-bottom:0}

  /* ── 기술 격자 — 갈래마다 3열(계열) × 세로 시대. 위아래로만 스크롤한다. ── */
  .tg-sec{margin-top:12px}
  .tg-sec + .tg-sec{border-top:1px dashed var(--line-soft);padding-top:12px}
  .tg-bt{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}
  .tg-bt i{width:3px;height:12px;border-radius:2px;background:var(--bc)}
  .tg-bt u{font-family:var(--f-m);font-size:9.5px;letter-spacing:.18em;color:var(--bc);text-decoration:none}
  .tg-g{display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr));column-gap:4px;align-items:start}
  .tg-ch{text-align:center;padding:0 2px 5px;border-bottom:1px solid var(--line-soft)}
  .tg-ch b{display:block;font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.2}
  .tg-ch u{display:block;font-family:var(--f-m);font-size:8px;color:var(--dim);text-decoration:none;
    line-height:1.2;margin-top:1px}
  .tg-el{display:flex;align-items:center;justify-content:center;font-family:var(--f-d);
    font-size:12px;font-weight:700;color:var(--line-2);padding-top:14px}
  .tg-el.now{color:var(--amber)} .tg-el.on{color:var(--muted)}
  .tg-el.fk{font-family:var(--f-m);font-size:8px;letter-spacing:.06em}
  .tg-vc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px}
  .tg-vr{grid-column:2 / -1;height:9px;position:relative}
  .tg-vr i{position:absolute;top:0;bottom:0;width:2px;background:var(--line-soft);
    left:calc(16.667% - 1px)}
  .tg-vr i:nth-child(2){left:calc(50% - 1px)}
  .tg-vr i:nth-child(3){left:calc(83.333% - 1px)}
  .tg-vr i.lit{background:var(--amber-line)}
  .tg-node{width:42px;height:42px;border-radius:10px;position:relative;display:grid;place-items:center;
    border:1.5px solid var(--line-soft);background:var(--panel);font-size:18px;line-height:1;padding:0}
  .tg-node .ic{filter:grayscale(.7);opacity:.35}
  .tg-node .fl{position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;
    background:var(--line-soft);overflow:hidden}
  .tg-node .fl i{display:block;height:100%;background:var(--amber);border-radius:2px}
  .tg-cp{font-size:9px;line-height:1.15;text-align:center;color:var(--dim);min-height:21px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 1px}
  .tg-lv{font-family:var(--f-m);font-size:8.5px;color:var(--line-2);font-variant-numeric:tabular-nums}
  .tg-node.open{border-color:var(--line-2);background:var(--panel-2)}
  .tg-node.open .ic{filter:grayscale(.1);opacity:.9}
  .tg-node.has,.tg-node.max{border-color:var(--amber-line);background:var(--amber-soft)}
  .tg-node.has .ic,.tg-node.max .ic{filter:none;opacity:1}
  .tg-node.act{border-color:var(--amber);box-shadow:0 0 0 2px rgba(246,183,60,.2)}
  .tg-node.barred{border-color:rgba(242,104,95,.4)}
  .tg-node.barred .ic{filter:grayscale(1);opacity:.16}
  .tg-node.barred::after{content:"⊘";position:absolute;font-size:15px;color:var(--hostile);opacity:.85}
  .tg-node.sel{border-color:var(--amber-2);box-shadow:0 0 0 2px rgba(246,183,60,.32)}
  .tg-vc.has .tg-cp,.tg-vc.max .tg-cp{color:var(--ink);font-weight:700}
  .tg-vc.has .tg-lv,.tg-vc.max .tg-lv{color:var(--amber)}
  .tg-vc.open .tg-cp{color:var(--muted)}
  /* 분기 — 반으로 갈라진 노드 */
  .tg-fkb{display:flex;border:1.5px dashed var(--line-2);border-radius:11px;background:var(--panel);position:relative}
  .tg-fkb.dec{border-style:solid;border-color:var(--amber-line)}
  .tg-fkb .tg-node{border:none;background:none;width:41px;height:42px;border-radius:0;box-shadow:none}
  .tg-fkb .tg-node + .tg-node{border-left:1.5px dashed var(--line-2)}
  .tg-fkb.dec .tg-node + .tg-node{border-left-style:solid;border-left-color:var(--amber-line)}
  .tg-fkb .tg-node.has,.tg-fkb .tg-node.max{background:var(--amber-soft)}
  .tg-fc{display:flex;width:84px}
  .tg-fc span{width:42px;flex:none;font-size:8px;line-height:1.15;text-align:center;color:var(--dim);padding:0 1px}
  .tg-fc span.on{color:var(--amber-2);font-weight:700}
  .tg-fc span.off{color:var(--line-2);text-decoration:line-through}
  /* 각인 */
  .tg-doc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
  .tg-d{display:flex;align-items:flex-start;gap:8px;padding:8px 9px;border-radius:9px;
    border:1px solid var(--line-soft);background:var(--panel);text-align:left;width:100%}
  .tg-d.has{border-color:rgba(191,144,255,.5);background:rgba(191,144,255,.08)}
  .tg-d.has b{color:var(--ink)} .tg-d.has u{color:var(--muted)}
  .tg-d.barred{opacity:.35}
  .tg-d .ic{font-size:17px;flex:none}
  .tg-d div{min-width:0}
  .tg-d b{display:block;font-size:11.5px;color:var(--muted)}
  .tg-d u{display:-webkit-box;font-size:9.5px;line-height:1.3;color:var(--line-2);text-decoration:none;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 상세 — 격자 위에 고정으로 붙는다 */
  .tg-det{position:sticky;top:0;z-index:4;margin-bottom:2px;border:1px solid var(--line);border-radius:9px;
    background:var(--void-2);padding:9px 11px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
    box-shadow:0 6px 18px rgba(4,6,11,.7)}
  .tg-det .di{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;
    font-size:19px;border:1.5px solid var(--amber-line);background:var(--amber-soft)}
  .tg-det .db{flex:1;min-width:140px}
  .tg-det h4{font-size:13px;font-weight:800;margin-bottom:1px}
  .tg-det .dm{font-size:10.5px;color:var(--dim);margin-bottom:4px}
  .tg-det .de{font-size:11.5px;color:var(--amber-2);line-height:1.35}
  .tg-vs{display:flex;gap:1px;margin-top:6px;border:1px solid var(--line-soft);border-radius:7px;
    overflow:hidden;background:var(--line-soft)}
  .tg-vs > div{flex:1;min-width:0;background:var(--panel);padding:5px 8px}
  .tg-vs u{display:block;font-family:var(--f-m);font-size:8px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;text-decoration:none;white-space:nowrap}
  .tg-vs b{display:block;font-size:11px;color:var(--ink);margin-top:1px;line-height:1.3}
  .tg-vs b.up{color:var(--amber-2)} .tg-vs b.na{color:var(--dim)}
  .tg-det .dc{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .tg-det .dc u{font-family:var(--f-m);font-size:9px;letter-spacing:.1em;color:var(--dim);text-decoration:none}
  .tg-det .dc b{font-family:var(--f-m);font-size:11.5px;color:var(--ink)}
  .polbox .pol-lock{margin-left:auto}
  .pb-sub{font-family:var(--f-m);font-size:10px;letter-spacing:.12em;color:var(--dim);margin:8px 0 3px}
  .pb-sub small{font-family:var(--f-ko);letter-spacing:0;color:var(--line-2);margin-left:6px}
  .pstat .pl{font-family:var(--f-m);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:1px}

  .act{width:100%;border:1px solid var(--amber-line);background:var(--amber-soft);color:var(--amber-2);border-radius:4px;padding:10px;font-family:var(--f-d);font-weight:600;font-size:13.5px;letter-spacing:.02em;transition:.12s}
  .act:hover:not(:disabled){background:var(--amber);color:#1a1206}
  /* 비활성 버튼도 "왜 못 누르는지"(비용·조건)를 읽을 수 있어야 한다 — .4 는 대비 2.9였다 */
  .act:disabled{opacity:.62;cursor:not-allowed;border-color:var(--line)}
  .act.solid{background:var(--amber);color:#1a1206;border-color:var(--amber)}
  .act.ghost{border-color:var(--line);color:var(--muted);background:transparent}
  .act.ghost:hover:not(:disabled){border-color:var(--muted);color:var(--ink)}
  .cost{font-family:var(--f-m);font-size:10.5px;color:var(--dim);text-align:center;margin-top:6px;letter-spacing:.02em}
  .cost.bad{color:var(--hostile)}

  /* colony (Stellaris-style) */
  .col{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .col-top .lab{font-family:var(--f-m);font-size:11px;color:var(--dim);letter-spacing:.08em}
  .col-top .pop{font-family:var(--f-d);font-weight:600;font-size:15px}
  .col-top .pop small{font-family:var(--f-m);font-size:11px;font-weight:400}
  .bar{height:7px;background:var(--void-2);border-radius:4px;overflow:hidden;margin:3px 0 4px;display:flex}
  .bar i{display:block;height:100%}
  .bar .emp{background:var(--habit)} .bar .un{background:var(--hostile)}
  .barlab .u{color:var(--hostile)}
  .jobs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .jchip.full{border-color:rgba(86,214,127,.4)}
  .jchip.open{border-color:var(--amber-line);color:var(--amber-2)}
  .jchip .c{color:var(--dim);font-variant-numeric:tabular-nums}
  .grow.cap .gbar i{background:var(--marginal)} .grow.cap .grow-s{color:var(--marginal)} .grow.ok .grow-s{color:var(--sky)}
  .netrow .p{color:var(--habit)} .netrow .n{color:var(--hostile)}

  /* 과밀 경고 */
  .crowd{font-family:var(--f-m);font-size:10.5px;color:var(--hostile);background:rgba(242,104,95,.1);border:1px solid rgba(242,104,95,.3);border-radius:4px;padding:6px 9px;margin-bottom:11px;line-height:1.4}
  /* 제국 화면: 기술 트리 + 직업 우선순위 */
  .menu-btn.tech{border-color:var(--amber-line);color:var(--amber-2)}
  .emp-res{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .emp-res .chip{font-family:var(--f-m);font-size:12px;background:var(--void-2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
  /* 제목은 줄바꿈하지 않고, 설명만 아래로 흐르게 (글자를 키우니 제목이 두 줄로 깨졌다) */
  .emp-h{font-family:var(--f-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:18px 0 9px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px}
  .emp-h>:first-child,.emp-h{white-space:nowrap}
  .emp-h small{white-space:normal;flex:1 1 100%}
  .emp-h small{font-family:var(--f-b);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--dim);line-height:1.4}
  @media(max-width:620px){}
  .tech{background:var(--void-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
  .tech.ok{border-color:var(--amber-line)}
  .tech.maxed{border-color:rgba(86,214,127,.4);background:rgba(86,214,127,.05)}
  .tc-h .ti{font-size:16px} .tc-h .tn{font-weight:600;font-size:13.5px;flex:1}
  .tc-h .tl{font-family:var(--f-m);font-size:11.5px;color:var(--amber-2)} .tc-h .tl small{color:var(--dim)}
  .tbar{display:flex;gap:2px;margin-bottom:7px}
  .tbar i{flex:1;height:3px;border-radius:2px;background:var(--line)}
  .tbar i.on{background:var(--amber)}
  .te{font-family:var(--f-m);font-size:10.5px;color:var(--muted);margin-bottom:9px;line-height:1.45}
  .te .nx{color:var(--habit)}
  .tmax{font-family:var(--f-m);font-size:10.5px;color:var(--habit);text-align:center;padding:5px}
  .tech .act{width:100%;font-size:11.5px;padding:6px 8px;font-family:var(--f-m)}
  /* 제국 등급 · 메가구조물 · 행성 지정 */
  .tier{background:linear-gradient(180deg,rgba(86,214,127,.09),var(--void-2));border:1px solid rgba(86,214,127,.4);border-radius:10px;padding:13px 14px}
  .ti-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .ti-n{font-family:var(--f-d);font-weight:600;font-size:16px;color:var(--habit)}
  .ti-x{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--muted)}
  .ti-d{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .ti-d b{color:var(--habit)}
  .megas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  @media(max-width:660px){.megas{grid-template-columns:1fr}}
  .mega{background:var(--void-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px}
  .mega.ok{border-color:var(--amber-line)}
  .mega.done{border-color:rgba(86,214,127,.45);background:rgba(86,214,127,.05)}
  .mg-h{display:flex;align-items:center;gap:7px}
  .mg-h .ti{font-size:17px} .mg-h .tn{font-weight:600;font-size:13px;flex:1}

/* ── 항성계 솎아내기 ────────────────────────────────────────
   실제 외계행성 300개를 다 띄우면 좁은 지도에 별이 다닥다닥 붙어 항로가 얽힌다.
   55개만 남긴다. 다만 가까운 순으로 55개를 자르면 은하가 60ly 짜리 동네가 돼서
   항행 사거리 기술이 두 번 만에 끝나 버린다. 그래서:
     ① 25ly 안쪽은 전부 남긴다 (프록시마·바너드·Ross 128 같은 실제 이웃 별)
     ② 나머지는 '거리의 로그' 를 고르게 잘라 한 칸에 하나씩 뽑는다
        → 4,185ly 까지의 거리 폭이 그대로 유지돼 기술 진행이 살아 있다
     ③ 같은 칸에서는 행성이 많고 거주 가능성이 높은 쪽을 고른다 */
const SYSTEM_LIMIT = 55, KEEP_NEAR_LY = 25;
SYSTEMS = (()=>{
  const all=SYSTEMS.slice().sort((a,b)=>a.dist-b.dist);
  const near=all.filter(s=>s.dist<=KEEP_NEAR_LY);
  const rest=all.filter(s=>s.dist>KEEP_NEAR_LY);
  const want=SYSTEM_LIMIT-near.length;
  const score=s=>s.planets.reduce((a,pl)=>a+pl.esi*pl.esi,0)+s.planets.length*0.15;
  const L=d=>Math.log(d+1);
  const lo=L(rest[0].dist), hi=L(rest[rest.length-1].dist);
  const picked=[], taken=new Set();
  for(let k=0;k<want;k++){
    const t=lo+(hi-lo)*(k+0.5)/want;                 // 이 칸의 목표 거리
    let best=null, bs=-1;
    for(const s of rest){
      if(taken.has(s.id)) continue;
      const near2=1/(1+Math.abs(L(s.dist)-t)*3);      // 목표 거리에 가까울수록
      const v=near2*2+score(s)*0.5;
      if(v>bs){ bs=v; best=s; }
    }
    if(best){ taken.add(best.id); picked.push(best); }
  }
  return near.concat(picked).sort((a,b)=>a.dist-b.dist);
})();

const START = {energy:28, minerals:28, goods:33, research:0, alloy:15};
/* 항행 사거리 = 본거지에서 항로를 따라 달릴 수 있는 총 거리(ly).
   도로는 직선보다 길기 때문에 예전 "반지름 6ly 원" 과 같은 속도가 나오려면 12 에서 시작해야 한다. */
const BASE_REACH = 12;   // 기본 사거리(ly). 추진 계열이 ly 를 그대로 더한다.

  const u=ICON[key];
  if(!u) return fallback||"";

}

/* ── TECH_DEF → TECHS ── */
const TECHS={};
(function buildTechs(){
  const add=(id,name,icon,era,line,eff,unlock,kind,max)=>{
    TECHS[id]={ id,name,icon,era,line,kind,max,
      eff:eff||{}, unlock:unlock||null, pair:null, pre:null,
      br:LINES[line].br, lineName:LINES[line].n, own:LINES[line].own,
      rep: kind==="rep", idx:0 };
  };
  TRUNK.forEach(([id,n,ic,era,ln,eff,unl])=>add(id,n,ic,era,ln,eff,unl,"trunk",ERAS[era].max));
  for(let i=0;i<FORKS.length;i+=2){
    const A=FORKS[i], B=FORKS[i+1];
    add(A[0],A[1],A[2],FORK_ERA,A[3],A[4],null,"fork",1);
    add(B[0],B[1],B[2],FORK_ERA,B[3],B[4],null,"fork",1);
    TECHS[A[0]].pair=B[0]; TECHS[B[0]].pair=A[0];
  }
  DOCTS.forEach(([id,n,ic,ln,eff])=>add(id,n,ic,DOCT_ERA,ln,eff,null,"doct",1));
  REPS.forEach(([id,n,ic,era,ln,eff])=>add(id,n,ic,era,ln,eff,null,"rep",Infinity));
  /* 선행 관계 — 줄기는 같은 계열의 직전 시대, 분기는 같은 계열의 시대 Ⅲ 줄기 */
  const trunkOf={}; TRUNK.forEach(([id,,,era,ln])=>{ trunkOf[ln+"@"+era]=id; });
  TRUNK.forEach(([id,,,era,ln])=>{ TECHS[id].pre = era>1 ? trunkOf[ln+"@"+(era-1)] : null;
                                   TECHS[id].idx = era; });
  Object.values(TECHS).forEach(T=>{ if(T.kind==="fork"){ T.pre=trunkOf[T.line+"@"+FORK_ERA]; T.idx=FORK_ERA+0.5; }
                                    if(T.kind==="doct") T.idx=6;
                                    if(T.kind==="rep")  T.idx=9; });
})();

function eraTotal(e){ let n=0; for(const k in TECHS) if(TECHS[k].era===e&&TECHS[k].kind==="trunk") n++; return n; }
function employedTotal(e){ return Object.values(e).reduce((a,b)=>a+b,0); }
function eraDone(e){ let n=0; for(const k in TECHS) if(TECHS[k].era===e&&TECHS[k].kind==="trunk"&&techLvl(k)>0) n++; return n; }
function eraOpen(e){ return e<=1 || eraDone(e-1)>=(ERA_GATE[e]||0); }

   전부 더하기다. 곱셈도 점근식도 없다. 마지막에 상한에서 한 번 자른다. */
const ADD_KEYS=["reachAdd","supplyFree","prodAll","upkeepCut","storage","slots","housing",
                "crime","happy","adminCut","buildCut","colonyCut","scanCut","growth","pol",
                "probeCut","megaCut"];
/* 감소 수치의 바닥 — 여기 아래로는 내려가지 않는다 */
const FLOOR={upkeep:0.25, admin:0.30, build:0.30, colony:0.25, scan:0.20, mega:0.35};
let _tm=null,_tmk="";
function techMods(){
  const sig=JSON.stringify((S&&S.tech)||{});
  if(_tm&&_tmk===sig) return _tm;
  const m={reachAdd:0,supplyFree:0,prodAll:0,prod:{energy:0,minerals:0,goods:0,research:0,alloy:0},
           upkeepCut:0,storage:0,slots:0,housing:0,crime:0,happy:0,adminCut:0,buildCut:0,
           colonyCut:0,scanCut:0,growth:0,pol:0,probeCut:0,megaCut:0,unlock:{},rule:{}};
  for(const k in TECHS){ const l=techLvl(k); if(!l)continue; const T=TECHS[k], e=T.eff;
    for(const f of ADD_KEYS) if(e[f]) m[f]+=e[f]*l;
    if(e.prod) for(const r in e.prod) m.prod[r]+=e.prod[r]*l;
    if(e.rule) e.rule.forEach(r=>m.rule[r]=true);
    if(T.unlock) m.unlock[T.unlock]=true;
  }
  m.upkeepMul = Math.max(1-m.upkeepCut, FLOOR.upkeep);
  m.adminMul  = Math.max(1-m.adminCut , FLOOR.admin);
  m.buildMul  = Math.max(1-m.buildCut , FLOOR.build);
  m.colonyMul = Math.max(1-m.colonyCut, FLOOR.colony);
  m.scanMul   = Math.max(1-m.scanCut  , FLOOR.scan);
  m.megaMul   = Math.max(1-m.megaCut  , FLOOR.mega);
  m.survey    = m.probeCut;                 // 예전 이름 호환 (문서 도구가 읽는다)
  m.reachMul  = 1;                          // 사거리는 더 이상 배수가 아니다
  m.happyRaw  = m.happy;
  _tm=m;_tmk=sig; return m;
}

function effText(k,l){

/* ============ 저장 상한 (창고) ============
   무한 적립을 막는다. 넘치는 자원은 버려지므로 '모으기'보다 '쓰기'가 강제된다.
   한도는 식민지 수와 물류 창고 기술로 늘어난다. */
const STORE_BASE = 200, STORE_PER_COLONY = 150;
function storageCap(){
  const n=Object.keys((S&&S.colonies)||{}).length;
  return Math.round((STORE_BASE + n*STORE_PER_COLONY) * (1 + techMods().storage));
}

/* ============ 제국 규모 유지비 ============
   구역 수에만 비례하던 소비를, 식민지 수·총인구에도 연동해 생산 증가를 따라가게 한다. */
function scaleUpkeep(){
  const n=Object.keys((S&&S.colonies)||{}).length, pop=totalPop();
  return 1 + Math.max(0,n-3)*0.06 + pop*0.004;
}

const megaMax = k => MEGA[k].max + (hasRule("megaPlus")?3:0);
const megaTotal = () => MEGA_KEYS.reduce((a,k)=>a+megaLvl(k),0);
const megaCost = k => {const c=MEGA[k].cost(megaLvl(k)),a=adminMult(),g=techMods().megaMul;
  return {minerals:Math.round(c.minerals*a*g), energy:Math.round(c.energy*a*g)};};
function buildMega(k){
  if(megaLvl(k)>=megaMax(k)){toast("이미 완공되었습니다","warn");return;}
  if(!Object.keys(S.colonies).length){toast("식민지가 필요합니다","warn");return;}
  const c=megaCost(k);
  if(S.res.minerals<c.minerals||S.res.energy<c.energy){toast("자원 부족 (광물 "+fmt(c.minerals)+" · 에너지 "+fmt(c.energy)+")","warn");return;}
  S.res.minerals-=c.minerals; S.res.energy-=c.energy;
  if(!S.mega)S.mega={}; S.mega[k]=megaLvl(k)+1;
  pushLog(`${MEGA[k].icon} ${MEGA[k].name} ${S.mega[k]}단계 완공 — ${MEGA[k].eff(S.mega[k])}`,"good");
  save(); renderAll(); if($("modal").classList.contains("on")) openEmpire();
}
/* 메가구조물이 제국 전체에 더하는 고정 산출 */
function megaBonus(){
  const b={energy:0,minerals:0,goods:0,research:0,alloy:0};
  MEGA_KEYS.forEach(k=>{const M=MEGA[k], l=megaLvl(k); if(M.res&&l) b[M.res]+=M.per*l;});
  return b;
}

/* ============ 제국 등급 (단계별 목표) ============
   '거주 가능 3곳'이라는 단일 목표가 너무 일찍 끝나던 문제를 5단계 여정으로 바꾼다. */
const TIERS = [
  {n:"개척 시대",  d:"첫 식민지를 세우고 자립하세요.",                ok:()=>true},
  {n:"항성 연합",  d:"거주 가능 행성 3곳 개척",                       ok:()=>primeCount()>=3},
  {n:"성간 국가",  d:"식민지 10곳 · 총 인구 80,000명",                  ok:()=>Object.keys(S.colonies).length>=10&&totalPop()>=80},
  {n:"은하 세력",  d:"항성계 60곳 탐사 · 메가구조물 1단계",            ok:()=>Object.keys(S.surveyed).length>=60&&megaTotal()>=1},
  {n:"은하 문명",  d:"거주 가능 8곳 · 메가구조물 8단계",              ok:()=>primeCount()>=8&&megaTotal()>=8},
];
function tierIndex(){ let i=0; for(let t=1;t<TIERS.length;t++){ if(TIERS[t].ok()) i=t; else break; } return i; }
function tierProgress(){
  const i=tierIndex(); if(i>=TIERS.length-1) return {i,next:null,pct:100};
  const nx=TIERS[i+1];
  // 다음 등급까지의 대략적 진척도 (표시용)
  let pct=0;
  if(i===0) pct=primeCount()/3;
  else if(i===1) pct=(Math.min(1,Object.keys(S.colonies).length/10)+Math.min(1,totalPop()/80))/2;
  else if(i===2) pct=(Math.min(1,Object.keys(S.surveyed).length/60)+Math.min(1,megaTotal()/1))/2;
  else pct=(Math.min(1,primeCount()/8)+Math.min(1,megaTotal()/8))/2;
  return {i,next:nx,pct:clamp(pct*100,0,100)};
}

/* ============ 제국 규모(행정 부담) ============
   식민지가 늘수록 연구·건설 비용이 오른다 → '무조건 많이 먹는 게 정답'을 깨고 확장 속도에 결정을 만든다. */
const ADMIN_FREE = 5, ADMIN_PER = 0.06;    // 5곳까지 무상, 초과 1곳당 +6%
/* 행정 기술(adminMul)은 '부담' 부분만 깎는다 — 기본 1배는 건드리지 않는다.
   이전에는 이 함수가 techMods()를 읽지 않아서 "행정 부담 −8%" 기술이
   연구 인력 소모에만 먹히고 건설비·연구비에는 아무 영향이 없었다. */
function adminMult(){ const n=Object.keys((S&&S.colonies)||{}).length;
  return 1+Math.max(0,n-ADMIN_FREE)*ADMIN_PER*techMods().adminMul; }
const adminPct = () => Math.round((adminMult()-1)*100);

/* ============ 연구 카드 + 연구 시간 ============
   자유 선택이 아니라 3장 중 1장을 골라 '시간을 들여' 연구한다.
   연구 생산량이 진행도를 채우고, 완료되면 새 3장을 뽑는다 → 판마다 순서가 달라진다. */
function rngFrom(n){ return frac(Math.sin((n+1)*97.13)*4391.77); }
function techOpen(k){ const T=TECHS[k];
  if(techLvl(k)>=T.max) return false;
  if(!eraOpen(T.era)) return false;
  if(T.kind==="rep") return eraOpen(T.era);
  if(T.kind==="fork"){
    if(techLvl(T.pair)>0) return false;                    // 형제를 골랐다 — 영구 잠김
    return techLvl(T.pre) >= TECHS[T.pre].max;             // 같은 계열 시대 Ⅲ 만렙 필요
  }
  if(T.kind==="doct") return doctPicked() < DOCT_PICK;     // 8개 중 2개까지
  if(T.pre && !techLvl(T.pre)) return false;
  return true; }
/* 분기에서 포기해 영영 못 찍는 기술인가 */
const techBarred = k => { const T=TECHS[k];
  if(T.kind==="fork") return techLvl(T.pair)>0;
  if(T.kind==="doct") return techLvl(k)===0 && doctPicked()>=DOCT_PICK;
  return false; };
function eligibleTechs(){ return TECH_KEYS.filter(techOpen); }
function drawCards(){
  const pool=eligibleTechs(); const picks=[];
  const seed=(S.rseed=(S.rseed||0)+1);
  // 갈래가 골고루 섞이도록 갈래별로 후보를 모은 뒤 뽑는다
  const byBr={}; pool.forEach(k=>{(byBr[TECHS[k].br]=byBr[TECHS[k].br]||[]).push(k);});
  TECH_BRANCHES.forEach((br,i)=>{ const arr=byBr[br]; if(!arr||!arr.length)return;
    picks.push(arr[Math.floor(rngFrom(seed*7+i)*arr.length)]); });
  // 3장이 안 되면 남은 후보로 채운다
  let g=0; while(picks.length<3&&picks.length<pool.length){
    const c=pool[Math.floor(rngFrom(seed*31+g++)*pool.length)]; if(!picks.includes(c))picks.push(c); if(g>60)break; }
  S.rcards=picks;
}
function startResearch(k){
  if(S.ractive){toast("이미 연구 중입니다","warn");return;}
  if(techLvl(k)>=TECHS[k].max){toast("이미 최대입니다","warn");return;}
  const c=techCost(k);
  if(S.res.minerals<c.minerals){toast("광물 부족 (필요 "+c.minerals+")","warn");return;}
  S.res.minerals-=c.minerals; S.ractive=k; S.rprog=0;
  pushLog(`${TECHS[k].icon} ${TECHS[k].name} 연구 시작 — 목표 ⚛${c.research} · 광물 ${c.minerals} 투입`,"good");
  save(); renderAll(); if($("modal").classList.contains("on")) openEmpire();
}
function researchGoal(){ if(S.ractive&&!TECHS[S.ractive]){S.ractive=null;S.rprog=0;} return S.ractive?techCost(S.ractive).research:0; }
function finishResearch(){
  const k=S.ractive; if(!k)return;
  if(!S.tech)S.tech={}; S.tech[k]=techLvl(k)+1;
  const T=TECHS[k];
  pushLog(`${T.icon} ${T.name}${T.max===1?'':` Lv.${S.tech[k]}`} 완료 — ${effText(k,S.tech[k])}`,"good");
  const wasEra=curEra();
  S.ractive=null; S.rprog=0; _tm=null; drawCards();
  if(T.eff.reachAdd || T.eff.rule) initMap();
  if(curEra()>wasEra) pushLog(`🏛 새로운 시대 — <b>${ERAS[curEra()].n}</b> 기술이 열렸습니다!`,"good");
  save();
}
/* 비용 = 시대 기본값 × 계열 내 순번 × 현재 레벨 × 행정 배수 */
/* 레벨당 ×1.35 (반복형은 ×1.30). 분기·각인은 일회성 고정가. */
const FORK_COST={research:2900, minerals:1900};
const DOCT_COST={research:12000, minerals:7800};
function techCost(k){
  const T=TECHS[k], E=ERAS[T.era], l=techLvl(k), a=adminMult();
  if(T.kind==="fork") return {research:Math.round(FORK_COST.research*a), minerals:Math.round(FORK_COST.minerals*a)};
  if(T.kind==="doct") return {research:Math.round(DOCT_COST.research*a), minerals:Math.round(DOCT_COST.minerals*a)};
  const lv=Math.pow(T.kind==="rep"?1.30:1.35, l);
  return {research:Math.round(E.base*lv*a), minerals:Math.round(E.mb*lv*a)};
}

/* ============ 상태 ============ */
let S, selSys=null, timer=null, recTarget=null, won=false, expanded={}, sysOpen={};
const $ = id => document.getElementById(id);
const isPhone = () => window.matchMedia && window.matchMedia('(max-width:560px)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt = n => Math.floor(n).toLocaleString('en-US');
/* ============ 게임 달력 ============
   시간은 '하루' 단위로 정수 카운팅된다(S.day). 1배속에서 1일 = 실시간 0.2초(= 초당 5일).
   S.t(게임 초)는 S.day에서 파생 — 누적 오차 없음. */
const DAYS_PER_SEC = 5, EPOCH = Date.UTC(2200,0,1);
const DAY_SEC = 1/DAYS_PER_SEC;                    // 하루 = 게임 0.2초
const gameDays = () => !S ? 0 : (S.day!==undefined ? S.day : Math.floor((S.t||0)*DAYS_PER_SEC));
function gameDate(){ const d=new Date(EPOCH + gameDays()*86400000);
  return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate()}; }
const dateStr = () => { const g=gameDate(); return `${g.y}. ${String(g.m).padStart(2,"0")}. ${String(g.d).padStart(2,"0")}`; };
/* 게임 초 → 사람이 읽는 기간 */
function durStr(sec){
  const d=Math.max(0,Math.ceil(sec*DAYS_PER_SEC));
  if(d<31) return `${d}일`;
  if(d<365) return `${Math.round(d/30.4)}개월`;
  const y=Math.floor(d/365), mo=Math.round((d%365)/30.4);
  return mo?`${y}년 ${mo}개월`:`${y}년`;
}
/* 인구는 내부적으로 '천명' 단위 소수다 (4.306 = 4,306명). 화면에는 사람 수로 보여준다. */
const fmtPop = n => Math.round(n*1000).toLocaleString('en-US')+"명";
const sysById = id => SYSTEMS.find(s=>s.id===id);
const tierOf = e => e>=0.999?"home":e>=0.8?"prime":e>=0.5?"marg":"host";
const tierName = {home:"본거지",prime:"거주 가능",marg:"개척 필요",host:"자원 전용"};
const colKey=(s,pi)=>s+"|"+pi;
/* ── 테라포밍: 식민 행성의 ESI를 영구히 끌어올린다. 광물의 대형 배출구이자 척박한 행성의 구제 수단. ── */
const TERRA_STEP=0.08, TERRA_MAX=6;
const terraLv = k => (S&&S.terra&&S.terra[k])||0;
const esiOf = (sysId,pi) => { const p=sysById(sysId).planets[pi];
  return clamp(p.esi + terraLv(colKey(sysId,pi))*TERRA_STEP, 0, 1); };
function terraCost(k){ const l=terraLv(k);
  return {minerals:Math.round(220*Math.pow(1.55,l)), energy:Math.round(160*Math.pow(1.55,l)), goods:Math.round(80*Math.pow(1.5,l))}; }
function doTerra(key){
  if(!hasUnlock("terra")){toast("테라포밍 기술이 필요합니다","warn");return;}
  if(!S.colonies[key]){toast("식민지가 있어야 개조할 수 있습니다","warn");return;}
  const [sid,pi]=key.split("|");
  if(terraLv(key)>=TERRA_MAX||esiOf(sid,+pi)>=1){toast("더 개조할 수 없습니다","warn");return;}
  const c=terraCost(key);
  if(S.res.minerals<c.minerals||S.res.energy<c.energy||S.res.goods<c.goods){toast("자원 부족 (광물 "+c.minerals+" · 에너지 "+c.energy+" · 소비재 "+c.goods+")","warn");return;}
  S.res.minerals-=c.minerals;S.res.energy-=c.energy;S.res.goods-=c.goods;
  if(!S.terra)S.terra={}; S.terra[key]=terraLv(key)+1;
  const p=sysById(sid).planets[+pi];
  pushLog(`🌍 ${p.n} 테라포밍 — ESI ${esiOf(sid,+pi).toFixed(2)}`,"good");
  save(); renderAll();
}
/* ============ 행성 특성 (실제 NASA 데이터 → 운영 효과) ============
   타입·온도·크기·특수광맥이 생산/거주/슬롯에 실제로 곱해짐. 결정론적(같은 행성=항상 같은 특성). */
function _hstr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
/* 행성 특성 — 배율(×)이 아니라 덧셈 %로 정의한다.
   여러 특성이 겹칠 때 곱셈은 폭주하거나 0에 붙어버리지만, %는 더해서 읽기 쉽고 예측 가능하다.
   합계는 −40% ~ +60% 로 잘라 어떤 행성도 '지으면 손해'가 되지 않게 한다.
   housing 만 배율로 남는다 (주거 정원은 생산 공식과 별개). */
/* 행성 특성 — 온도와 유형이 각각 효과를 준다.
   '택 1' 그룹은 행성 이름으로 고정된 난수로 하나가 뽑힌다(같은 행성 = 항상 같은 결과, 리롤 불가).
   합계 하한은 −85% — 극저온의 에너지 −75%, 고온의 연구 −85% 를 표기대로 살리기 위해서다. */
const TRAIT_MIN=-0.85, TRAIT_MAX=0.60;
/* 택 1 그룹에서 하나 고르기 — seed 로 그룹을 구분해 같은 행성에서도 그룹마다 다른 값이 나오게 한다 */
const pick1=(name,seed,arr)=>arr[_hstr(name+"|"+seed)%arr.length];
function planetTraits(p){
  const pct={goods:0,energy:0,minerals:0,research:0,alloy:0};
  const mods={housing:1}; const tags=[]; let happy=0, tempPen=0, slotPen=0;
  const add=(o)=>{ for(const k in o) pct[k]=(pct[k]||0)+o[k]; };
  const lbl=o=>Object.entries(o).map(([k,v])=>`${RES_LABEL[k]} ${v>0?'+':''}${Math.round(v*100)}%`).join(" · ");

  // ── ① 온도 — 실제 평형온도로 결정. 망원경으로 관측되므로 스캔만 해도 보인다 ──
  const T=p.temp;
  if(T!=null){
    if(T>=400){
      const g=pick1(p.n,"hot1",[{energy:.25},{minerals:.15}]);
      const b2=pick1(p.n,"hot2",[{goods:-.25},{research:-.85}]);
      add(g); add(b2); mods.housing*=0.7; tempPen=2;
      tags.push({ic:"🔥",t:"고온",k:"temp",tip:`고온(≥400K) — ${lbl(g)} · ${lbl(b2)} · 거주 정원 ×0.7 · 구역 슬롯 −2`});}
    else if(T>=320){
      const g=pick1(p.n,"warm",[{energy:.10},{research:.10}]);
      add(g); tempPen=1;
      tags.push({ic:"🌡",t:"온난",k:"temp",tip:`온난(320–400K) — ${lbl(g)} · 구역 슬롯 −1`});}
    else if(T>=240){
      tags.push({ic:"☀",t:"온화",k:"temp",tip:"온화(240–320K) — 최적 거주 · 보정 없음"});}
    else if(T>=180){
      const g=pick1(p.n,"cold",[{minerals:.10},{alloy:.05}]);
      add(g); tempPen=1;
      tags.push({ic:"❄",t:"저온",k:"temp",tip:`저온(180–240K) — ${lbl(g)} · 구역 슬롯 −1`});}
    else {
      const g=pick1(p.n,"cryo1",[{minerals:.20},{alloy:.075},{research:.45}]);
      const b2=pick1(p.n,"cryo2",[{energy:-.75},{goods:-.50}]);
      add(g); add(b2); tempPen=2;
      tags.push({ic:"🧊",t:"극저온",k:"temp",tip:`극저온(<180K) — ${lbl(g)} · ${lbl(b2)} · 구역 슬롯 −2`});}
  }

  // ── ② 행성 유형 — 실제 관측된 분류. 확률이 아니라 항상 적용된다 ──
  const TYPE={
    "지구형 암석":  {ic:"🌏",t:"지구형",    happy:10,
      tip:"단단한 지표와 안정된 대기 — 행복도 +10"},
    "슈퍼지구":     {ic:"🪨",t:"슈퍼지구",  house:1.2, slot:1,
      tip:"넓은 지표 — 거주 정원 ×1.2 · 구역 슬롯 −1(높은 중력)"},
    "미니 해왕성":  {ic:"🌫",t:"미니해왕성",all:.10, slot:2,
      tip:"부유 채취 설비가 잘 듣는다 — 모든 자원 생산 +10% · 구역 슬롯 −2"},
    "가스 거인":    {ic:"🪐",t:"가스거인",  house:0.5, slot:4,
      tip:"발 디딜 땅이 거의 없다 — 거주 정원 ×0.5 · 구역 슬롯 −4"},
  };
  {const t=TYPE[p.t];
   if(t){ if(t.house) mods.housing*=t.house;
     if(t.slot) slotPen+=t.slot;
     if(t.happy) happy+=t.happy;
     if(t.all) add({goods:t.all,energy:t.all,minerals:t.all,research:t.all,alloy:t.all});
     tags.push({ic:t.ic,t:t.t,k:"type",tip:t.tip}); }}

  // ── ③ 특수 광맥 — 행성 조사로만 밝혀지는 25% 확률의 덤 ──
  const roll=_hstr(p.n)%100; let deposit=null, second=null;
  const DEP=[
    {ic:"⚡",t:"지열 지대",     res:"energy",  v:.50, tip:"특수 자원 — 에너지 +50%"},
    {ic:"⛏",t:"광물 대광맥",   res:"minerals",v:.50, tip:"특수 자원 — 광물 +50%"},
    {ic:"🌾",t:"비옥한 토양",   res:"goods",   v:.60, tip:"특수 자원 — 소비재 +60%"},
    {ic:"🔩",t:"희귀 금속 광맥",res:"alloy",   v:.50, tip:"특수 자원 — 철괴 +50%"},
    {ic:"📡",t:"이상 신호원",   res:"research",v:.70, tip:"특수 자원 — 정체불명의 신호 · 연구 +70%"},
  ];
  if(roll >= (hasRule("depositUp")?50:75)){          // 분기 '심층 시추' — 광맥 확률 25%→50%
    const D=DEP[_hstr(p.n+"d")%5];
    pct[D.res]+=D.v; deposit=D;
    second={ic:D.ic,t:D.t,k:"dep",tip:D.tip};
  }
  if(second) tags.push(second);

  for(const k in pct) pct[k]=clamp(pct[k],TRAIT_MIN,TRAIT_MAX);   // 합계는 −85%~+60%
  if(hasRule("noTempPen"))   tempPen=0;                   // 분기 '테라포밍'
  if(hasRule("halfTypePen")) slotPen=Math.floor(slotPen/2); // 분기 '기압 도시'
  return {pct,mods,tags,deposit,second,happy,tempPen,slotPen};
}
/* 구역 슬롯 — 최적 행성(온화·지구형)이 10칸.
   온도(0~−2)와 행성 유형(0~−4)이 깎고, 기술이 되돌린다. 상한 20칸.
   실제 슬롯 수는 '행성 조사'를 마쳐야 확정된다. */
const SLOT_BASE = 10;
function slotsOf(p){
  const t=planetTraits(p);
  return clamp(SLOT_BASE - t.tempPen - t.slotPen + techMods().slots, 3, SLOT_CAP);
}
/* 가장 먼 항성계보다 멀리 갈 이유는 없다. 넘어서면 '전 은하'로 표기한다. */
const SLOT_CAP = 20;      // 구역 슬롯 상한 (한 행성이 가질 수 있는 최대 칸)
const GALAXY_EDGE = Math.ceil(SYSTEMS.reduce((a,s)=>Math.max(a,s.dist),0));
/* 주행 거리는 직선 거리보다 길다 — 은하 끝까지 실제로 달리려면 반지름의 2배쯤 필요하다 */
const REACH_CAP = Math.ceil(GALAXY_EDGE*2.2);
const maxReach=()=>Math.min(REACH_CAP, BASE_REACH + techMods().reachAdd);
const reachStr=()=>maxReach()>=REACH_CAP?"전 은하":maxReach()+"ly";
const scanCost=sys=>Math.max(1,Math.ceil((3+Math.sqrt(sys.dist)*1.6)*techMods().scanMul));
const isSurveyed=id=>!!S.surveyed[id];
/* ── 행성 조사 ─────────────────────────────────────────────
   스캔은 '행성이 있다'까지만 알려준다. 어떤 땅인지(타입·광맥·구역 슬롯)는
   직접 조사선을 보내야 밝혀지고, 조사를 마쳐야 식민지를 세울 수 있다.
   항성계 단위로 조사하며, 제국 전체에서 한 번에 한 곳만 진행된다. */
const PROBE_DAYS = 90;                      // 3개월
const probeCost = sys => Math.max(2, Math.ceil((4+Math.sqrt(sys.dist)*1.2)*techMods().scanMul));
const isProbed = id => !!(S.probed&&S.probed[id]);
const probeJob = () => (S&&S.probe)||null;
/* 조사 기간도 감소 계열이다. 뺄셈이면 Lv.4 에서 하한에 붙어 이후 기술이 죽으므로
   곱셈으로 바꿔 점근시킨다 — 레벨당 −13%, 하한 20일. */
function probeDaysFor(){ return Math.max(20, PROBE_DAYS - techMods().probeCut); }
function startProbe(sysId){
  if(S.probe){ toast(`이미 ${sysById(S.probe.id).name}을(를) 조사 중입니다.`,"warn"); return; }
  if(!isSurveyed(sysId)){ toast("먼저 항성계를 스캔해야 합니다.","warn"); return; }
  if(isProbed(sysId)){ return; }
  const sys=sysById(sysId), c=probeCost(sys);
  if(S.res.alloy<c){ toast("철괴 부족 (필요 "+c+")","warn"); return; }
  S.res.alloy-=c;
  const d=probeDaysFor();
  S.probe={id:sysId, left:d, total:d, cost:c};
  pushLog(`🔬 ${sys.name} 행성 조사 시작 — ${Math.round(d/30)}개월 뒤 완료`,"");
  save(); renderAll();
}
function cancelProbe(){
  if(!S.probe)return; const sys=sysById(S.probe.id);
  S.res.alloy=Math.min(storageCap(), S.res.alloy+(S.probe.cost||0));
  pushLog(`🔬 ${sys.name} 조사 취소 — 철괴 ${S.probe.cost} 반환`,"");
  S.probe=null; save(); renderAll();
}
function probeTick(){
  if(!S.probe)return;
  S.probe.left--;
  if(S.probe.left<=0){
    const id=S.probe.id, sys=sysById(id);
    if(!S.probed)S.probed={}; S.probed[id]=true; S.probe=null;
    const n=sys.planets.length;
    pushLog(`🔬 ${sys.name} 조사 완료 — 행성 ${n}곳의 지질과 구역 슬롯이 밝혀졌습니다`,"good");
    initMap();
  }
}
/* ── 도달 판정 (스텔라리스식 항로) ─────────────────────────────
   원 안이면 어디든 가는 게 아니라, '탐사한 항성계와 항로로 이어져 있고
   그 항로 한 구간이 항행 사거리보다 짧을 때'만 갈 수 있다.
   → 항행 사거리 = 한 번에 건널 수 있는 항로의 길이. 기술로 늘리면 더 긴 구간이 열린다. */
/* 본거지에서 항로를 따라 갔을 때의 '주행 거리'. 지나가는 항성계는 탐사가 끝나 있어야 한다.
   → 직선으로 20ly인 별도 항로가 돌아가면 60ly를 달려야 할 수 있다. 길목(초크포인트)이 생긴다. */
let _road=null, _roadKey="";
function roadDist(){
  const free=hasRule("scoutFree");                  // 분기 '항로 개척' — 미탐사 항성계도 지나갈 수 있다
  const key=Object.keys(S.surveyed||{}).length+"|"+maxReach()+"|"+free;
  if(_road && _roadKey===key) return _road;
  const R=maxReach()+0.001, D={sol:0}, pq=[["sol",0]];
  while(pq.length){
    pq.sort((a,b)=>a[1]-b[1]);
    const [c,d]=pq.shift(); if(d>D[c]) continue;
    if(!free && c!=="sol" && !isSurveyed(c)) continue;   // 아직 탐사 안 한 곳은 지나갈 수 없다 (종점만 가능)
    for(const nb of (ADJ[c]||[])){
      const nd=d+laneLen(c,nb); if(nd>R) continue;
      if(D[nb]===undefined || nd<D[nb]){ D[nb]=nd; pq.push([nb,nd]); }
    }
  }
  _roadKey=key; _road=D; return D;
}
function inReach(sys){
  if(!sys) return false;
  if(sys.id==="sol"||isSurveyed(sys.id)) return true;
  return roadDist()[sys.id]!==undefined;
}
/* 그 항성계까지의 주행 거리와, 어느 별에서 뻗어 나가는 길인지 */
function laneIn(sys){
  let best=null;
  for(const nb of (ADJ[sys.id]||[])){ if(!isSurveyed(nb)) continue;
    const L=laneLen(nb,sys.id); if(!best||L<best.len) best={from:nb, len:L}; }
  if(best) best.road=roadDist()[sys.id];
  return best;
}

function newGame(){
  S={t:0,speed:1,res:Object.assign({},START),tech:{},terra:{},probeT:0,mega:{},rcards:[],ractive:null,rprog:0,rseed:0,anom:{},brownout:false,mshort:false,surveyed:{sol:true},probed:{sol:true},probe:null,colonies:{},log:[],dep:{energy:0,minerals:0,goods:0},day:0,lastMK:undefined};
  S.colonies["sol|0"]={districts:{housing:1,agri:1,energy:1,mining:1}, pops:5, growth:0, policy:"balanced", born:0};
  rebalanceJobs("sol|0");            // 배정을 안 하면 첫 달을 전원 실업으로 시작한다
  pushLog("본거지 지구에서 은하 개척을 시작합니다.","good");
  selSys="sol"; won=false; save();
}

/* 행성 지정(designation) 시스템은 제거되었습니다.
   특화 보너스가 보상을 지나치게 가속시켜, 대신 이벤트 보상으로 재활용할 예정입니다. */

/* ============ 자원 고갈 디버프 (누적 게이지) ============
   재고가 0에 묶이면 페널티가 '즉시' 걸리지 않는다. 매달 게이지가 차오르고,
   24개월(DEP_FILL) 만에 100%가 되어 최대 페널티에 도달한다.
   자원이 다시 흑자로 돌아서면 게이지가 12개월(DEP_DRAIN) 만에 0까지 빠진다.
   → 한두 달 적자는 견딜 수 있고, 방치하면 서서히 제국이 무너진다. */
const DEP_FILL=24, DEP_DRAIN=12;                 // 개월
const DEF_ICON={energy:"⚡",minerals:"⛏",goods:"📦",alloy:"🔩",research:"⚛"};
const DEF_LABEL={energy:"정전",minerals:"자재난",goods:"물자난",alloy:"철괴 고갈",research:"연구 마비"};
/* 자원별 100% 도달 시의 최대 페널티 */
const DEP_FX={
  energy:  {allProd:0.20, alloy:0.35, happy:10,
            desc:"모든 생산 구역 −20% · 철괴 −35% · 행복도 −10"},
  minerals:{alloy:0.50,
            desc:"철괴 생산 −50%"},
  goods:   {allProd:0.20, happy:15,
            desc:"모든 생산 구역 −20% · 행복도 −15"},
};
const DEP_KEYS=Object.keys(DEP_FX);
const depG = k => (S&&S.dep&&S.dep[k]) ? clamp(S.dep[k],0,1) : 0;     // 0~1 게이지
const depPct = k => Math.round(depG(k)*100);
const isDepleted = k => depG(k)>0.001;
/* 전 구역 공통 생산 배율 (에너지·소비재 고갈) */
function depProdMul(){ return (1-DEP_FX.energy.allProd*depG('energy')) * (1-DEP_FX.goods.allProd*depG('goods')); }
/* 철괴 전용 추가 배율 (에너지·광물 고갈) */
function depAlloyMul(){ return (1-DEP_FX.energy.alloy*depG('energy')) * (1-DEP_FX.minerals.alloy*depG('minerals')); }
/* 행복도 차감 */
function depletePenalty(){ return DEP_FX.energy.happy*depG('energy') + DEP_FX.goods.happy*depG('goods'); }
function depletedList(){ return DEP_KEYS.filter(k=>depG(k)>0.001); }
/* 지금 이 자원이 '고갈 상태'인가 (재고 0 + 순생산 적자) */
function depActive(k,r){ return S.res[k]<=0.01 && r[k]<-0.0001; }

/* ============ 일자리 배정 ============
   예전에는 화면을 그릴 때마다 인구를 처음부터 다시 나눠 담았다. 그래서 채굴 구역을
   하나 더 지으면 배정 순서가 앞인 광부가 인구를 먼저 가져가고 밭과 발전소가 비었다
   (실측: 행성 74%에서 평균 2,361명이 기존 구역에서 빠져나감). 이제 배정은 저장되는
   상태이고, 한 번 자리를 잡은 인원은 그대로 남는다. 새 구역에는 '남는 인구'만 들어간다. */
function jobsOf(col){
  if(!col.jobs) col.jobs={farmer:0,technician:0,miner:0,researcher:0,refiner:0};
  return col.jobs;
}
/* 이 행성이 이번 달 먹으려면 밭에 몇 명이 있어야 하는가 (천명) */
function foodWorkersNeeded(col,traits,pol){
  const tp=(traits.pct&&traits.pct.goods)||0, pm=polBonus(pol,"goods",col);
  const perPop=Math.max(0.3, BASE_YIELD*DIST_YIELD.agri*Math.max(0.2,1+tp+pm));
  let need=col.pops*POP_GOODS;
  for(const dk in col.districts){ const u=DISTRICTS[dk].upkeep;
    if(u&&u.goods) need+=u.goods*col.districts[dk]; }
  return Math.ceil(need/perPop*10)/10;
}
/* 배정을 다시 맞춘다 — 구역이 늘거나 줄었을 때, 인구가 변했을 때만 부른다. */
function rebalanceJobs(key){
  const col=S.colonies[key]; if(!col) return;
  const J=jobsOf(col);
  const T={farmer:0,technician:0,miner:0,researcher:0,refiner:0};
  for(const dk in col.districts){ const d=DISTRICTS[dk];
    if(d.job) T[d.job]+=d.jobs*col.districts[dk]; }
  // 1) 사라진 일자리만큼 해고
  for(const t of JOB_ORDER) J[t]=clamp(J[t]||0, 0, T[t]);
  // 2) 인구보다 많이 배정돼 있으면 비례 감원
  let sum=JOB_ORDER.reduce((a,t)=>a+J[t],0);
  if(sum>col.pops){ const f=col.pops>0?col.pops/sum:0;
    for(const t of JOB_ORDER) J[t]*=f; sum=col.pops; }
  // 3) 생존 우선 — 밭이 모자라면 남는 인구, 그래도 모자라면 인원이 가장 많은 직업에서 데려온다
  if(T.farmer>0){
    const traits=planetTraits(sysById(key.split("|")[0]).planets[+key.split("|")[1]]);
    const pol=POLICIES[col.policy||"balanced"];
    const target=Math.min(T.farmer, col.pops, foodWorkersNeeded(col,traits,pol));
    let want=target-J.farmer;
    if(want>1e-9){
      const fromSpare=Math.min(Math.max(0,col.pops-sum), want);
      J.farmer+=fromSpare; sum+=fromSpare; want-=fromSpare;
      let guard=0;
      while(want>1e-6 && guard++<10){
        const donors=JOB_ORDER.filter(t=>t!=="farmer"&&J[t]>1e-9).sort((a,b)=>J[b]-J[a]);
        if(!donors.length) break;
        const d=donors[0], take=Math.min(J[d],want);
        J[d]-=take; J.farmer+=take; want-=take;
      }
    }
  }
  // 4) 남는 인구를 빈 자리에 비례 배분 (새로 지은 구역이 여기서 채워진다)
  let spare=col.pops-JOB_ORDER.reduce((a,t)=>a+J[t],0);
  if(spare>1e-9){
    const open={}; let openSum=0;
    for(const t of JOB_ORDER){ const o=T[t]-J[t]; if(o>1e-9){ open[t]=o; openSum+=o; } }
    if(openSum>0){
      if(spare>=openSum){ for(const t in open) J[t]+=open[t]; }
      else { for(const t in open) J[t]+=spare*open[t]/openSum; }
    }
  }
}
function rebalanceAll(){ for(const key in S.colonies) rebalanceJobs(key); }

/* ============ 콜로니 계산 (인구 → 일자리 배정) ============ */
function colonyInfo(key){
  const [sysId,pi]=key.split("|"); const sys=sysById(sysId), p=sys.planets[+pi], col=S.colonies[key];
  const traits=planetTraits(p);
  let housing=BASE_HOUSING, totalJobs={farmer:0,technician:0,miner:0,researcher:0,refiner:0};
  for(const dk in col.districts){ const def=DISTRICTS[dk], c=col.districts[dk];
    if(def.housing) housing+=def.housing*c;
    if(def.job) totalJobs[def.job]+=def.jobs*c;
  }
  housing=Math.max(2, Math.round(housing*(traits.mods.housing||1)*(1+techMods().housing)) + megaLvl('ring')*3);   // 행성 특성 + 도시 계획 + 궤도 고리
  const polKey=col.policy||"balanced", pol=mergedPol(col);
  /* 배정은 저장된 상태(col.jobs)를 읽기만 한다. 여기서 바꾸지 않는다 —
     colonyInfo 는 화면 갱신 때마다 여러 번 호출되는 순수 조회 함수다. */
  const J=jobsOf(col);
  let employed={farmer:0,technician:0,miner:0,researcher:0,refiner:0}, sum=0;
  for(const t of JOB_ORDER){ employed[t]=Math.min(J[t]||0, totalJobs[t]); sum+=employed[t]; }
  if(sum>col.pops+1e-9){ const f=col.pops/sum;                       // 인구가 줄면 비례 축소
    for(const t of JOB_ORDER) employed[t]*=f; sum=col.pops; }
  let rem=Math.max(0, col.pops-sum);
  const used=Object.values(col.districts).reduce((a,b)=>a+b,0) + (col.bld?1:0) + qOf(col).length;   // 공사 중·대기 중인 구역도 슬롯을 차지
  // 안정도: 과밀 → 범죄 → 행복 (서로 맞물림)
  const excess=Math.max(0, col.pops-housing);                       // 주거 초과 인구 (과밀)
  const hardCap=Math.max(housing+2, Math.round(housing*1.2));        // 절대 상한(구조적) — 실질 정원은 주거(100%)
  const crime=clamp(Math.round(3 + rem*8 + excess*9 + col.pops*0.3 + (pol.crimeMod||0) - techMods().crime), 0, 100);
  /* 행성 유형이 행복에 직접 붙는다 (지구형 +10) — v76 */
  const happiness=hasRule("maxHappy") ? 100 : clamp(Math.round(75 - crime*0.5 - excess*4 - depletePenalty() + techMods().happy + modSum('happy') + (traits.happy||0)), 0, 100);
  return {key,sys,p,col,housing,hardCap,totalJobs,employed,unemployed:rem,pops:col.pops,slots:slotsOf(p),used,excess,crime,happiness,policy:polKey,pol,traits};
}
/* 전역 가동률(OPR): 에너지 재고가 바닥나면 '소비' 구역이 자동 정전(가동 중단)된다.
   발전 구역은 항상 가동 + 막혔을 때 비상 발전기가 재가동 → 전면 정전에서도 반드시 회복 가능.
   ※ 이 구조가 없으면 에너지 0 + 순생산 음수 상태에서 아무것도 못 지어 영구 소프트락에 빠진다. */
const BASE_ENERGY = 0.23;    // 식민지 1곳당 비상 발전기
const BASE_MINERALS = 0.3;  // 식민지 1곳당 기본 채취
/* ── 비상 생산은 '개척 지원'이지 영구 보조금이 아니다 ─────────────
   새 식민지가 자리를 잡는 동안만 나오고, 기간에 걸쳐 선형으로 0까지 줄어든다.
   영구로 두면 발전 구역을 안 지어도 굴러가서 압박이 사라지고,
   딱 끊으면 '에너지 0 + 발전 구역 0' 상태에서 아무것도 못 지어 소프트락에 빠진다.
   그래서 줄이되, 정말로 막힌 상태에서는 다시 켜진다(아래 재가동). */
const EMERG_MONTHS = 3;      // 에너지·광물 지원 기간
const RESEARCH_MONTHS = 6;   // 중앙 기록소 지원 기간
const emergFade = (born, months) => clamp(1-(gameDays()-(born||0))/(months*30), 0, 1);
/* 재가동 판정 — 그 자원을 만드는 구역이 하나도 없고 재고까지 바닥이면
   비상 설비가 다시 돈다. 판정에 생산량을 쓰지 않으므로 순환 참조가 없다. */
let RESCUE_E=false, RESCUE_M=false;
function computeRescue(){
  if(!S||!S.colonies){RESCUE_E=RESCUE_M=false;return;}
  let hasE=false, hasM=false;
  for(const key in S.colonies){ const d=S.colonies[key].districts||{};
    if(d.energy||d.fusion) hasE=true;
    if(d.mining) hasM=true; }
  RESCUE_E = !hasE && S.res.energy   <= 3;
  RESCUE_M = !hasM && S.res.minerals <= 3;
}
/* 식민지 1곳이 지금 받는 비상 지원 배수 */
const emergE = col => RESCUE_E ? 1 : emergFade(col.born, EMERG_MONTHS);
const emergM = col => RESCUE_M ? 1 : emergFade(col.born, EMERG_MONTHS);
const BROWNOUT_EXIT = 30;    // 이만큼 비축되면 정전 해제 (발전 구역 재건 가능선)

   고정 이벤트 + 랜덤 이벤트. 중요한 사건은 게임을 멈추고 선택을 요구한다.
   원칙: 결과는 기본적으로 회복 가능(자원·행복·일시 효과). 되돌릴 수 없는 건 미리 경고한다. */
const EV_INTERVAL = 90;      // 랜덤 이벤트 판정 주기(초)
const EV_CHANCE   = 0.55;    // 판정 시 발생 확률
function evState(){ if(!S.ev) S.ev={seen:{},next:EV_INTERVAL,sit:null,chain:null,crisis:null,mods:[]}; return S.ev; }

/* 일시 효과: {k:"happy"|"prod", v:값, until:종료시각, label} */
function evMods(){ const e=evState(); e.mods=(e.mods||[]).filter(m=>m.until>S.t); return e.mods; }
function modSum(k){ return evMods().filter(m=>m.k===k).reduce((a,m)=>a+m.v,0); }
function addMod(k,v,dur,label){ evState().mods.push({k,v,until:S.t+dur,label}); }

/* 자원을 한도 안에서 더한다 */
function gain(k,v){ const cap=storageCap(); S.res[k]=clamp((S.res[k]||0)+v,0,cap); }
function anyColonyKey(){ const ks=Object.keys(S.colonies); return ks.length?ks[0]:null; }
function avgHappy(){ const ks=Object.keys(S.colonies); if(!ks.length)return 75;
  return Math.round(ks.reduce((a,k)=>a+colonyInfo(k).happiness,0)/ks.length); }

/* ── 이벤트 표시 ── */
let evResume=null;
function fireEvent(ev){
  const e=evState();
  const opts=ev.opts.filter(o=>!o.when||o.when());
  if(!opts.length) return;
  evMarkSeen(ev.id);                                          // 쿨다운·가중치 기록
  if(ev.imp){ evResume=S.speed; S.speed=0; syncSpeed(); }     // 중요 사건은 일시정지
  let h=`<div class="ev-h"><span class="ev-i">${ev.icon}</span><div><div class="ev-t">${ev.title}</div>
    <div class="ev-tag">${ev.imp?'<b class="imp">일시정지</b> · ':''}${ev.kind||"사건"}</div></div></div>`;
  h+=`<p class="ev-x">${typeof ev.text==="function"?ev.text():ev.text}</p>`;
  h+=`<div class="ev-opts">`+opts.map((o,i)=>
    `<button class="ev-o" data-ev="${i}"><span class="eo-t">${o.t}</span>${o.d?`<span class="eo-d">${o.d}</span>`:''}</button>`).join("")+`</div>`;
  showModal(h,false,false);     // 선택지를 고르기 전에는 닫을 수 없다

function showEvResult(ev,msg){

/* ============ 상황(Situation) — 진행 바가 있는 지속형 사건 ============

      {id:"invest", t:"복지 투자", d:"진행 −0.9/s · 매초 광물·에너지 소모", rate:-0.9, drain:{minerals:0.6,energy:0.5}},
      {id:"ignore", t:"방치",     d:"진행 +0.6/s · 비용 없음",           rate:0.6},

/* 상황도 마찬가지. 경제 호황은 종료 직후 조건(행복도)이 그대로라 다음 틱에 곧장 다시 시작됐다. */
const SIT_COOLDOWN_MO = 72;    // 같은 상황은 최소 72개월(6년) 뒤에나 다시
function sitEnded(id){ const e=evState(); if(!e.sitSeen)e.sitSeen={}; e.sitSeen[id]=S.t; }
function sitReady(id){ const e=evState(); const t=(e.sitSeen||{})[id];
  return !t || S.t-t >= SIT_COOLDOWN_MO*SEC_PER_MONTH; }
function sitStart(id){
  const e=evState(); if(e.sit) return;
  const S2=SITUATIONS[id]; if(!S2) return;
  e.sit={id, prog:20, ap:S2.approaches[0].id};   // 0에서 시작하면 감소형 대응에 즉시 종료 판정이 걸린다
  evResume=S.speed; S.speed=0; syncSpeed();
  openSituation(true);
}
function sitTick(dt){
  const e=evState(); if(!e.sit) return;
  const def=SITUATIONS[e.sit.id]; if(!def){e.sit=null;return;}
  const ap=def.approaches.find(a=>a.id===e.sit.ap)||def.approaches[0];
  if(ap.drain){ for(const k in ap.drain){ if(S.res[k]<ap.drain[k]*dt) { /* 자원 없으면 효과 없음 */ }
      S.res[k]=Math.max(0,S.res[k]-ap.drain[k]*dt); } }
  e.sit.prog=clamp(e.sit.prog+ap.rate*dt,0,100);
  if(e.sit.prog>=100){ const msg=def.onFull(); const ic=def.icon,nm=def.name; const id=e.sit.id; e.sit=null; sitEnded(id);
    evResume=S.speed; S.speed=0; syncSpeed(); showEvResult({icon:ic,title:nm},msg); }
  else if(e.sit.prog<=0){ const msg=def.onClear?def.onClear():"상황이 종료됐습니다."; const ic=def.icon,nm=def.name; const id=e.sit.id; e.sit=null; sitEnded(id);
    pushLog(`${ic} ${nm} — ${msg}`,"good"); }
}
function openSituation(first){
  const e=evState(); if(!e.sit) return;
  const def=SITUATIONS[e.sit.id];
  let h=`<div class="ev-h"><span class="ev-i">${def.icon}</span><div><div class="ev-t">${def.name}</div>
    <div class="ev-tag">${first?'<b class="imp">일시정지</b> · ':''}상황 — 진행 중</div></div></div>`;
  h+=`<p class="ev-x">${def.desc}</p>`;
  h+=`<div class="sit-bar ${def.danger?'bad':'good'}"><i style="width:${e.sit.prog}%"></i></div>
      <div class="sit-n mono">진행 ${Math.round(e.sit.prog)}% / 100%</div>`;
  h+=`<div class="ev-opts">`+def.approaches.map(a=>
    `<button class="ev-o ${e.sit.ap===a.id?'on':''}" data-ap="${a.id}"><span class="eo-t">${a.t}${e.sit.ap===a.id?' ✓':''}</span><span class="eo-d">${a.d}</span></button>`).join("")+`</div>`;
  h+=`<div class="row"><button class="act solid" id="sitOk">${first?"대응 시작":"닫기"}</button></div>`;
  showModal(h,false);
  $("modalCard").querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
    const e2=evState(); if(!e2.sit)return; e2.sit.ap=b.dataset.ap;
    const d=SITUATIONS[e2.sit.id].approaches.find(a=>a.id===b.dataset.ap);
    if(d&&d.fx)d.fx(); save(); openSituation(false); });
  $("sitOk").onclick=()=>{ closeModal();
    if(evResume!==null){ S.speed=evResume; evResume=null; syncSpeed(); } save(); renderAll(); };
}

function crisisStart(){

    addMod("prod",-0.35,600,"잠식 지배"); e.crisis.prog=70; }

function crisisInvest(amount){
  const e=evState(); if(!e.crisis)return;
  const m=Math.min(S.res.minerals,amount), en=Math.min(S.res.energy,amount*0.8);
  if(m+en<=0){toast("투자할 자원이 부족합니다","warn");return;}

/* ============ 이벤트 체인 (고정, 다단계) ============
   단발로 끝나던 이상 현상을 이야기로 잇는다. 단계마다 '다음 목표 항성계'가 지정되고,
   그 별을 조사하면 다음 단계가 열린다 → 300개 항성계를 돌아다닐 이유가 생긴다. */
const CHAIN={
  id:"precursor", icon:"🗿", name:"선구자의 흔적",
  stages:[
    {t:"낯선 각인", x:"조사한 유적의 벽면에서 인류의 것이 아닌 각인이 발견됐습니다. 좌표처럼 보이는 배열이 새겨져 있습니다."},
    {t:"중계 지점", x:"각인이 가리킨 곳에 오래된 중계 장치가 떠 있었습니다. 여전히 희미한 신호를 보내고 있습니다."},
    {t:"보관고",   x:"신호의 끝에서 밀폐된 보관고를 찾았습니다. 안에는 사라진 문명의 기술 기록이 온전히 남아 있었습니다."},
  ],
  reward:()=>{ gain("research",1500); addMod("prod",0.10,900,"선구자 기술");
    return "선구자의 기록을 해독했습니다. 연구 1,500과 장기 생산 보너스를 얻었습니다."; },
};
function chainState(){ const e=evState(); if(!e.chain) e.chain={stage:-1,target:null}; return e.chain; }
/* 다음 목표: 아직 조사하지 않은 이상 현상 중 가장 가까운 곳 */
function pickChainTarget(){
  const cand=SYSTEMS.filter(sy=>anomalyOf(sy)&&!anomDone(sy.id));
  if(!cand.length) return null;
  cand.sort((a,b)=>a.dist-b.dist);
  return cand[Math.min(cand.length-1, chainState().stage+1)].id;
}
function chainAdvance(){
  const c=chainState(); c.stage++;
  const st=CHAIN.stages[c.stage];
  if(c.stage>=CHAIN.stages.length-1){        // 마지막 단계 → 보상
    const msg=CHAIN.reward(); c.target=null; c.done=true;
    evResume=S.speed; S.speed=0; syncSpeed();
    showEvResult({icon:CHAIN.icon,title:`${CHAIN.name} — ${st.t}`}, st.x+"<br><br><b>"+msg+"</b>");
    return; }
  c.target=pickChainTarget();
  const tn=c.target?sysById(c.target).name:null;
  evResume=S.speed; S.speed=0; syncSpeed();
  showEvResult({icon:CHAIN.icon,title:`${CHAIN.name} — ${st.t}`},
    st.x + (tn?`<br><br>다음 목표: <b style="color:var(--amber-2)">${tn}</b> 의 이상 현상을 조사하세요.`:""));
}
const chainTarget = () => { const c=chainState(); return c.done?null:c.target; };

/* ── 랜덤 이벤트 판정 ── */
/* 같은 이벤트가 연달아 나오지 않도록: 쿨다운 + 볼 때마다 확률 절반.
   예전에는 조건만 통과하면 매번 같은 후보에서 뽑아, 초반에 '이주 선단'만 반복됐다. */
const EV_COOLDOWN_MO = 54;     // 같은 이벤트는 최소 54개월(4.5년) 뒤에나 다시
function evSeen(id){ const e=evState(); return (e.seen&&e.seen[id])||null; }
function evWeight(v){
  const s=evSeen(v.id); if(!s) return 1;
  if(S.t-s.t < EV_COOLDOWN_MO*SEC_PER_MONTH) return 0;      // 쿨다운 중
  return 1/Math.pow(2, Math.min(s.n||1, 4));                 // 반복될수록 희박해짐
}
function evMarkSeen(id){
  const e=evState(); if(!e.seen)e.seen={};
  const s=e.seen[id]||{n:0}; s.n=(s.n||0)+1; s.t=S.t; e.seen[id]=s;
}
function rollEvents(dt){
  const e=evState();
  e.next=(e.next||EV_INTERVAL)-dt;
  if(e.next>0) return;
  e.next=EV_INTERVAL;
  if($("modal").classList.contains("on")) return;      // 이미 창이 떠 있으면 미룸
  const pool=EVENTS.filter(v=>(!v.when||v.when()) && evWeight(v)>0);
  if(!pool.length) return;
  const h=_hstr("roll"+Math.floor(S.t))%1000/1000;
  if(h>EV_CHANCE) return;
  const tot=pool.reduce((a,v)=>a+evWeight(v),0);
  let r=(_hstr("pick"+Math.floor(S.t))%10000/10000)*tot, pick=pool[pool.length-1];
  for(const v of pool){ r-=evWeight(v); if(r<=0){ pick=v; break; } }
  fireEvent(pick);
}

/* ============ 이상 현상 (탐사 보상) ============
   항성계의 약 1/3에 이상 현상이 있다. 스캔하면 드러나고, 철괴를 들여 조사하면 보상을 준다.
   보상은 거리에 비례 → 멀리 나갈 이유가 생기고, 장식이던 항성계들이 목적지가 된다.
   결과는 항성계 ID로 결정(고정)이라 세이브 리롤로 바꿀 수 없다. */

/* 종류 배정 — 해시로 고르면 우연히 같은 것이 서너 번 겹친다(실측 6종 중복 · 4종 미등장).

let _anomMap=null;
function anomMap(){

  SYSTEMS.filter(s=>s.dist>0 && _hstr(s.id)%100<34)          // 약 34% 만 보유
         .forEach((s,i)=>{ _anomMap[s.id]=kinds[i%kinds.length]; });

}
function anomalyOf(sys){ return (!sys||sys.dist<=0) ? null : (anomMap()[sys.id]||null); }
const anomDone = id => !!(S&&S.anom&&S.anom[id]);
const anomCost = sys => Math.max(2, Math.ceil((2+Math.sqrt(sys.dist)*1.1)*techMods().scanMul));
function anomReward(sys,a){ return Math.round(a.mul*(6+Math.sqrt(sys.dist)*1.9)); }
function doAnomaly(sysId){
  const sys=sysById(sysId), a=anomalyOf(sys);
  if(!a||anomDone(sysId))return;
  if(!isSurveyed(sysId)){toast("먼저 스캔해야 합니다","warn");return;}
  const c=anomCost(sys);
  if(S.res.alloy<c){toast("철괴 부족 (필요 "+c+")","warn");return;}
  S.res.alloy-=c;
  const pay=(r,amt)=>{
    if(r==="research"&&S.ractive){ S.rprog=(S.rprog||0)+amt; }     // 연구 중이면 진행도로 직행
    else S.res[r]=Math.min(storageCap(), S.res[r]+amt);

  const amt=anomReward(sys,a); pay(a.res,amt);
  let extra="";
  if(a.res2){ const amt2=Math.max(1,Math.round(anomReward(sys,a)*a.mul2/a.mul)); pay(a.res2,amt2);
    extra=` · ${RES_LABEL[a.res2]} +${amt2}`; }
  if(!S.anom)S.anom={}; S.anom[sysId]=a.id;
  pushLog(`${a.ic} ${sys.name} — ${a.name}: ${a.desc} (${RES_LABEL[a.res]} +${amt}${extra})`,"good");
  const ch=chainState();
  if(!ch.done && (ch.stage<0 ? a.id==="ruin" : sysId===ch.target)) chainAdvance();   // 고대 유적에서 시작, 이후 지정된 별에서 진행
