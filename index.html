const anomPending = () => SYSTEMS.filter(s=>isSurveyed(s.id)&&anomalyOf(s)&&!anomDone(s.id));

/* ============ 보급 범위 (하이퍼레인 실동작) ============
   본거지에서 하이퍼레인을 따라 '탐사된 항성계'만 거쳐 보급선이 뻗는다.
   멀수록 효율이 떨어지고, 이어지지 않으면 고립(0.6배) → 어느 별을 먼저 먹느냐(길목)가 전략이 된다. */
let SUPPLY={};
function computeSupply(){
  SUPPLY={};
  if(!LANES||!LANES.length) return;
  const adj={};
  LANES.forEach(([a,b])=>{ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); });
  SUPPLY["sol"]=0; const q=["sol"];
  while(q.length){ const cur=q.shift(), d=SUPPLY[cur];
    for(const nb of (adj[cur]||[])){
      if(SUPPLY[nb]!==undefined) continue;
      if(!isSurveyed(nb)) continue;              // 탐사한 항성계로만 보급선이 이어짐
      SUPPLY[nb]=d+1; q.push(nb);
    }
  }
}
/* 물자가 온전히 닿는 거리(정거장 = 항로를 한 번 건너는 것). 은하를 55개로 줄이면서
   항로가 성겨져 평균 정거장 수가 6.3 → 8.2 로 늘었다.
   3 그대로 두면 중거리 식민지 생산이 13% 깎인다 — 5 로 올려 예전 감각을 맞춘다. */
const supplyFree = () => 5+techMods().supplyFree;
function supplyInfo(sysId){
  if(sysId==="sol") return {jumps:0, mult:1, state:"본거지"};
  const j=SUPPLY[sysId];
  if(j===undefined) return {jumps:null, mult:0.6, state:"보급 단절"};
  const m=hasRule("noSupplyPen") ? 1 : clamp(1-Math.max(0,j-supplyFree())*0.06, 0.6, 1);
  return {jumps:j, mult:m, state:m>=0.999?"보급 양호":"보급 지연"};
}
function supplyMult(info){ return info&&info.sys ? supplyInfo(info.sys.id).mult : 1; }
function energyProdOf(info){
  const {employed,col}=info;
  // 기술자는 발전 구역과 융합로에 나뉜다 — 융합로 자리를 먼저 채운 것으로 계산
  const fuJobs=(col.districts.fusion||0)*DISTRICTS.fusion.jobs;
  const inFu=Math.min(employed.technician,fuJobs), inEn=employed.technician-inFu;
  return PER_MO(BASE_ENERGY*emergE(col)) + PER_MO((inFu+inEn)*BASE_YIELD*modTotal(info,'energy')*STAR_FACTOR(info.sys.star));
}
/* 구역이 무엇을 유지비로 쓰는지 → 어느 가동률에 묶이는지 */
const DIST_UP_RES={housing:"energy",agri:"energy",energy:"minerals",mining:"energy",lab:"energy",refinery:"minerals",fusion:"minerals",orbital:"energy",
  deepmine:"energy",hydro:"energy",campus:"energy",foundry:"minerals",arcology:"energy",singular:"minerals"};
const DFAC=(o,mr)=>{const f={};for(const dk in DISTRICTS)f[dk]=DIST_UP_RES[dk]==="minerals"?mr:o;return f;};
function mineralProdOf(info){
  const {employed,totalJobs}=info;
  /* 분기 '무인 채굴' — 광부가 비어 있어도 채굴 자리의 50% 만큼은 자동으로 캔다 */
  const n = hasRule("autoMine") ? Math.max(employed.miner, (totalJobs.miner||0)*0.5) : employed.miner;
  return PER_MO(n*BASE_YIELD*modTotal(info,'minerals'));
}
/* 자원별 가동률을 함께 푼다.
   에너지 소비 구역(주거·소비재·채굴·연구소)은 OPR, 광물 소비 구역(발전·제련소)은 MPR로 감산된다.
   발전량은 MPR에, 채굴량은 OPR에 묶여 서로 물리므로 반복 대입으로 수렴시킨다. */
function computeRatios(){
  if(!S||!S.colonies){OPR=1;MPR=1;return;}
  if(!Object.keys(S.colonies).length){OPR=1;MPR=1;S.brownout=false;S.mshort=false;return;}
  computeRescue();
  let eBase=0,eVar=0,eCons=0, mBase=0,mVar=0,mCons=0, n=0; const su2=scaleUpkeep();
  for(const key in S.colonies){ const info=colonyInfo(key); n++;
    const TMx=techMods(), sup=supplyMult(info), au=1+TMx.prodAll, gr=TMx.upkeepMul;
    const eE=BASE_ENERGY*emergE(info.col);
    eBase+=eE*sup*au;  eVar+=(energyProdOf(info)-eE)*sup*au;
    mBase+=BASE_MINERALS*emergM(info.col); mVar+=mineralProdOf(info)*sup*au;
    for(const dk in info.col.districts){ const d=DISTRICTS[dk],c=info.col.districts[dk];
      if(!d.upkeep)continue;
      if(d.upkeep.energy)   eCons+=d.upkeep.energy*c*gr*su2;
      if(d.upkeep.minerals) mCons+=d.upkeep.minerals*c*gr*su2; }
    if(info.pol.drain){ if(info.pol.drain.energy)eCons+=info.pol.drain.energy; if(info.pol.drain.minerals)mCons+=info.pol.drain.minerals; }
  }
  /* 해제 조건: 재고가 재건 가능선을 넘고 + 구조적 적자가 해소됐을 때.
     (재고만 보고 풀면 곧바로 다시 추락해 0↔30 진동이 생긴다)
     ※ 소비할 구역이 하나도 없으면(eCons≈0) 멈출 것도 없다 — 예전에는 이 경우에도
       정전이 유지돼서, 실제로는 아무 구역도 안 멈췄는데 경고만 계속 떴다. */
  if(S.brownout){ if(eCons<=0.001 || (S.res.energy>=BROWNOUT_EXIT && eBase+eVar>=eCons)) S.brownout=false; }
  else if(S.res.energy<=1 && eCons>0.001 && eBase+eVar<eCons) S.brownout=true;
  if(S.mshort){ if(mCons<=0.001 || (S.res.minerals>=BROWNOUT_EXIT && mBase+mVar>=mCons)) S.mshort=false; }
  else if(S.res.minerals<=1 && mCons>0.001 && mBase+mVar<mCons) S.mshort=true;
  const reserve=0.1*Math.max(1,n);
  let o=1,mr=1;
  for(let i=0;i<6;i++){          // 반복 대입 수렴
    o  = (S.brownout && eCons>0.001) ? clamp((eBase+eVar*mr-reserve)/eCons,0,1) : 1;
    mr = (S.mshort   && mCons>0.001) ? clamp((mBase+mVar*o -reserve)/mCons,0,1) : 1;
  }
  OPR=o; MPR=mr;
}
/* 인구가 매달 먹는 소비재 (1천명당, 월 기준) */
const POP_GOODS = 0.25, POP_GOODS_CROWD = 0.35;
/* 인구 증감 (명/월)
   성장은 175~225 사이에서 행복도가 결정한다 (행복 0 → 175, 100 → 225).
   행복도의 진짜 힘은 감소 쪽에 있다 — 40 아래로 떨어지면 사람이 빠져나가고,
   20 부근에서 성장을 앞질러 순감소로 뒤집힌다. */
const POP_GROW_MIN = 175, POP_GROW_MAX = 225;
/* 성장은 인구 규모에 비례해야 한다. 예전에는 절대값(월 175~225명)이라
   인구 8,000명 식민지도 800명 식민지와 같은 속도로 늘었고,
   정원 17,000을 채우는 데 190개월(16년)이 걸렸다. */
const POP_GROW_SCALE = 0.10;   // 인구 1천명당 성장 배율 +10%
const POP_UNREST_AT = 40, POP_UNREST_PER = 10;   // 행복 40 미만 → (40−행복)×10명 감소
const POP_CROWD_LOSS = 0.05;                     // 주거 초과 인원의 5%가 매달 이탈
const POP_STARVE = 250;                          // 소비재가 바닥나면 추가 감소

/* 식민지 수지 — 이 함수가 유일한 계산 근거다.
   B(내역 객체)를 넘기면 계산하면서 항목별로 기록한다.
   예전에는 툴팁이 같은 수식을 따로 구현해서, 비상 생산·행성 특성·기술 배율이
   빠진 채 표시돼 합계와 내역이 서로 맞지 않았다. */
/* ── 상황 보정 (덧셈 %) ───────────────────────────────────
   정책·행성특성·보급을 %로 더한다. 곱하면 몇 개만 겹쳐도 폭주하거나 0에 붙는데,
   더하면 "정책 +50% · 특성 −20% · 보급 −8% = 122%" 처럼 그대로 읽힌다.
   페널티 최대는 특성 −40% + 보급 −50% = −90% → 최저 10%. 0 밑으로는 못 내려간다.
   행복도는 여기 없다 — 생산이 아니라 '인구 증감'에만 작용한다. */
/* 정책 보너스 = 표기값 × 행복도 보정. 행복도를 못 구하는 자리(먹을 양 계산 등)에서는 기준값 60을 쓴다. */
/* 분기 '중앙 집권' — 정책을 두 개까지 겹쳐 적용한다. 보너스도 유지비도 둘 다 더해진다.
   기존 소비처는 전부 하나의 정책 객체를 읽으므로, 둘을 합친 가짜 정책을 만들어 넘긴다. */
function mergedPol(col){
  const a = POLICIES[(col&&col.policy)||"balanced"];
  const b = (hasRule("dualPolicy") && col && col.policy2 && col.policy2!==col.policy) ? POLICIES[col.policy2] : null;
  if(!b) return a;
  const m={name:`${a.name} + ${b.name}`, icon:a.icon, desc:"정책 2개 동시 적용",
           pct:{}, drain:{}, growthPct:0, crimeMod:0, dual:true};
  [a,b].forEach(P=>{
    if(P.pct)   for(const k in P.pct)   m.pct[k]  =(m.pct[k]  ||0)+P.pct[k];
    if(P.drain) for(const k in P.drain) m.drain[k]=(m.drain[k]||0)+P.drain[k];
    m.growthPct += P.growthPct||0; m.crimeMod += P.crimeMod||0;
  });
  return m;
}
function polBonus(pol, res, ctx){
  if(!pol||!pol.pct||!pol.pct[res]) return 0;
  let h = (ctx && ctx.happiness!==undefined) ? ctx.happiness : 60;
  return pol.pct[res]*polScale(h)*(1+techMods().pol);
}
function modParts(info, res){
  const pol=info.pol, tr=info.traits||planetTraits(info.p);
  return {
    정책: polBonus(pol, res, info),
    특성: tr.pct[res]||0,
    보급: supplyMult(info)-1,
  };
}
function modTotal(info,res){ const q=modParts(info,res);
  return Math.max(0, 1 + q.정책 + q.특성 + q.보급); }

/* 월 기준 상수를 내부(초) 단위로 */
const PER_MO = v => v/SEC_PER_MONTH;

/* 식민지 수지 — 이 함수가 유일한 계산 근거다. B를 넘기면 항목별로 기록한다.
   월 생산 = 고용 인원(천명) × BASE_YIELD × [상황 보정 %] × 기술 × 가동률 × 고갈 */
function colonyRates(info, B){
  const {p,sys,employed,col,pops,excess,pol,key}=info;
  const sf=STAR_FACTOR(sys.star);
  const TX=techMods(), gr=TX.upkeepMul, su=scaleUpkeep();
  const F=DFAC(OPR,MPR);
  const dp=depProdMul(), da=depProdMul()*depAlloyMul();
  const au=r=>(1+TX.prodAll+TX.prod[r])*(1+modSum('prod'));
  const rec = B ? (res,cat,v)=>{ if(v>0.0001) B[res].prod[cat]=(B[res].prod[cat]||0)+v;
                                 else if(v<-0.0001) B[res].cons[cat]=(B[res].cons[cat]||0)-v; } : null;

  const Y = (job,res,extra)=>PER_MO(employed[job]*BASE_YIELD*modTotal(info,res)*(extra||1));
  const gProd = Y('farmer','goods',DIST_YIELD.agri)*F.agri*au('goods')*dp;
  const eBase = PER_MO(BASE_ENERGY*emergE(col));
  const eVar  = (energyProdOf(info)-PER_MO(BASE_ENERGY*emergE(col)))*F.energy*au('energy')*dp;
  const mBase = PER_MO(BASE_MINERALS*emergM(col));
  const mVar  = mineralProdOf(info)      *F.mining   *au('minerals')*dp;   // '무인 채굴' 이 여기서 적용된다
  const rVar  = Y('researcher','research')*F.lab     *au('research')*dp;
  const aVar  = Y('refiner','alloy')     *F.refinery *au('alloy')   *da;
  /* 각인 '기계 승천' — 실업 인구는 소비재를 먹지 않는다 */
  const eaters = hasRule("noJobless") ? Math.max(0, pops-(info.unemployed||0)) : pops;
  const gPop  = PER_MO(eaters*POP_GOODS), gCrowd = PER_MO(excess*POP_GOODS_CROWD);
  if(rec){
    rec('goods','소비재 구역(생산공)', gProd);
    rec('goods','인구 소비재', -gPop);
    rec('goods','과밀 추가', -gCrowd);
    rec('energy','비상 발전기', eBase);
    rec('energy','발전 구역(기술자)', eVar);
    rec('minerals','비상 채굴', mBase);
    rec('minerals','채굴 구역(광부)', mVar);
    rec('research','연구소(연구원)', rVar);
    rec('alloy','제련소(제련공)', aVar);
  }
  const r={ goods:gProd-gPop-gCrowd, energy:eBase+eVar, minerals:mBase+mVar, research:rVar, alloy:aVar };
  for(const dk in col.districts){ const d=DISTRICTS[dk], c=col.districts[dk];
    if(d.upkeep) for(const k in d.upkeep){ const v=PER_MO(d.upkeep[k])*c*F[dk]*gr*su; r[k]-=v; if(rec)rec(k,'구역 유지비',-v); } }
  if(pol.drain) for(const k in pol.drain){ const v=PER_MO(pol.drain[k])*(k==="energy"?OPR:k==="minerals"?MPR:1);
    r[k]-=v; if(rec)rec(k,'정책 유지('+pol.name+')',-v); }
  return r;
}
/* 행정 부담: 식민지가 늘수록 연구 인력이 관료 업무에 묶인다.
   연구는 쌓이지 않는 자원이라, 이 소모가 생산을 넘으면 순수치가 음수가 되고 연구가 멈춘다. */
const ADMIN_FREE_COL=4, ADMIN_RES_PER=0.5;
function adminResearchCost(){
  const n=Object.keys((S&&S.colonies)||{}).length;
  return Math.max(0, n-ADMIN_FREE_COL) * ADMIN_RES_PER * techMods().adminMul;
}
/* 수도의 중앙 기록소 — 연구소가 하나도 없어도 아주 느리게는 진행된다.
   (연구가 구조적으로 0에 묶여 아무 기술도 못 얻는 상태를 막는 안전장치) */
const BASE_RESEARCH_MO = 0.5;              // 화면 표기 기준 +0.5/월 (초당 변환은 PER_MO)
function totalRates(){
  const r={energy:0,minerals:0,goods:0,research:0,alloy:0};
  for(const key in S.colonies){ const cr=colonyRates(colonyInfo(key)); for(const k in cr)r[k]+=cr[k]; }
  const mb=megaBonus(); for(const k in mb) r[k]+=mb[k];   // 메가구조물 고정 산출
  r.research += PER_MO(BASE_RESEARCH_MO)*emergFade(0, RESEARCH_MONTHS);   // 중앙 기록소 — 게임 시작 후 6개월간 점감
  r.research -= adminResearchCost();                      // 제국 규모 행정 부담
  return r;
}
/* 자원별 생산·소비 내역 (툴팁용) — 카테고리별로 합산 */
/* 자원별 생산·소비 내역 (툴팁용) — 계산은 colonyRates 가 하고 여기서는 모으기만 한다 */
function breakdown(){
  const B={energy:{prod:{},cons:{}},minerals:{prod:{},cons:{}},goods:{prod:{},cons:{}},research:{prod:{},cons:{}},alloy:{prod:{},cons:{}}};
  for(const key in S.colonies) colonyRates(colonyInfo(key), B);
  const mb=megaBonus(); for(const k in mb) if(mb[k]>0.0001) B[k].prod['메가구조물']=(B[k].prod['메가구조물']||0)+mb[k];
  {const v=PER_MO(BASE_RESEARCH_MO)*emergFade(0, RESEARCH_MONTHS);
   if(v>0.0001) B.research.prod['중앙 기록소']=(B.research.prod['중앙 기록소']||0)+v;}
  const ac=adminResearchCost(); if(ac>0.0001) B.research.cons['제국 행정 부담']=ac;
  return B;
}

/* ============ 액션 ============ */
function canAfford(c){return Object.keys(c).every(k=>S.res[k]>=c[k]);}
function pay(c){Object.keys(c).forEach(k=>S.res[k]-=c[k]);}

function doScan(sys){
  if(isSurveyed(sys.id))return;
  if(!inReach(sys)){toast("항로가 닿지 않습니다 — 앞쪽 항성계를 먼저 스캔하거나 항행 기술을 올리세요.","warn");return;}
  const c=scanCost(sys);
  if(S.res.alloy<c){toast("철괴 부족 (필요 "+c+")","warn");return;}
  S.res.alloy-=c; S.surveyed[sys.id]=true;
  const pr=sys.planets.filter(p=>p.esi>=0.8).length;
  pushLog("["+sys.name+"] 스캔 완료 · 행성 "+sys.planets.length+"개"+(pr?" · 거주후보 "+pr:""), pr?"good":"");
  save(); renderAll();
}
/* 식민지 비용 — '얼마나 먼가'로만 정한다. 척박함은 이미 슬롯·특성이 벌하고 있으므로
   ESI로 또 비싸게 받으면 낮은 ESI 행성은 갈 이유가 영영 사라진다. */
function colonizeCost(sys,p){const q=Math.pow(sys.dist||0,0.4), d=techMods().colonyMul;   // 개척·생명유지 계열 할인
  return{minerals:Math.round((45+q*9)*d),energy:Math.round((35+q*7)*d),alloy:Math.max(1,Math.round((Math.ceil(Math.sqrt(sys.dist||0)*1.5)+4)*d))};}
function doColonize(sys,pi){
  const p=sys.planets[pi], key=colKey(sys.id,pi);
  if(S.colonies[key])return;
  if(!isProbed(sys.id)){ toast("행성 조사를 먼저 마쳐야 식민지를 세울 수 있습니다.","warn"); return; }
  const c=colonizeCost(sys,p);
  if(!canAfford(c)){toast("자원 부족 — 식민지선을 보낼 수 없습니다.","warn");return;}
  pay(c);
  S.colonies[key]={districts: slotsOf(p)>=7?{housing:1,agri:1}:{housing:1,mining:1},
    pops: hasRule("bigStart")?5:1,                       // 분기 '분산 정착'
    growth:0, decline:0, policy:"balanced", policy2:null, born:gameDays()};
  rebalanceJobs(key);
  pushLog("["+p.n+"] 식민지 건설! ("+tierName[tierOf(p.esi)]+")", p.esi>=0.8?"good":"");
  if(!S.surveyed[sys.id])S.surveyed[sys.id]=true;
  save(); renderAll();
}
const DEMO_REFUND = 0.5;   // 철거 시 건설비의 절반을 돌려받는다 (되돌릴 수 있되 공짜는 아니게)
function doDemolish(key,dk){
  const col=S.colonies[key]; if(!col||!col.districts[dk]){return;}
  const c=buildCost(dk), rf={}; for(const k in c) rf[k]=Math.round(c[k]*DEMO_REFUND);
  col.districts[dk]--; if(col.districts[dk]<=0) delete col.districts[dk];
  rebalanceJobs(key);                                        // 철거된 자리의 인원을 풀어준다
  const cap=storageCap();
  for(const k in rf) S.res[k]=Math.min(cap,S.res[k]+rf[k]);
  pushLog(`${DISTRICTS[dk].icon} ${DISTRICTS[dk].name} 철거 — ${costStr(rf)} 회수`,"good");
  save(); renderPanel(); renderTop(); renderScore();
}
function buildCost(dk){const c=DISTRICTS[dk].cost,a=adminMult();
  const o={minerals:Math.round(c.minerals*a), energy:Math.round(c.energy*a)};   // 행정 부담 반영
  if(c.alloy) o.alloy=Math.round(c.alloy*a);                                    // 고급 구역은 철괴도 요구
  return o;}
const costStr = c => Object.keys(c).map(k=>`${rIco(k,12)}${c[k]}`).join(" ");
/* 구역은 즉시 생기지 않는다 — 착공 후 1개월(30일)이 지나야 완공된다.
   비용은 착공 시점에 빠지고, 완공 전에는 취소해서 전액 돌려받을 수 있다.
   식민지 한 곳당 동시에 하나만 짓는다. */
const BUILD_DAYS = 90;      // 3개월 — 구역 하나를 세우는 데 드는 시간
function doBuild(key,dk){
  const col=S.colonies[key]; if(!col)return;
  const info=colonyInfo(key);
  if(info.used>=info.slots){toast("건설 슬롯이 가득 찼습니다.","warn");return;}
  const cost=buildCost(dk);
  if(!canAfford(cost)){toast("자원 부족","warn");return;}
  pay(cost);
  if(col.bld){                                  // 이미 짓는 중이면 줄을 세운다
    qOf(col).push({dk, cost});
    pushLog(`${DISTRICTS[dk].icon} ${DISTRICTS[dk].name} 대기열 ${qOf(col).length}번째에 추가`, "");
  }else{
    col.bld={dk, left:BUILD_DAYS, total:BUILD_DAYS, cost};
    pushLog(`${DISTRICTS[dk].icon} ${DISTRICTS[dk].name} 착공 — ${Math.round(BUILD_DAYS/30)}개월 뒤 완공`, "");
  }
  save(); renderPanel(); renderTop(); renderScore();
}
/* 대기열 — 공사는 한 번에 하나씩이지만, 미리 줄을 세워둘 수 있다.
   비용은 줄을 설 때 바로 빠지고, 취소하면 전액 돌려받는다. */
function qOf(col){ if(!col.q) col.q=[]; return col.q; }
/* 환급은 보관 한도를 넘겨 채우지 않되, 이미 한도를 넘어 있던 재고를 깎지도 않는다. */
function refund(c){ const cap=storageCap();
  for(const k in c) S.res[k]=Math.max(S.res[k], Math.min(cap, S.res[k]+c[k])); }
function cancelBuild(key, idx){
  const col=S.colonies[key]; if(!col)return;
  if(idx===undefined||idx===null||idx<0){        // 공사 중인 것 취소 → 다음 대기가 바로 착공
    if(!col.bld)return;
    const c=col.bld.cost||buildCost(col.bld.dk), dk=col.bld.dk;
    refund(c);
    pushLog(`${DISTRICTS[dk].icon} ${DISTRICTS[dk].name} 착공 취소 — ${costStr(c)} 반환`,"");
    col.bld=null; startNextBuild(col);
  }else{                                          // 대기열에서 빼기
    const q=qOf(col); if(idx>=q.length)return;
    const it=q.splice(idx,1)[0];
    refund(it.cost||buildCost(it.dk));
    pushLog(`${DISTRICTS[it.dk].icon} ${DISTRICTS[it.dk].name} 대기 취소 — ${costStr(it.cost||buildCost(it.dk))} 반환`,"");
  }
  save(); renderPanel(); renderTop(); renderScore();
}
function startNextBuild(col){
  const q=qOf(col);
  if(col.bld||!q.length) return;
  const it=q.shift();
  col.bld={dk:it.dk, left:BUILD_DAYS, total:BUILD_DAYS, cost:it.cost};
}
/* 하루가 지날 때마다 공사를 진행시킨다 */
function buildTick(){
  for(const key in S.colonies){ const col=S.colonies[key];
    if(!col.bld){ startNextBuild(col); continue; }
    col.bld.left--;
    if(col.bld.left<=0){ const dk=col.bld.dk;
      col.districts[dk]=(col.districts[dk]||0)+1; col.bld=null;
      rebalanceJobs(key);                                   // 새 구역은 '남는 인구'로만 채운다
      pushLog(`${DISTRICTS[dk].icon} ${DISTRICTS[dk].name} 완공`,"good");
      startNextBuild(col);                                  // 줄 서 있던 다음 구역을 바로 착공
    } }
}
/* 정책은 제국의 방향을 정하는 결정이다. 자주 갈아끼우면 그때그때 이득만 챙기게 되므로
   한 번 정하면 10년간 유지된다.
   ※ 예전에는 남은 기간을 BUILD_DAYS 로 나눴다 — '1개월 = 30일'과 '공사 기간'이
     우연히 같은 값이라 붙어 있었을 뿐이라, 공사 기간을 바꾸면 잠금 표시가 같이 틀어졌다. */
const MONTH_DAYS = 30;
const POL_COOLDOWN_MO = 120, POL_COOLDOWN_DAYS = POL_COOLDOWN_MO*MONTH_DAYS;
function polLeft(key,slot){                  // 남은 '개월' (0이면 변경 가능). 주/보조 정책은 잠금이 따로다.
  const col=S.colonies[key]; if(!col) return 0;
  const at = (slot===2) ? col.polAtDay2 : col.polAtDay;
  if(at===undefined) return 0;
  const passed = gameDays()-at;
  return Math.max(0, Math.ceil((POL_COOLDOWN_DAYS-passed)/MONTH_DAYS));
}
/* 남은 개월을 사람이 읽는 말로 — 120개월은 '10년'이 훨씬 빨리 읽힌다 */
function moStr(mo){
  if(mo<12) return mo+"개월";
  const y=Math.floor(mo/12), m=mo%12;
  return m?`${y}년 ${m}개월`:`${y}년`;
}
/* 정책을 누르면 바로 바뀌지 않고, 효과·유지비·잠금 기간을 보여준 뒤 확인을 받는다 */
function askPolicy(key,pk,slot){
  slot = slot===2 ? 2 : 1;
  const col=S.colonies[key]; if(!col)return;
  const curKey = slot===2 ? (col.policy2||"balanced") : (col.policy||"balanced");
  if(curKey===pk){ toast("이미 적용 중인 정책입니다.",""); return; }
  const other = slot===2 ? (col.policy||"balanced") : (col.policy2||"balanced");
  if(pk!=="balanced" && pk===other){ toast("주 정책과 같은 정책은 겹칠 수 없습니다.","warn"); return; }
  const left=polLeft(key,slot);
  if(left>0){ toast(`정책 변경 잠금 중 — ${left}개월 남음`,"warn"); return; }
  const P=POLICIES[pk], cur=POLICIES[curKey];
  const M=SEC_PER_MONTH;
  /* 표기값과 '지금 이 행성에서 실제로 붙는 값'을 함께 보여준다 — 행복도에 따라 달라지기 때문 */
  const hNow=Math.round(colonyInfo(key).happiness), sc=polScale(hNow);
  const shown=(v)=>`<b class="g">+${Math.round(v*100)}%</b> <small style="color:var(--dim)">→ 지금 +${(v*sc*100).toFixed(1)}% (행복 ${hNow}%)</small>`;
  const eff = P.pct ? Object.keys(P.pct).map(k=>`<div class="pw-r"><span>${rIco(k,14)} ${RES_LABEL[k]} 생산</span>${shown(P.pct[k])}</div>`).join("")
            : P.growthPct ? `<div class="pw-r"><span>📈 인구 성장</span>${shown(P.growthPct)}</div>`
            : `<div class="pw-r"><span>효과</span><b>없음</b></div>`;
  const drain = P.drain ? Object.keys(P.drain).map(k=>`<div class="pw-r"><span>${rIco(k,14)} ${RES_LABEL[k]} 유지비</span><b class="b">−${(P.drain[k]*M).toFixed(1)}/월</b></div>`).join("")
            : `<div class="pw-r"><span>유지비</span><b>없음</b></div>`;
  showModal(`<h2>${POL_RES[pk]?rIco(POL_RES[pk],18):P.icon} ${P.name}</h2>
    <p style="margin-bottom:14px">이 행성의 정책을 <b>${cur.name}</b>에서 <b style="color:var(--amber-2)">${P.name}</b>(으)로 바꿉니다.</p>
    <div class="pw-box"><div class="pw-h">효과</div>${eff}</div>
    <div class="pw-box"><div class="pw-h">유지비 <small>이 행성에서 매달 빠져나갑니다</small></div>${drain}</div>
    <div class="pw-warn">⚠ 한 번 바꾸면 <b>${moStr(POL_COOLDOWN_MO)}간 다시 바꿀 수 없습니다.</b>
      유지비를 감당하지 못하면 자원이 마이너스로 돌아설 수 있으니 순생산을 먼저 확인하세요.</div>
    <div class="row"><button class="act solid" id="mYes">${P.name}으로 변경</button><button class="act ghost" id="mNo">취소</button></div>`);
  $("mYes").onclick=()=>{ doPolicy(key,pk,slot); closeModal(); };
  $("mNo").onclick=()=>closeModal();
}
function doPolicy(key,pol,slot){
  slot = slot===2 ? 2 : 1;
  const col=S.colonies[key]; if(!col)return;
  if(slot===2){ if(col.policy2===pol)return; if(polLeft(key,2)>0)return;
                col.policy2=pol; col.polAtDay2=gameDays(); }
  else        { if(col.policy===pol)return;  if(polLeft(key,1)>0)return;
                col.policy=pol;  col.polAtDay=gameDays(); }
  pushLog(`${POLICIES[pol].icon} 정책 변경 — ${POLICIES[pol].name} (${moStr(POL_COOLDOWN_MO)} 잠금)`,"");
  save(); renderPanel(); renderTop();
}

/* ============ 틱 ============ */
/* ============ 월 단위 정산 ============
   자원·연구·인구는 매 게임 '월'이 넘어갈 때 한 번에 정산된다(스텔라리스 방식).
   이벤트·상황·위기·프로브처럼 시점이 중요한 것은 매 틱 그대로 흐른다. */
const SEC_PER_MONTH = 30.4/DAYS_PER_SEC;          // 한 달에 해당하는 게임 초 (≈6.08)
const monthKey = () => { const g=gameDate(); return g.y*12+g.m; };

function applyMonth(span){
  // span = 지난 정산 이후 흐른 게임 초. 총량은 연속 계산과 동일하고, 지급 시점만 월 단위로 묶인다.
  const r=totalRates(), cap=storageCap(), months=span/SEC_PER_MONTH;
  for(const k in r){
    if(k==="research"){
      // 연구는 쌓이지 않는다. 순수치가 양수일 때만 진행도가 오르고, 0 이하면 그대로 멈춘다.
      S.res.research=0;
      if(S.ractive && r.research>0) S.rprog=(S.rprog||0)+r.research*span;
      else if(S.ractive && r.research<=0 && (!S.rStallWarn||S.t-S.rStallWarn>120)){ S.rStallWarn=S.t;
        pushLog(`⚛ 연구 정지 — 행정 부담이 연구 생산을 넘었습니다. 연구소를 늘리거나 확장을 늦추세요.`,"warn"); }
      continue; }
    let v=Math.max(0,S.res[k]+r[k]*span);
    if(v>cap){ v=cap; if(!S.capWarn||S.t-S.capWarn>60){ S.capWarn=S.t;
        pushLog(`📦 ${RES_LABEL[k]} 보관 한도(${fmt(cap)}) 초과 — 넘치는 만큼 버려집니다. 물류 창고 기술이나 식민지를 늘리세요.`,"warn"); } }
    S.res[k]=v; }
  if(S.ractive&&(S.rprog||0)>=researchGoal()) finishResearch();

  // 자원 고갈 게이지 — 24개월에 걸쳐 차오르고, 회복되면 12개월에 걸쳐 빠진다
  if(!S.dep)S.dep={energy:0,minerals:0,goods:0};
  for(const k of DEP_KEYS){
    const before=depG(k);
    const on=depActive(k,r);
    S.dep[k]=clamp((S.dep[k]||0) + (on ? months/DEP_FILL : -months/DEP_DRAIN), 0, 1);
    if(before<0.001 && S.dep[k]>=0.001)
      pushLog(`${DEF_ICON[k]} ${RES_LABEL[k]} 고갈 시작 — 방치하면 24개월에 걸쳐 페널티가 최대치까지 차오릅니다. (${DEP_FX[k].desc})`,"warn");
    if(before<1 && S.dep[k]>=1)
      pushLog(`${DEF_ICON[k]} ${RES_LABEL[k]} 고갈 100% — 페널티 최대치 도달! ${DEP_FX[k].desc}`,"bad");
  }

  // ── 인구: 성장과 감소 (명 단위, 연속값) ──
  //   성장 = (175~225, 행복도로 결정) × 주거 여유 × 거주 적합도 × 정책
  //   감소 = 행복 40 미만 페널티 + 과밀 + 소비재 고갈
  //   pops 는 '천명' 단위 소수다 (4.306 = 4,306명).
  for(const key in S.colonies){
    const info=colonyInfo(key), col=info.col;
    const H=info.housing, P=col.pops;
    const room = H>0 ? clamp((H-P)/H, 0, 1) : 0;             // 주거 여유 (꽉 찰수록 0)
    const hab  = 1;   // ESI는 성장 속도에 관여하지 않는다 — 주거 여유(room)와 행복도만으로 결정
    const hRatio = clamp(info.happiness/100, 0, 1);
    const scale  = 1 + P*POP_GROW_SCALE;              // 규모 비례
    /* 생명공학·생명유지·외계생물학 계열의 '인구 성장 +N%' 는 techMods() 에서
       계산만 되고 여기에 연결돼 있지 않았다 — 기술을 아무리 찍어도 성장이 그대로였다. */
    const techG  = Math.max(0.1, 1 + techMods().growth);
    const growPerMo = hasRule("noGrowth") ? 0 :
                      (POP_GROW_MIN + (POP_GROW_MAX-POP_GROW_MIN)*hRatio)
                      * scale * techG * room * hab
                      * (1 + (info.pol.growthPct||0)*polScale(info.happiness)*(1+techMods().pol));

    let dropPerMo = 0;
    if(info.happiness < POP_UNREST_AT) dropPerMo += (POP_UNREST_AT-info.happiness)*POP_UNREST_PER;
    const over = Math.max(0, P - H);
    if(over>0)                dropPerMo += over*1000*POP_CROWD_LOSS;   // 초과 인원의 5%
    if(S.res.goods<=0.01)     dropPerMo += POP_STARVE;                 // 소비재 고갈

    const net = (growPerMo - dropPerMo) * months / 1000;      // 명 → 천명
    col.pops = Math.max(0.2, P + net);                        // 최소 200명은 남는다
    col.growth = growPerMo; col.decline = dropPerMo;          // 화면 표시용
  }
  rebalanceAll();          // 인구가 변했으니 남는 인구를 빈 자리에 넣고, 줄었으면 정리한다
}

/* ── 하루(1일) 진행 ─────────────────────────────────────────
   시간은 항상 1일씩만 움직인다. 배속은 '하루가 지나가는 속도'만 바꾼다. */
function stepDay(){
  if(S.day===undefined) S.day=Math.floor((S.t||0)*DAYS_PER_SEC);
  if(S.lastMK===undefined){ S.lastMK=monthKey(); S.lastApplyT=S.t||0; }

  S.day += 1;
  S.t = S.day*DAY_SEC;                // 파생값 — 부동소수 누적 오차 없음

  // 탐사 프로브(해금): 사거리 내 가장 가까운 미탐사 항성계를 자동 스캔
  if(hasUnlock("probe")){ S.probeT=(S.probeT||0)+DAY_SEC;
    if(S.probeT>=8){ S.probeT=0;
      let best=null; for(const sy of SYSTEMS){ if(isSurveyed(sy.id)||!inReach(sy))continue;
        if(S.res.alloy>=scanCost(sy)&&(!best||sy.dist<best.dist)) best=sy; }
      if(best){ S.res.alloy-=scanCost(best); S.surveyed[best.id]=true;
        pushLog("🛰 프로브가 "+best.name+"을(를) 자동 탐사했습니다","good"); initMap(); } } }

  // ── 달이 바뀌는 날 → 한 달치 한 번에 정산
  const mk=monthKey();
  if(mk!==S.lastMK){
    const span=S.t-(S.lastApplyT||0);
    applyMonth(span);
    S.lastMK=mk; S.lastApplyT=S.t;
    S.monthFlash=16;                  // 정산 표시(실시간 약 0.8초)
  }

  buildTick();                        // 구역 공사 진행 (하루 단위)
  probeTick();                        // 행성 조사 진행

  // ── 이벤트·상황·위기는 시점이 중요하므로 매일 흐른다
  rollEvents(DAY_SEC); sitTick(DAY_SEC); crisisTick(DAY_SEC);
  {const e=evState();
   if(!e.sit&&!$("modal").classList.contains("on")) for(const id in SITUATIONS){ if(sitReady(id)&&SITUATIONS[id].start()){ sitStart(id); break; } }
   if(!e.crisis&&!e.crisisDone&&tierIndex()>=2&&!$("modal").classList.contains("on")){ e.crisisDone=true; crisisStart(); }}
}

/* ── 실시간 틱(50ms) → 배속만큼 '일'을 쌓아 하루씩 소비 ── */
const TICK_MS = 50;
let dayAcc = 0, slowAcc = 0, saveAcc = 0;
function tick(){
  if(!S||S.speed===0) return;
  if(S.monthFlash>0) S.monthFlash--;

  dayAcc += (TICK_MS/1000)*S.speed*DAYS_PER_SEC;   // 이번 틱에 흐른 '일' 수
  if(dayAcc<1){ if((S.monthFlash||0)>0) renderTop(); return; }

  computeSupply();                    // 보급망 갱신 (하이퍼레인 경유)
  computeRatios();                    // 자원별 가동률 갱신

  let n=0;
  while(dayAcc>=1 && n<60){ dayAcc-=1; stepDay(); n++; }
  if(dayAcc>=1) dayAcc=0;             // 탭 복귀 등으로 크게 밀린 경우 잘라냄

  if(!S.rcards||!S.rcards.length) drawCards();

  renderTop();                        // 날짜·자원은 매일 갱신
  tickPanelNumbers();                 // 카운트다운은 잠금 없이 매 틱 (숫자만 교체)
  if(++slowAcc>=5){ slowAcc=0;        // 무거운 갱신은 초당 4회로 제한
    renderScore(); renderCoach(); refreshPanelLive(); refreshEmpireLive(); checkWin(); syncTabs(); }
  if(++saveAcc>=100){ saveAcc=0; save(); }   // 약 5초마다 저장
}

/* ============ 코치 (지금 할 일) ============ */
function computeNext(){
  const r=totalRates();
  // 0) 정전 사태 — 최우선 (구역이 자동 정지된 상태)
  if(S.brownout) return {tag:"정전",cls:"warn",msg:`<b>⚡ 정전 사태</b> — 에너지가 모자라 구역이 <b>${Math.round((1-OPR)*100)}% 정지</b>했습니다. 발전 구역을 지으면 즉시 복구됩니다.`,target:firstColonySys()};
  // 0-1) 진행 중인 위기 / 상황 / 체인 목표
  {const e=evState();
   if(e.crisis) return {tag:"위기",cls:"warn",msg:`<b>☄ ${CRISIS.name}</b> 진행 ${Math.round(e.crisis.prog)}% — 상단 <b>위기</b> 칩을 눌러 자원을 투입하세요.`,target:null};
   if(e.sit&&SITUATIONS[e.sit.id].danger) return {tag:"상황",cls:"warn",msg:`<b>${SITUATIONS[e.sit.id].icon} ${SITUATIONS[e.sit.id].name}</b> ${Math.round(e.sit.prog)}% — 상단 칩을 눌러 대응을 바꾸세요.`,target:null};
   const ct=chainTarget();
   if(ct&&isSurveyed(ct)&&!anomDone(ct)) return {tag:"단서",cls:"",msg:`<b>${CHAIN.icon} ${CHAIN.name}</b> — <b>${sysById(ct).name}</b>의 이상 현상을 조사하면 다음 단서가 나옵니다.`,target:ct,sel:ct};
   if(ct&&!isSurveyed(ct)) return {tag:"단서",cls:"",msg:`<b>${CHAIN.icon} ${CHAIN.name}</b> — 단서가 <b>${sysById(ct).name}</b>를 가리킵니다. 그곳을 스캔하세요.`,target:ct,sel:ct};}
  // 0-2) 자원 고갈(디버프 발동)
  const dep=depletedList();
  if(dep.length){ const k=dep[0], jobFix={energy:"발전 구역",minerals:"채굴 구역",goods:"소비재 구역",alloy:"제련소",research:"연구소"}[k];
    return {tag:"경고",cls:"warn",msg:`<b>${DEF_ICON[k]} ${RES_LABEL[k]} 고갈 ${depPct(k)}%</b> — ${DEP_FX[k].desc} (100%까지 24개월). <b>${jobFix}</b>를 짓거나 소비를 줄이면 게이지가 빠집니다.`,target:firstColonySys()};}
  // 1) 소비재 위기
  if(r.goods<-0.05 && S.res.goods<30) return {tag:"경고",cls:"warn",msg:"<b>소비재이 부족</b>합니다. 식민지에 <b>소비재 구역</b>을 지어 생산공를 늘리세요.",target:firstColonySys()};
  // 1-2) 에너지 위기 (구역 유지비 > 발전)
  if(r.energy<-0.05 && S.res.energy<30) return {tag:"경고",cls:"warn",msg:"<b>에너지가 부족</b>합니다. 구역 유지비가 발전량을 넘었어요 — <b>발전 구역</b>을 지으세요.",target:firstColonySys()};
  // 1-3) 불안정 (행복도 낮음 / 범죄 높음)
  const unstable=lowHappiness();
  if(unstable) return {tag:"경고",cls:"warn",msg:"<b>"+unstable.pname+"</b> 행복도 "+unstable.h+"% — 범죄·과밀 때문입니다. <b>치안 정책</b>이나 <b>거주 구역</b>으로 안정시키세요.",target:unstable.sysId,sel:unstable.sysId};
  /* 1-4) 연구 정지 — 연구는 쌓이지 않는 자원이라 순수치가 0 이하면 기술이 영원히 멈춘다.
     기존에는 이 단계가 5순위(스캔·확장 뒤)에 있어서, 실제로는 몇십 년이 지나도
     "스캔하세요"만 뜨고 연구가 멈춘 사실을 한 번도 알려주지 않았다. */
  if(Object.keys(S.colonies).length && r.research<=0.0001){
    const labs=labCount(), rs=researcherCount(), adm=admRes();
    if(labs===0) return {tag:"연구 정지",cls:"warn",
      msg:`<b>⚛ 연구가 멈췄습니다</b> — 연구소가 하나도 없습니다. 식민지에 <b>연구소</b>를 지으면 다시 진행됩니다.`,
      target:firstColonySys(),sel:firstColonySys()};
    if(rs<0.05) return {tag:"연구 정지",cls:"warn",
      msg:`<b>⚛ 연구가 멈췄습니다</b> — 연구소 ${labs}개가 있지만 <b>배정된 연구원이 없습니다</b>. 인구가 일자리보다 적어요. <b>거주 구역</b>을 지어 인구를 늘리거나, 쓰지 않는 구역을 철거해 인력을 돌리세요.`,
      target:firstColonySys(),sel:firstColonySys()};
    if(adm>0.05) return {tag:"연구 정지",cls:"warn",
      msg:`<b>⚛ 연구가 멈췄습니다</b> — 연구원 ${fmtPop(rs)}의 생산을 <b>행정 부담(${adm.toFixed(1)}/월)</b>이 넘었습니다. 연구소를 더 짓거나 <b>행정</b> 계열 기술로 부담을 줄이세요.`,
      target:firstColonySys(),sel:firstColonySys()};
    return {tag:"연구 정지",cls:"warn",
      msg:`<b>⚛ 연구가 멈췄습니다</b> — 연구소 ${labs}개, 연구원 ${fmtPop(rs)}인데도 순수치가 0입니다. 정전이나 자원 고갈로 구역이 멈춰 있는지 확인하세요.`,
      target:firstColonySys(),sel:firstColonySys()};
  }
  /* 1-5) 보관 한도에 붙어 생산이 버려지는 중 */
  {const w=wastedRes(r);
   if(w) return {tag:"낭비",cls:"warn",
     msg:`<b>${RES_LABEL[w.k]}이(가) 보관 한도 ${fmt(w.cap)}에 찼습니다</b> — 월 <b>+${w.per.toFixed(1)}</b>이 그대로 버려지고 있어요. ${w.how}`,
     target:firstColonySys(),sel:firstColonySys()};}
  // 2) 실업 인구
  const un=firstUnemployed();
  if(un) return {tag:"할 일",cls:"",msg:"<b>"+un.pname+"</b>에 실업 인구 "+fmtPop(un.n)+" — <b>구역을 지어</b> 일자리를 주면 자원이 늘어납니다.",target:un.sysId,sel:un.sysId};
  // 3) 식민지화 가능한 거주후보
  const col=colonizable();
  if(col) return {tag:"확장",cls:"",msg:"<b>"+col.pname+"</b>("+tierName[col.tier]+")에 <b>식민지</b>를 건설할 수 있습니다.",target:col.sysId,sel:col.sysId};
  // 3-1) 조사가 먼저 필요한 거주 후보
  {const pb=probable();
   if(pb) return {tag:"조사",cls:"",msg:"<b>"+pb.pname+"</b>에 식민지를 세우려면 먼저 <b>🔬 행성 조사</b>가 필요합니다 (철괴 "+pb.cost+").",target:pb.sysId,sel:pb.sysId};}
  // 3-1b) 조사 진행 중
  if(S.probe) return {tag:"조사",cls:"",msg:"<b>🔬 "+sysById(S.probe.id).name+"</b> 조사 중 — "+S.probe.left+"일 남았습니다. 끝나면 지질 특성과 구역 슬롯이 밝혀집니다.",target:S.probe.id};
  // 3-2) 조사하지 않은 이상 현상
  {const ap=anomPending().filter(sy=>S.res.alloy>=anomCost(sy));
   if(ap.length){ const sy=ap[0], a=anomalyOf(sy);
     return {tag:"발견",cls:"",msg:`<b>${sy.name}</b>에서 <b>${a.ic} ${a.name}</b>이(가) 감지됐습니다 — 조사해 보상을 받으세요.`,target:sy.id,sel:sy.id};}}
  // 4) 스캔 가능한 별
  const sc=scannable();
  if(sc) return {tag:"탐험",cls:"",msg:"반짝이는 <b>"+sc.name+"</b>을 <b>스캔</b>해 행성을 찾으세요. (철괴 "+scanCost(sc)+")",target:sc.id,sel:sc.id};
  // 5) 항행 업그레이드로 잠금 해제
  if(!S.ractive){ const cand=(S.rcards||[]).filter(techOpen);
   if(cand.length){ const k=cand[0];
     return {tag:"연구",cls:"",msg:`진행 중인 연구가 없습니다 — 상단 <b style="color:var(--amber-2)">⚛ 기술</b>에서 <b>${TECHS[k].icon} ${TECHS[k].name}</b> 등을 시작하세요.`,target:null,tech:true};}}
  // 6) 기본
  return {tag:"목표",cls:"done",msg:"식민지를 키우며 자원을 모으세요. 목표: <b>거주 가능 행성(초록) "+GOAL_PRIME+"곳</b> 개척.",target:null};
}
function firstColonySys(){for(const key in S.colonies){return key.split("|")[0];}return null;}
function labCount(){let n=0;for(const key in S.colonies)n+=(S.colonies[key].districts.lab||0);return n;}
function researcherCount(){let n=0;for(const key in S.colonies)n+=colonyInfo(key).employed.researcher;return n;}
const admRes = () => adminResearchCost()*SEC_PER_MONTH;          // 행정 부담(연구) 월 환산
/* 보관 한도에 붙었는데도 순생산이 양수인 자원 — 그만큼은 매달 버려진다 */
const SPEND_TIP={
  minerals:"<b>연구를 시작</b>하거나 구역을 지어 쓰세요.",
  energy:"구역을 짓거나 <b>항성계를 스캔</b>해 쓰세요.",
  goods:"<b>거주 구역</b>을 지어 인구를 늘리면 소비가 따라 늘어납니다.",
  alloy:"<b>행성 조사</b>·스캔·식민지 건설에 쓰세요.",
};
function wastedRes(r){
  const cap=storageCap();
  for(const k of ["minerals","energy","goods","alloy"]){
    const per=r[k]*SEC_PER_MONTH;
    if(S.res[k]>=cap-0.5 && per>=0.5) return {k,cap,per,how:SPEND_TIP[k]};
  }
  return null;
}
function lowHappiness(){let w=null;for(const key in S.colonies){const info=colonyInfo(key);if(info.happiness<35&&(!w||info.happiness<w.h))w={sysId:key.split("|")[0],pname:info.p.n,h:info.happiness};}return w;}
function firstUnemployed(){
  for(const key in S.colonies){const info=colonyInfo(key);
    if(info.unemployed>0 && info.used<info.slots) return {sysId:key.split("|")[0],pname:info.p.n,n:info.unemployed};}
  return null;
}
function colonizable(){
  for(const s of SYSTEMS){ if(!isSurveyed(s.id))continue;
    for(let i=0;i<s.planets.length;i++){const p=s.planets[i];
      if(p.home||S.colonies[colKey(s.id,i)])continue;
      if(slotsOf(p)>=7 && isProbed(s.id) && canAfford(colonizeCost(s,p))) return {sysId:s.id,pname:p.n,tier:tierOf(p.esi)};}}
  return null;
}
/* 스캔은 끝났지만 아직 조사하지 않은 거주 후보 — 식민지 앞 단계 */
function probable(){
  if(S.probe) return null;
  for(const s of SYSTEMS){ if(!isSurveyed(s.id)||isProbed(s.id))continue;
    for(let i=0;i<s.planets.length;i++){const p=s.planets[i];
      if(p.home)continue;
      if(p.esi>=0.5 && S.res.alloy>=probeCost(s)) return {sysId:s.id,pname:p.n,cost:probeCost(s)};}}
  return null;
}
function scannable(){
  let best=null;
  for(const s of SYSTEMS){ if(isSurveyed(s.id)||!inReach(s))continue;
    if(S.res.alloy>=scanCost(s) && (!best||s.dist<best.dist)) best=s; }
  return best;
}
/* 코치는 매번 항성계 300개·행성 423개를 훑는다(식민 후보·조사 후보·스캔 대상·이상 현상).
   초당 4번 그걸 반복하면 25 식민지에서 17ms씩 든다 — 상황이 바뀌지 않았으면 결과를 재사용한다. */
let _coachSig="", _coachRes=null;
function coachSig(){
  if(!S) return "";
  const e=evState();
  return [Math.round(S.res.alloy), Math.round(S.res.minerals), Math.round(S.res.energy),
    Object.keys(S.colonies).length, Object.keys(S.surveyed).length, Object.keys(S.probed||{}).length,
    S.brownout?1:0, S.probe?S.probe.id:"-", S.ractive||"-", S.lastMK,
    e.crisis?1:0, e.sit?e.sit.id:"-", e.chain?e.chain.stage:-1,
    depletedList().join(","), Object.keys(S.tech||{}).length, Object.keys(S.anom||{}).length].join("|");
}
function nextStep(){
  const sig=coachSig();
  if(sig===_coachSig && _coachRes) return _coachRes;
  _coachSig=sig; _coachRes=computeNext(); return _coachRes;
}
function renderCoach(){
  const n=nextStep(); recTarget=n.target;
  const go = (n.sel||n.tech) ? `<button class="go" id="coachGo">${n.tech?"열기 →":"이동 →"}</button>` : "";
  $("coach").className="coach "+(n.cls||"");
  $("coach").innerHTML=`<span class="tgt">🎯 ${n.tag}</span><span class="msg">${n.msg}</span>${go}`;
  const gb=$("coachGo"); if(gb)gb.onclick=()=>{ if(n.tech){openEmpire();return;} const ap=document.querySelector(".app");ap.classList.remove("panel-closed");ap.classList.remove("sheet-peek");selSys=n.sel; renderPanel(); updateNodes();};
  updateNodes();
}

/* ============ 렌더: 상단 ============ */
const RES_META=[
  {k:"energy",lbl:"에너지",ic:"⚡",tip:"건물 가동과 건설에 쓰는 기본 에너지. 발전 구역(기술자)에서 생산."},

/* ============ 자원 툴팁 (생산/소비 내역) ============ */
const RES_LABEL={energy:"에너지",minerals:"광물",goods:"소비재",research:"연구",alloy:"철괴"};
function showResTip(k,pill){
  const B=breakdown()[k], net=totalRates()[k]*SEC_PER_MONTH, MM=SEC_PER_MONTH;
  const pT=Object.values(B.prod).reduce((a,b)=>a+b,0), cT=Object.values(B.cons).reduce((a,b)=>a+b,0);
  const cap=storageCap(), pc=clamp(S.res[k]/cap*100,0,100);
  let html=`<div class="rt-h"><span>${rIco(k,16)} ${RES_LABEL[k]}</span><span class="rt-net ${net>=0?'p':'n'}">${net>=0?'+':''}${net.toFixed(1)}/월</span></div>`;
  html+=`<div class="rt-cap"><div class="rt-capbar"><i style="width:${pc}%" class="${pc>=99.9?'full':pc>=90?'near':''}"></i></div>
    <span class="mono">보관 ${fmt(S.res[k])} / ${fmt(cap)}</span></div>`;
  html+=`<div class="rt-cat p">총 생산 +${(pT*MM).toFixed(1)} /월</div>`;
  const pe=Object.entries(B.prod).sort((a,b)=>b[1]-a[1]);
  html+= pe.length? pe.map(([c,v])=>`<div class="rt-row"><span>${c}</span><span class="p">+${(v*MM).toFixed(1)}</span></div>`).join("") : `<div class="rt-row rt-none">생산원 없음</div>`;
  html+=`<div class="rt-cat n">총 소비 −${(cT*MM).toFixed(1)} /월</div>`;
  const ce=Object.entries(B.cons).sort((a,b)=>b[1]-a[1]);
  html+= ce.length? ce.map(([c,v])=>`<div class="rt-row"><span>${c}</span><span class="n">−${(v*MM).toFixed(1)}</span></div>`).join("") : `<div class="rt-row rt-none">소비 없음</div>`;
  html+=`<div class="rt-foot">보유 ${fmt(S.res[k])}</div>`;
  const tip=$("restip"); tip.innerHTML=html; tip.classList.add('on');
  const rect=pill.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(rect.left, window.innerWidth-tip.offsetWidth-12))+"px";
  tip.style.top=(rect.bottom+8)+"px";
}
function hideResTip(){const t=$("restip");if(t){t.classList.remove('on');t.dataset.owner="";}}

/* ============ 통합 툴팁 ============
   예전에는 자원 칩만 이 패널을 썼고 나머지는 브라우저 기본 title 이라
   ①모양이 제각각이고 ②터치 기기에서는 아예 뜨지 않았다.
   이제 data-tip 이 붙은 모든 요소가 같은 패널로 뜬다.
   문법: "머리말 — 본문 · 본문2"  (— 가 없으면 첫 · 조각이 머리말) */
function tipMarkup(raw){
  let head="", rest=raw;
  const i=raw.indexOf(" — ");
  if(i>0){ head=raw.slice(0,i); rest=raw.slice(i+3); }
  let parts=rest.split(" · ").map(x=>x.trim()).filter(Boolean);
  if(!head){ if(parts.length>1) head=parts.shift(); else { head=parts[0]||raw; parts=[]; } }
  let h=`<div class="rt-h"><span>${head}</span></div>`;
  h+=parts.map(t=>{
    const m=t.match(/^(\S+)\s+(.+)$/);
    const cls=v=>/[−-]\s*\d/.test(v)?"b":/\+\s*\d|✓/.test(v)?"g":"";
    if(m && m[1].length<=8 && t.length<38)
      return `<div class="rt-line"><span>${m[1]}</span><span class="${cls(m[2])}">${m[2]}</span></div>`;
    return `<div class="rt-line solo">${t}</div>`;
  }).join("");
  return h;
}
function placeTip(el){
  const tip=$("restip"); if(!tip)return;
  tip.classList.add("on");
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let left=Math.max(8, Math.min(r.left, window.innerWidth-w-8));
  let top=r.bottom+8;
  if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-8);
  tip.style.left=left+"px"; tip.style.top=top+"px";
}
function showTip(el){
  if(!el)return;
  if(el.dataset.res){ showResTip(el.dataset.res, el); $("restip").dataset.owner=el.dataset.res; return; }
  const raw=el.getAttribute("data-tip"); if(!raw)return;
  const tip=$("restip"); tip.innerHTML=tipMarkup(raw); tip.dataset.owner=raw;
  placeTip(el);
}
/* 마우스: 올리면 뜸 / 터치: 길게 눌러야 뜸(짧게 누르면 원래 동작)
   단, 버튼이 아닌 정보 표시용 요소는 터치에서도 한 번 탭하면 뜬다. */
const TIP_ACTIVE="button,a,[data-build],[data-demo],[data-cancel],[data-probe],[data-pol],[data-col],[data-anom],[data-start],[data-mega],[data-s],#scanBtn";
function initTips(){
  let holdT=null, held=false, anchor=null, lastTouch=0;
  const canHover=()=>window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  // 터치 직후 브라우저가 합성해 보내는 마우스 이벤트를 무시한다.
  // (미디어쿼리만 믿으면 터치 지원 노트북·에뮬레이터에서 툴팁이 잘못 뜬다)
  document.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch") lastTouch=Date.now(); },{capture:true,passive:true});
  document.addEventListener("touchstart",()=>{ lastTouch=Date.now(); },{capture:true,passive:true});
  document.addEventListener("pointerover",e=>{
    if(e.pointerType==="touch"||!canHover())return;
    if(Date.now()-lastTouch<900) return;              // 방금 손가락으로 눌렀다면 호버 아님
    const el=e.target.closest("[data-tip]");
    if(el){ anchor=el; showTip(el); }
    else if(!e.target.closest("#restip")){ anchor=null; hideResTip(); }
  });
  let sx0=0, sy0=0, moved=false;
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch"){ return; }
    const el=e.target.closest("[data-tip]");
    hideResTip();                       // 새로 누르면 열려 있던 툴팁은 먼저 닫는다
    held=false; moved=false; sx0=e.clientX; sy0=e.clientY;
    if(!el) return;
    anchor=el;
    clearTimeout(holdT);
    // 정보 요소든 버튼이든 '길게 누르기'로 통일한다.
    // 짧은 탭에서 툴팁이 떠 버리면 그 다음 클릭이 억제되어 버튼이 먹통이 된다.
    holdT=setTimeout(()=>{ if(!moved){ held=true; showTip(el); } }, 500);
  },{passive:true});
  // 손가락이 움직이면(=스크롤) 길게 누르기를 취소한다. 이게 없으면 스크롤할 때마다
  // 툴팁이 뜨고, 뒤따르는 클릭이 막혀 화면이 먹통처럼 느껴진다.
  document.addEventListener("pointermove",e=>{
    if(e.pointerType!=="touch"||moved)return;
    if(Math.abs(e.clientX-sx0)>8||Math.abs(e.clientY-sy0)>8){
      moved=true; clearTimeout(holdT); if(!held) hideResTip(); }
  },{passive:true});
  document.addEventListener("pointerup",()=>{ clearTimeout(holdT); },{passive:true});
  document.addEventListener("pointercancel",()=>{clearTimeout(holdT);held=false;hideResTip();},{passive:true});
  document.addEventListener("click",e=>{
    if(held){ held=false; e.preventDefault(); e.stopPropagation(); return; }   // 길게 눌러 툴팁을 띄운 경우에만
    if(moved){ moved=false; return; }                                          // 스크롤 제스처였다면 아무것도 하지 않음
    const el=e.target.closest("[data-tip]");
    if(!el){ if(!e.target.closest("#restip")) hideResTip(); return; }
    // 정보 표시용 요소는 클릭으로도 열린다 (호버가 없는 기기 대비)
    if(!el.closest(TIP_ACTIVE)){
      const tip=$("restip"), same=tip&&tip.classList.contains("on")&&anchor===el;
      if(same) hideResTip(); else { anchor=el; showTip(el); }
    }
  },true);
  // 패널을 스크롤해도 툴팁이 사라지지 않고 대상을 따라간다 (화면 밖으로 나가면 닫힘)
  window.addEventListener("scroll",()=>{
    const tip=$("restip"); if(!tip||!tip.classList.contains("on"))return;
    if(!anchor||!anchor.isConnected){ hideResTip(); return; }
    const r=anchor.getBoundingClientRect();
    if(r.bottom<0||r.top>window.innerHeight){ hideResTip(); return; }
    placeTip(anchor);
  },true);
  window.addEventListener("resize",hideResTip);
  // 키보드 접근성
  // 키보드 이동(Tab)일 때만 — 터치로 버튼을 누르면 포커스가 들어와 툴팁이 잘못 떴다
  document.addEventListener("focusin",e=>{
    const el=e.target.closest("[data-tip]"); if(!el)return;
    if(Date.now()-lastTouch<900)return;
    try{ if(!el.matches(":focus-visible"))return; }catch(_){ return; }
    anchor=el; showTip(el);
  });
  document.addEventListener("focusout",hideResTip);
}

/* ============ 렌더: 지도 ============ */
let maxR=0;
const Rof=d=>d<=0?0:(40+Math.log(d+1)*120);   // 로그 스케일 (0~25000ly 압축)
/* 정상나선은하(Sa) 배치: 반지름=실제 거리(로그), 각도=촘촘히 감긴 2개 나선 팔 + 큰 팽대부 */
/* 팔을 넓게 벌리고 반지름 산포도 키운다 — 좁은 팔에 300개를 밀어넣으면
   점들이 사슬처럼 다닥다닥 붙어 어지럽다. 넓힐수록 같은 개수가 헐겁게 퍼진다. */
/* 지도 평면 배율. 여기를 키워봐야 자동 배율이 그만큼 당겨서 화면은 똑같아진다 —
   화면이 넓어 보이게 하는 진짜 레버는 '한 화면에 몇 개를 보여주냐'(NODE_BUDGET)다. */
const MAP_SPAN=1;
const GAL={ARMS:2, WIND:50, ARMW:44, BULGE:0.11};   // WIND°/ln (감김), 팔 폭°, 팽대부 반경(정규)
const frac=x=>x-Math.floor(x);
function galPos(sys,i){
  if(sys.dist<=0) return {x:50,y:50};
  const h1=frac(Math.sin(i*12.9898)*43758.5453), h2=frac(Math.sin(i*78.233)*12543.14), h3=frac(Math.sin(i*4.271)*2917.3);
  let nr=(Rof(sys.dist)/maxR)*45*MAP_SPAN;              // 정규 반지름 (%)
  let deg;
  if(nr < GAL.BULGE*45*MAP_SPAN){                       // 팽대부: 둥근 성단 구름
    deg=h1*360; nr*=(0.35+h2*0.9);
  }else{
    const arm=i%GAL.ARMS;
    deg=arm*(360/GAL.ARMS) + GAL.WIND*Math.log(sys.dist+1) + (h1-0.5)*GAL.ARMW*(1.1-nr/(60*MAP_SPAN)) + (h3-0.5)*10;
    nr*=(0.90+h2*0.18);                                 // 팔 두께·산포
  }
  const a=deg*Math.PI/180;
  return {x:50+nr*Math.cos(a), y:50+nr*Math.sin(a)};
}
/* 배치 완화 — 세 가지 힘을 같이 돌린다.
   ① 밀어내기: 별끼리 최소 간격(MIN)을 지켜 다닥다닥 붙지 않게
   ② 당기기(스프링): 항로로 이어진 별끼리는 가깝게 — 이게 없으면 선이 화면을 가로질러 엇갈린다
   ③ 반지름 앵커: 나선 팔 모양(거리→반지름)이 무너지지 않게 원래 궤도로 조금씩 되돌림 */
function relaxPositions(){
  const cx=50, cy=50, MIN=8.6, ITER=260, RMAX=49*MAP_SPAN, ANCHOR=0.05;
  const LINK=12.5*MAP_SPAN, SPRING=0.10;  // 이어진 별끼리의 목표 간격과 당기는 세기 (MIN 보다 커야 서로 안 싸운다)
  const arr=[], idx={};
  SYSTEMS.forEach((s,i)=>{ if(s.dist<=0) return; const p=POS[s.id];
    idx[s.id]=arr.length;
    arr.push({id:s.id, x:p.x, y:p.y, r0:Math.hypot(p.x-cx,p.y-cy)}); });
  const N=arr.length;
  const links=(LANES||[]).map(([a,b])=>[idx[a],idx[b]]).filter(([a,b])=>a!==undefined&&b!==undefined);
  for(let it=0; it<ITER; it++){
    for(let a=0;a<N;a++) for(let b=a+1;b<N;b++){
      let dx=arr[b].x-arr[a].x, dy=arr[b].y-arr[a].y;
      let d=Math.hypot(dx,dy)||0.001;
      if(d<MIN){ const f=(MIN-d)*0.5; dx/=d; dy/=d;
        arr[a].x-=dx*f; arr[a].y-=dy*f; arr[b].x+=dx*f; arr[b].y+=dy*f; }
    }
    for(const [a,b] of links){
      let dx=arr[b].x-arr[a].x, dy=arr[b].y-arr[a].y;
      const d=Math.hypot(dx,dy)||0.001;
      if(d>LINK){ const f=(d-LINK)*SPRING; dx/=d; dy/=d;
        arr[a].x+=dx*f; arr[a].y+=dy*f; arr[b].x-=dx*f; arr[b].y-=dy*f; }
    }
    for(let a=0;a<N;a++){ let dx=arr[a].x-cx, dy=arr[a].y-cy; let r=Math.hypot(dx,dy)||0.001;
      let rt=r+(arr[a].r0-r)*ANCHOR; if(rt>RMAX)rt=RMAX;
      arr[a].x=cx+dx/r*rt; arr[a].y=cy+dy/r*rt; }
  }
  arr.forEach(a=>{ POS[a.id]={x:a.x, y:a.y}; });
}
/* ============ 하이퍼레인 (항성간 이동 경로) ============
   화면 좌표(POS)는 로그로 압축돼 있어서 '보기 좋은 그림'일 뿐, 실제 거리와 다르다.
   항로를 그 위에서 만들면 옆에 붙어 보이는 별이 실제로는 200ly 떨어져 있을 수 있다.
   그래서 항로는 실제 거리 좌표(TPOS: 반지름 = 실제 ly)에서 만들고, 화면에만 압축해서 그린다.
   - 별 하나가 갖는 항로는 1~3개 (MAX_DEG)
   - 항로 길이는 ly 로 기록해 두고, 항행 사거리보다 짧아야 그 구간을 건널 수 있다 */
let POS={}, TPOS={}, LANES=[], LANELEN={}, ADJ={};
const MAX_DEG=3;
const lk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
const laneLen=(a,b)=>{const v=LANELEN[lk(a,b)];return v===undefined?Infinity:v;};
function buildTruePos(){
  TPOS={};
  SYSTEMS.forEach((sys,i)=>{
    if(sys.dist<=0){ TPOS[sys.id]={x:0,y:0}; return; }
    const h1=frac(Math.sin(i*12.9898)*43758.5453), h3=frac(Math.sin(i*4.271)*2917.3);
    const nr=(Rof(sys.dist)/maxR)*45*MAP_SPAN;
    let deg;
    if(nr < GAL.BULGE*45*MAP_SPAN) deg=h1*360;
    else { const arm=i%GAL.ARMS;
      deg=arm*(360/GAL.ARMS)+GAL.WIND*Math.log(sys.dist+1)+(h1-0.5)*GAL.ARMW*(1.1-nr/(60*MAP_SPAN))+(h3-0.5)*10; }
    const a=deg*Math.PI/180;
    TPOS[sys.id]={x:sys.dist*Math.cos(a), y:sys.dist*Math.sin(a)};   // 태양계가 원점이므로 |TPOS| = 실제 거리
  });
}
function buildLanes(){
  SYSTEMS.forEach((s,i)=>{ POS[s.id]=galPos(s,i); });
  buildTruePos();
  /* 규칙은 하나다 — "모든 별은 자기보다 안쪽(본거지에 가까운) 별 하나에 붙는다."
     가까운 순서대로 세워두고 차례로 붙이면, 본거지에서 바깥으로 뻗는 나무가 저절로 만들어진다.
       · 항상 한 덩어리로 이어진다 (고립된 별이 생길 수 없다)
       · 길이 안쪽에서 바깥으로만 흐르니 선이 잘 엇갈리지 않는다
       · 본거지에서의 거리도 자연히 단조롭게 늘어난다 (탐사 순서가 꼬이지 않는다)
     여기에 같은 구역 안에서 짧은 옆길을 조금만 더 붙여 갈림길을 만든다. */
  const order=SYSTEMS.slice().sort((a,b)=>a.dist-b.dist);   // [0] = 태양계
  const deg={}, used=new Set();
  LANES=[]; LANELEN={};
  const dsp=(a,b)=>Math.hypot(POS[a.id].x-POS[b.id].x, POS[a.id].y-POS[b.id].y);
  const ly =(a,b)=>Math.hypot(TPOS[a.id].x-TPOS[b.id].x, TPOS[a.id].y-TPOS[b.id].y);
  const add=(a,b)=>{ const k=lk(a.id,b.id); if(used.has(k)) return; used.add(k);
    LANES.push([a.id,b.id]); LANELEN[k]=Math.round(ly(a,b)*10)/10;
    deg[a.id]=(deg[a.id]||0)+1; deg[b.id]=(deg[b.id]||0)+1; };
  /* 1) 뼈대 — 안쪽 별에 하나씩 붙인다 */
  for(let k=1;k<order.length;k++){
    const s2=order[k];
    let best=null, bd=Infinity, fallback=null, fd=Infinity;
    for(let m=0;m<k;m++){ const t=order[m], d=dsp(s2,t);
      if(d<fd){ fd=d; fallback=t; }
      if((deg[t.id]||0)>=MAX_DEG) continue;                 // 이미 3갈래면 더 못 받는다
      if(d<bd){ bd=d; best=t; } }
    add(s2, best||fallback);                                // 안쪽이 다 찼으면 가장 가까운 곳에 붙인다
  }
  /* 2) 옆길 — 화면에서 붙어 있고 양쪽 다 자리가 남은 별끼리, 짧은 것부터 별 수의 15%만 */
  const side=[];
  for(let i=0;i<order.length;i++) for(let j=i+1;j<order.length;j++){
    const d=dsp(order[i],order[j]); if(d<=7*MAP_SPAN) side.push([d,i,j]); }
  side.sort((a,b)=>a[0]-b[0]);
  let extra=Math.round(order.length*0.15);
  for(const [,i,j] of side){ if(extra<=0) break;
    const a=order[i], b=order[j];
    if((deg[a.id]||0)>=MAX_DEG || (deg[b.id]||0)>=MAX_DEG) continue;
    if(used.has(lk(a.id,b.id))) continue;
    add(a,b); extra--;
  }
  ADJ={}; LANES.forEach(([a,b])=>{ (ADJ[a]=ADJ[a]||[]).push(b); (ADJ[b]=ADJ[b]||[]).push(a); });
  relaxPositions();     // 항로를 만든 뒤에 배치를 푼다 — 이어진 별끼리 당겨서 선을 짧게
}
/* 항로가 곧 길이다 — 전부 그리되, 상태로 밝기를 나눈다.
   - live    : 양쪽 다 탐사함 (보급선이 실제로 흐르는 길)
   - open    : 한쪽만 탐사했고, 그 구간이 항행 사거리 안 → 지금 갈 수 있는 길 (앰버)
   - far     : 한쪽만 탐사했지만 구간이 너무 길다 → 기술이 필요한 길
   - unknown : 양쪽 다 모름 (은하의 뼈대만 희미하게) */
function renderLanes(){
  const svg=$("lanes"); if(!svg)return;
  const out=[], TL=tierLy();
  for(const [a,b] of LANES){
    const pa=POS[a], pb=POS[b]; if(!pa||!pb) continue;
    if(sysById(a).dist>TL || sysById(b).dist>TL) continue;   // 감춘 별로 가는 길은 그리지 않는다
    const sa=isSurveyed(a), sb=isSurveyed(b);
    let cls;
    if(sa&&sb) cls="live";
    else if(sa||sb) cls=inReach(sysById(sa?b:a))?"open":"far";
    else cls="unknown";
    out.push(`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" class="${cls}"/>`);
  }
  svg.innerHTML=out.join("");
}
function initMap(){
  const map=$("map");map.innerHTML="";
  maxR=Math.max.apply(null,SYSTEMS.map(s=>Rof(s.dist)));
  buildLanes();
  SYSTEMS.forEach((sys,i)=>{
    const p=POS[sys.id];
    const b=document.createElement("button");b.className="node";b.dataset.id=sys.id;
    b.style.left=p.x+"%";b.style.top=p.y+"%";
    b.innerHTML=`<span class="tip"></span><span class="star"></span><span class="pdisc"></span><span class="amark"></span><span class="nm">${sys.name}</span><span class="dist">${sys.dist===0?"본거지":sys.dist+" ly"}</span>`;
    /* 노드 개별 click 은 붙이지 않는다 — 지도 전체에서 '가장 가까운 별'로 처리한다.
       (겹친 별 위에서 브라우저 기본 판정을 쓰면 어느 별이 잡힐지 예측할 수 없다) */
    b.style.pointerEvents="none";
    map.appendChild(b);
  });
  computeSupply(); renderLanes(); updateReach(); _nodeSig=""; updateNodes(true);
}
/* 사거리 원은 없앴다 — 이제 '원 안이면 어디든'이 아니라 '항로로만' 가기 때문에
   원은 실제 갈 수 있는 곳과 아무 상관이 없다. 갈 수 있는 길은 앰버색 항로로 표시된다. */
function updateReach(){
  const el=$("reach"); if(el) el.style.display="none";
  const lbl=$("reachLbl"); if(lbl) lbl.style.display="none";
}
/* 지도 노드 300개를 초당 4번 전부 다시 칠하면 25 식민지에서 12ms 씩 든다.
   노드 상태를 바꾸는 것(탐사·식민지·철괴·사거리·추천 대상·선택)이 그대로면 건너뛴다. */
let _nodeSig="";
function nodeSig(){
  return [Object.keys(S.surveyed).length, Object.keys(S.colonies).length,
    Math.round(S.res.alloy), maxReach(), recTarget||"-", selSys||"-",
    chainTarget()||"-", Object.keys(S.anom||{}).length].join("|");
}
function updateNodes(force){
  const sig=nodeSig();
  if(!force && sig===_nodeSig) return;
  _nodeSig=sig;
  document.querySelectorAll(".node").forEach(n=>{
    const sys=sysById(n.dataset.id),surveyed=isSurveyed(sys.id);
    const colonized=sys.planets.some((p,i)=>S.colonies[colKey(sys.id,i)]);
    const scannable=!surveyed&&inReach(sys)&&S.res.alloy>=scanCost(sys);
    const hasprime=surveyed&&sys.planets.some(p=>p.esi>=0.8);
    const anomaly=surveyed&&!!anomalyOf(sys)&&!anomDone(sys.id);
    const clue=chainTarget()===sys.id;
    const home=sys.id==="sol",locked=!surveyed&&!inReach(sys),rec=recTarget===sys.id;
    const outOfTier = sys.dist>tierLy();          // 지금 시야 단계보다 먼 별은 감춘다
    n.className="node"+(outOfTier?" offtier":"")+(surveyed?" surveyed":"")+(colonized?" colonized":"")+(scannable?" scannable":"")+(hasprime?" hasprime":"")+(home?" home":"")+(locked?" locked":"")+(rec?" rec":"")+(anomaly?" anomaly":"")+(clue?" clue":"")+(selSys===sys.id?" sel":"");
    const tip=n.querySelector(".tip");
    /* 항상 떠 있는 말풍선은 '아이콘만'으로 줄인다 — 이상 현상은 항성계 1/3에 있어서
       "❓ 이상 현상" 글자가 다 뜨면 별 이름을 전부 덮어버린다. 전체 문구는 눌렀을 때 패널에서 본다.
       식민지는 노란 점 + 개수 배지로 이미 알 수 있으므로 말풍선을 없앤다. */
    /* 말풍선은 '지금 할 수 있는 일'에만 쓴다. 이상 현상·단서는 별 위에 작은 표식으로 얹는다 —
       가로로 긴 알약이 확대할 때마다 화면을 가리기 때문이다. 멀리 축소하면 표식도 사라진다. */
    tip.textContent = scannable?"◎ 스캔 가능" : locked?"항로 미개통" : "";
    tip.classList.remove("mini");
    const mk=n.querySelector(".amark");
    if(mk) mk.textContent = clue?"🗿" : anomaly?"❓" : "";
    /* 스캔한 항성계만 얼굴을 보여준다 — 스캔 전에는 뭐가 있는지 모르는 게 맞다.
       한 번 만든 그림은 그대로 둔다(매번 다시 그리면 지도가 무거워진다). */
    const disc=n.querySelector(".pdisc");
    if(disc && surveyed && !disc.firstChild){ const rp=repPlanet(sys); if(rp) disc.innerHTML=planetArt(rp,27); }
    const star=n.querySelector(".star");let badge=n.querySelector(".cbadge");
    const cc=sys.planets.filter((p,i)=>S.colonies[colKey(sys.id,i)]).length;
    if(cc>0){if(!badge){badge=document.createElement("span");badge.className="cbadge";star.appendChild(badge);}badge.textContent=cc;}else if(badge)badge.remove();
  });
  layoutLabels();
}

/* 이름표 겹침 정리 —
   후반에 식민지가 25곳쯤 되면 별 이름끼리 서로 덮어써서 하나도 안 읽힌다.
   화면에서 겹치는 이름은 우선순위가 낮은 쪽을 숨긴다 (선택 > 코치 추천 > 본거지 > 식민지).
   숨긴 이름은 그 별을 누르면 바로 보이므로 정보가 사라지지는 않는다.
   DOM 좌표를 읽지 않고 지도 %좌표로만 계산하므로 비용이 거의 없다. */
let _lblZoom=0;
function layoutLabels(){
  const mw=$("mapwrap"); if(!mw) return;
  const W=mw.clientWidth||1, H=mw.clientHeight||1, z=(typeof zoom==="number"&&zoom>0)?zoom:1;
  _lblZoom=z;
  const px=v=>(v/(W*z))*100, py=v=>(v/(H*z))*100;   // 화면 px → 지도 %
  /* 막는 것들: 별 점 자체, 항상 떠 있는 말풍선, 그리고 화면 위에 얹힌 UI(줌 버튼·시야 칩) */
  const artView=mw.classList.contains("artview");
  const block=[], cand=[];
  {
    const mwr=mw.getBoundingClientRect();
    /* UI 는 화면 고정이라 지도 %로 바꾸려면 현재 이동(panX/panY)과 배율을 되돌려야 한다 */
    const toMapX=sx=>50+((sx-(mwr.left+mwr.width/2))-panX)/(W*z)*100;
    const toMapY=sy=>50+((sy-(mwr.top+mwr.height/2))-panY)/(H*z)*100;
    document.querySelectorAll(".zoomctl,.tierchip,.legend").forEach(u=>{
      const r=u.getBoundingClientRect(); if(!r.width) return;
      block.push({x1:toMapX(r.left-6), x2:toMapX(r.right+6), y1:toMapY(r.top-4), y2:toMapY(r.bottom+4)});
    });
  }
  document.querySelectorAll(".node").forEach(n=>{
    const p=POS[n.dataset.id]; if(!p) return;
    const c=n.classList;
    if(c.contains("offtier")) return;
    /* 근거리 단계에서는 별이 32px 원반이라 막는 넓이도 그만큼 커진다 */
    const rr=artView?17:11;
    block.push({x1:p.x-px(rr), x2:p.x+px(rr), y1:p.y-py(rr), y2:p.y+py(rr), self:n});
    const tip=n.querySelector(".tip");
    if(tip && tip.textContent){
      const w=tip.classList.contains("mini")?10:46;
      /* self 를 달지 않는다 — 자기 말풍선도 자기 이름표를 막아야 한다 (위쪽에 이름을 달면 겹친다) */
      block.push({x1:p.x-px(w), x2:p.x+px(w), y1:p.y-py(30), y2:p.y-py(11)});
    }
    if(c.contains("home")||c.contains("colonized")||c.contains("sel")||c.contains("rec"))
      cand.push({n, x:p.x, y:p.y, pri: c.contains("sel")?0 : c.contains("rec")?1 : c.contains("home")?2 : 3});
    else c.remove("nolabel");
  });
  cand.sort((a,b)=>a.pri-b.pri);
  const hits=(b,x1,x2,y1,y2)=>!(x2<b.x1||x1>b.x2||y2<b.y1||y1>b.y2);
  const taken=[];
  const free=(x1,x2,y1,y2,self)=>{
    for(const t of taken) if(hits(t,x1,x2,y1,y2)) return false;
    for(const b of block) if(b.self!==self && hits(b,x1,x2,y1,y2)) return false;
    return true;
  };
  for(const c of cand){
    const x1=c.x-px(62), x2=c.x+px(62);   // 실제 이름표가 100~120px 까지 나온다 — 넉넉히 잡아야 안 겹친다
    const gap=artView?19:12;
    const below=[c.y+py(gap), c.y+py(gap+14)], above=[c.y-py(gap+14), c.y-py(gap)];
    let slot=null;
    if(free(x1,x2,below[0],below[1],c.n)) slot=below;
    else if(free(x1,x2,above[0],above[1],c.n)) slot=above;   // 아래가 막히면 위쪽도 시도
    c.n.classList.toggle("lbl-up", slot===above);
    if(!slot) c.n.classList.add("nolabel");
    else { c.n.classList.remove("nolabel"); taken.push({x1,x2,y1:slot[0],y2:slot[1]}); }
  }
}


/* ============ 행성 겉모습 ============
   외계행성은 실제 사진이 없다(전부 상상도). 그림 파일을 넣으면 단일 HTML 원칙도 깨진다.
   그래서 '가진 데이터로 코드가 직접 그린다' — 장식이 아니라 데이터의 다른 표현이다.
     · 평형온도  → 색   (39K 창백한 얼음 … 2319K 작열하는 주황)
     · 유형      → 무늬 (암석·슈퍼지구=대륙 / 미니 해왕성·가스 거인=가로 줄무늬)
     · 반지름    → 원반 크기 (같은 칸 안에서 상대적으로)
     · ESI       → 대기 두께와 구름 (살 만할수록 두껍고 구름이 낀다)
   같은 행성은 언제나 같은 그림이 나오도록 이름으로 난수를 고정한다. */
const PLANET_PAL=[
  {t:160,  hi:"#eaf4ff", mid:"#b9d6ef", lo:"#5d7fa0"},   // 언 세계
  {t:245,  hi:"#dbeaf7", mid:"#9dc2de", lo:"#4d6d8c"},   // 냉대
  {t:315,  hi:"#a8e0d2", mid:"#5aa793", lo:"#245b5c"},   // 온대 — 물이 있을 만한 띠
  {t:430,  hi:"#f0dcae", mid:"#c9a468", lo:"#7d5f33"},   // 온난 건조
  {t:670,  hi:"#f3c089", mid:"#cf8348", lo:"#7e3f1e"},   // 더움
  {t:1150, hi:"#f0a07d", mid:"#c8563a", lo:"#6f1f16"},   // 매우 더움
  {t:1e9,  hi:"#ffd0a6", mid:"#ee6a3e", lo:"#8d2413"},   // 작열
];
const palOf=t=>PLANET_PAL.find(x=>t<x.t)||PLANET_PAL[PLANET_PAL.length-1];
function pHash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} 
  return ()=>{ h=Math.imul(h^(h>>>15),2246822507); h=Math.imul(h^(h>>>13),3266489909); return ((h^(h>>>16))>>>0)/4294967296; }; }
let _artN=0;
/* 그 항성계의 얼굴이 될 행성 — 지구 유사도가 가장 높은 것, 같으면 큰 것 */
function repPlanet(sys){ return sys.planets.slice().sort((a,b)=>(b.esi-a.esi)||(b.r-a.r))[0]; }
function planetArt(pl, size){
  const uid="pa"+(++_artN);
  const P=palOf(pl.temp), rnd=pHash(pl.n||"?");
  const banded=/해왕성|거인/.test(pl.t||"");
  const esi=Math.max(0, Math.min(1, pl.esi||0));
  const atmo=0.12+esi*0.45;                       // 살 만할수록 대기가 두껍다
  let inner="", cloud="";
  if(banded){                                     // 가스형 — 가로 줄무늬
    const n=3+Math.floor(rnd()*3);
    for(let i=0;i<n;i++){
      const cy=14+ (72/n)*i + rnd()*6, h=5+rnd()*9;
      inner+=`<ellipse cx="50" cy="${cy.toFixed(1)}" rx="52" ry="${(h/2).toFixed(1)}" fill="${P.lo}" opacity="${(0.18+rnd()*0.22).toFixed(2)}"/>`;
    }
    if(rnd()>0.55) inner+=`<ellipse cx="${(28+rnd()*44).toFixed(0)}" cy="${(40+rnd()*24).toFixed(0)}" rx="11" ry="6" fill="${P.hi}" opacity=".33"/>`;
  }else{                                          // 암석형 — 대륙 얼룩 + 크레이터
    const n=2+Math.floor(rnd()*3);
    for(let i=0;i<n;i++){
      const cx=20+rnd()*60, cy=20+rnd()*60, rx=9+rnd()*16, ry=7+rnd()*12;
      inner+=`<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" `
           + `fill="${P.lo}" opacity="${(0.30+rnd()*0.30).toFixed(2)}" transform="rotate(${(rnd()*90-45).toFixed(0)} ${cx.toFixed(0)} ${cy.toFixed(0)})"/>`;
    }
    for(let i=0;i<2;i++) inner+=`<circle cx="${(18+rnd()*64).toFixed(0)}" cy="${(18+rnd()*64).toFixed(0)}" r="${(2+rnd()*4).toFixed(1)}" fill="${P.hi}" opacity=".16"/>`;
  }
  if(esi>0.55){                                   // 구름 — 살 만한 곳에만
    const n=1+Math.floor(esi*3);
    for(let i=0;i<n;i++) cloud+=`<ellipse cx="${(15+rnd()*70).toFixed(0)}" cy="${(20+rnd()*60).toFixed(0)}" `
      +`rx="${(12+rnd()*16).toFixed(0)}" ry="${(2.5+rnd()*3).toFixed(1)}" fill="#fff" opacity="${(0.10+esi*0.20).toFixed(2)}" `
      +`transform="rotate(${(rnd()*30-15).toFixed(0)} 50 50)"/>`;
  }
  return `<svg class="plart" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="${uid}g" cx="34%" cy="28%" r="78%">
        <stop offset="0%" stop-color="${P.hi}"/><stop offset="58%" stop-color="${P.mid}"/><stop offset="100%" stop-color="${P.lo}"/>
      </radialGradient>
      <radialGradient id="${uid}l" cx="34%" cy="28%" r="76%">
        <stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/>
      </radialGradient>
      <clipPath id="${uid}c"><circle cx="50" cy="50" r="45"/></clipPath>
      <filter id="${uid}f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <filter id="${uid}k" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.4"/></filter>
    </defs>
    <circle cx="50" cy="50" r="49" fill="${P.mid}" opacity="${atmo.toFixed(2)}"/>
    <circle cx="50" cy="50" r="45" fill="url(#${uid}g)"/>
    <g clip-path="url(#${uid}c)"><g filter="url(#${uid}f)">${inner}</g><g filter="url(#${uid}k)">${cloud}</g></g>
    <circle cx="50" cy="50" r="45" fill="url(#${uid}l)"/>
  </svg>`;
}

/* ============ 렌더: 사이드 패널 ============ */
let lastPanelHTML="";
function renderPanel(){
  const panel=$("panel");
  if(!selSys){lastPanelHTML=""; panel.innerHTML=`<div class="empty"><div class="big">🛰️</div><b>항성계를 선택하세요</b>지도에서 별을 눌러<br>실제 행성 데이터를 확인하고<br>식민지를 건설하세요.<br><br>위쪽 <span style="color:var(--amber-2)">🎯 코치</span>가 다음 할 일을 안내합니다.</div>`;return;}
  const sys=sysById(selSys),surveyed=isSurveyed(sys.id);
  const sOpen = sysOpen[sys.id]!==undefined ? sysOpen[sys.id] : !isPhone();   // 데스크톱 기본 열림 / 폰 기본 접힘
  let h=`<div class="eyebrow">항성계 · ${sys.en}</div>`;
  h+=`<button class="sys-toggle" data-systoggle="${sys.id}"><span class="chev">${sOpen?'▾':'▸'}</span><span class="sys-head">${sys.name}</span></button>`;
  h+=`<div class="sys-sub">${sys.en} · ${sys.star}형 항성${sOpen?'':' · '+(surveyed?sys.planets.length+'개 행성':'미탐사')}</div>`;
  if(sOpen) h+=`<div class="kv">
    <span class="k">지구로부터</span><span class="v">${sys.dist===0?"본거지":sys.dist+" 광년"}</span>
    <span class="k" data-tip="항성 종류. 밝을수록 태양광 에너지가 강함(계수↑).">분광형</span><span class="v">${sys.star}</span>
    <span class="k">행성 수</span><span class="v">${surveyed?sys.planets.length+"개":"미확인"}</span>
    <span class="k" data-tip="이 별의 태양광 에너지 계수. 발전 구역 생산량에 곱해짐.">에너지 계수</span><span class="v">×${STAR_FACTOR(sys.star).toFixed(2)}</span>
  </div>`;

  {const a=anomalyOf(sys);
   if(a&&surveyed){
     const done=anomDone(sys.id), c=anomCost(sys), ok=!done&&S.res.alloy>=c;
     h+=`<div class="anom ${done?'done':''}">
       <div class="an-h"><span class="an-i">${a.ic}</span><span class="an-n">${a.name}</span>${done?'<span class="an-d">조사 완료</span>':''}</div>
       <div class="an-t">${done?a.desc:'조사하면 무언가를 얻을 수 있습니다.'}</div>
       ${done?'':`<button class="act ${ok?'solid':''}" data-anom="${sys.id}" ${ok?'':'disabled'}>🔬 조사 · 철괴 ${c}</button>
         ${ok?'':'<div class="cost bad">철괴가 부족합니다</div>'}`}
     </div>`;
   }}
  if(!surveyed){
    const c=scanCost(sys),reach=inReach(sys),fuelOk=S.res.alloy>=c,can=reach&&fuelOk;
    h+=`<div class="empty" style="padding:14px 8px"><b>미탐사 항성계</b>스캔하면 실제 행성 데이터가 드러납니다.</div>`;
    // 스캔 조건 2가지: ①항로 ②철괴
    const li=laneIn(sys), nbNames=(ADJ[sys.id]||[]).map(id=>sysById(id).name);
    const roadTxt = li ? (li.road!==undefined ? `본거지에서 항로 ${li.road}ly (사거리 ${reachStr()}) ✓`
                                              : `본거지에서 항로 ${reachStr()} 초과 ✕`)
                       : `이어진 항로 끝이 아직 미탐사 ✕`;
    h+=`<div class="scan-req">
      <div class="req ${reach?'ok':'no'}"><span>①항로</span><b>${li?sysById(li.from).name+' → '+li.len+'ly':'연결 없음'}</b><span class="s">${roadTxt}</span></div>
      <div class="req ${fuelOk?'ok':'no'}"><span>②철괴</span><b>${c} 필요</b><span class="s">보유 ${fmt(S.res.alloy)} ${fuelOk?'✓':'✕'}</span></div>
    </div>`;
    h+=`<button class="act ${can?'solid':''}" id="scanBtn" ${can?'':'disabled'}>◎ 항성계 스캔 (철괴 ${c})</button>`;
    h+=`<div class="cost">직선 거리 ${sys.dist}ly · 이어진 항로 ${nbNames.length}개 (${nbNames.join(", ")})</div>`;
    if(!reach) h+=`<div class="cost bad" style="margin-top:12px">아직 항로가 닿지 않습니다 — 이동은 <b>항로</b>를 따라서만 할 수 있습니다. 앞쪽 항성계를 먼저 스캔하거나, <b>기술</b> 화면에서 <b>추진·항법</b> 계열을 연구해 항행 사거리를 늘리세요. (현재 ${reachStr()})</div>`;
    /* 미탐사 항성계는 여기서 끝난다 — 이 출구에서도 lastPanelHTML 을 반드시 갱신해야 한다.
       빠뜨리면 '마지막으로 그린 화면'이 어긋나, 다음에 원래 항성계로 돌아왔을 때
       내용이 같다고 판단해 화면을 안 바꾼다(= 이전 항성계가 계속 보인다). */
    if(h!==lastPanelHTML){ lastPanelHTML=h; panel.innerHTML=h; }
    const st0=panel.querySelector("[data-systoggle]"); if(st0)st0.onclick=()=>{const k=st0.dataset.systoggle;sysOpen[k]=sysOpen[k]===false;renderPanel();};
    const sb=$("scanBtn");if(sb&&can)sb.onclick=()=>doScan(sys);
    return;
  }

  sys.planets.forEach((p,i)=>{
    const tier=tierOf(p.esi),key=colKey(sys.id,i),col=S.colonies[key];
    if(expanded[key]===undefined) expanded[key]=!!col;   // 기본: 식민지는 펼침, 나머지는 접힘
    const open=expanded[key];
    // 헤더 요약 (접힌 상태에서 한눈에)
    let summ;
    if(col){const ci=colonyInfo(key); const dcl=(ci.excess>0&&ci.happiness<30)||S.res.goods<=0.5||ci.pops>ci.hardCap;
      summ=`<span class="hsum" data-live="hsum" data-lk="${key}"></span>`;}
    else{summ=`<span class="hsum">ESI ${p.esi.toFixed(2)}</span>`;}
    h+=`<div class="planet ${tier} ${open?'open':''}">
      <button class="phead" data-toggle="${key}">
        <span class="chev">${open?'▾':'▸'}</span>
        ${planetArt(p,26)}
        <span class="pn">${p.n}</span>
        <span class="tier ${tier}">${tierName[tier]}</span>
        ${summ}
      </button>
      <span class="pinfo" data-tip="${p.n} — 유형 ${p.t} · ESI ${esiOf(sys.id,i).toFixed(2)}${terraLv(key)?' (개조 +'+(terraLv(key)*TERRA_STEP).toFixed(2)+')':''} · 반지름 ${p.r} R⊕ · 질량 ${p.m} M⊕ · 평형온도 ${p.temp}K · 구역 슬롯 ${isProbed(sys.id)?slotsOf(p)+'칸':'미조사'}">?</span>`;
    if(open){
      h+=`<div class="pbody">`;
      /* 큰 원반 — 옆에 '이 그림이 무엇으로 그려졌는지'를 그대로 적는다 */
      h+=`<div class="pview">${planetArt(p,78)}<div class="pvd">
           <div><span>유형</span><b>${p.t}</b></div>
           <div><span>반지름</span><b>${p.r} R⊕</b></div>
           <div><span>평형온도</span><b>${p.temp} K</b></div>
           <div><span>지구 유사도</span><b>ESI ${esiOf(sys.id,i).toFixed(2)}</b></div>
         </div></div>`;
      {const tr=planetTraits(p), done=isProbed(sys.id);
       // 온도는 망원경으로 보이고, 두 번째 특성과 슬롯은 조사해야 밝혀진다
       let tg=tr.tags.filter(t=>t.k==="temp"||done)
         .map(t=>`<span class="ptag${t.k!=="temp"?' dep':''}" data-tip="${t.tip}">${t.ic} ${t.t}</span>`).join("");
       if(!done) tg+=`<span class="ptag unk" data-tip="행성 조사를 마치면 지질 특성과 구역 슬롯이 밝혀집니다">❓ 미조사</span>`;
       h+=`<div class="ptags">${tg}</div>`;}
      if(col) h+=renderColony(key);
      else if(!isProbed(sys.id)){
        const pj=probeJob(), mine=pj&&pj.id===sys.id, c=probeCost(sys), ok=!pj&&S.res.alloy>=c;
        if(mine){
          h+=`<div class="probing"><div class="pb-t">🔬 조사 중</div>
            <button class="act ghost" id="probeCancel" data-tip="조사 취소 — 철괴 ${pj.cost} 전액 반환">취소</button></div>`; }
        else h+=`<button class="act ${ok?'solid':''}" data-probe="${sys.id}" ${ok?'':'disabled'}>🔬 행성 조사</button>
          <div class="cost ${S.res.alloy<c?'bad':''}">철괴 ${c} · ${Math.round(probeDaysFor()/30)}개월 소요${pj?' · 다른 곳 조사 중':''}</div>
          <div class="cost">조사를 마쳐야 식민지를 세울 수 있습니다</div>`;
      }
      else{const c=colonizeCost(sys,p),ok=canAfford(c);
        h+=`<button class="act ${ok?'solid':''}" data-col="${key}" ${ok?'':'disabled'}>＋ 식민지 건설</button><div class="cost ${ok?'':'bad'}">광물 ${c.minerals} · 에너지 ${c.energy} · 철괴 ${c.alloy}</div>`;}
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  /* 패널을 통째로 갈아끼우는 건 눈에 보이는 '툭' 이다.
     1배속에서 1초, 4배속에서 0.25초마다 일어나고 있었다.
     내용이 한 글자도 안 바뀌었으면 그냥 두고, 카운트다운만 따로 갱신한다. */
  if(h===lastPanelHTML){ tickPanelNumbers(); return; }
  lastPanelHTML=h;
  panel.innerHTML=h;
  tickPanelNumbers();                       // 자리만 남겨둔 카운트다운을 바로 채운다
  const st=panel.querySelector("[data-systoggle]"); if(st)st.onclick=()=>{const k=st.dataset.systoggle;sysOpen[k]=sysOpen[k]===false;renderPanel();};
  panel.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;expanded[k]=!expanded[k];renderPanel();});
  panel.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{const[s,pi]=b.dataset.col.split("|");doColonize(sysById(s),+pi);});
  panel.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>doBuild(b.dataset.key,b.dataset.build));
  panel.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>doDemolish(b.dataset.key,b.dataset.demo));
  bindCancel(panel);
  panel.querySelectorAll("[data-probe]").forEach(b=>b.onclick=()=>startProbe(b.dataset.probe));
  {const pc=panel.querySelector("#probeCancel"); if(pc)pc.onclick=cancelProbe;}
  panel.querySelectorAll("[data-pol]").forEach(b=>b.onclick=()=>askPolicy(b.dataset.key,b.dataset.pol,+(b.dataset.slot||1)));
  panel.querySelectorAll("[data-terra]").forEach(b=>b.onclick=()=>doTerra(b.dataset.terra));
  panel.querySelectorAll("[data-anom]").forEach(b=>b.onclick=()=>doAnomaly(b.dataset.anom));
}
/* ── 매달 바뀌는 숫자 조각들 ──────────────────────────────────
   패널 전체를 다시 그리면 눈에 보이는 '툭'이 생기므로, 이 조각들만 따로 채운다.
   renderPanel 이 만드는 HTML 에는 빈 그릇만 들어가고, 그래서 구역을 짓거나 철거하는
   등 '구조'가 바뀌지 않는 한 패널은 한 번도 다시 그려지지 않는다. */
function liveStatHTML(key){
  const info=colonyInfo(key);
  const {housing,hardCap,unemployed,pops,excess,crime,happiness}=info;
  const empN=pops-unemployed, denom=Math.max(housing,pops);
  const empPct=clamp(empN/denom*100,0,100), unPct=clamp(unemployed/denom*100,0,100);
  const grBase=POP_GROW_MIN+(POP_GROW_MAX-POP_GROW_MIN)*clamp(happiness/100,0,1);
  const foodLow=S.res.goods<=pops*0.5, gpct=clamp((info.col.growth||0)*100,0,100);
  const freeHouse=housing-pops, declining=(pops>housing)||S.res.goods<=0.5;
  const hCls=happiness>=60?'g':happiness>=35?'a':'r', cCls=crime<20?'g':crime<50?'a':'r';
  let gCls,gTxt,gTip;
  if(declining){gCls='r';gTxt='⬇ 이주';gTip='주거를 초과해 인구가 빠져나가는 중 — 거주 구역을 지으면 멈추고 다시 늘어납니다.';}
  else if(happiness<25){gCls='r';gTxt='정지';gTip='행복도 낮아 성장 정지';}
  else if(foodLow){gCls='r';gTxt='정지';gTip='소비재 부족 — 성장 정지';}
  else if(freeHouse<=0){gCls='a';gTxt='만실';gTip='주거가 가득 찼습니다(정원 100%) — 거주 구역을 지으면 인구가 더 늘어납니다.';}
  else{gCls='g';gTxt=gpct.toFixed(0)+'%';gTip='성장 중'+(happiness>=80?' · 이주 보너스':'')+' · 주거 여유 '+fmtPop(freeHouse);}
  // 총인구를 100%로 놓고 직업별로 나눈다
  const JOB_RESC={farmer:"goods",technician:"energy",miner:"minerals",researcher:"research",refiner:"alloy"};
  const segs=JOB_ORDER.filter(j=>info.employed[j]>0.0005)
    .map(j=>({j, res:JOB_RESC[j], n:info.employed[j], pct:pops>0?info.employed[j]/pops*100:0}));
  const idlePct=pops>0?clamp(unemployed/pops*100,0,100):0;
  const workPct=Math.round(100-idlePct);
  return `<div class="sr">
      <span class="si" data-tip="인구 / 주거 정원 — 정원이 차면 성장이 멈춥니다 · 구조적 한계 ${fmtPop(hardCap)}">👥 ${fmtPop(pops)}<small>/${fmtPop(housing)}</small></span>
      <span class="si c-${hCls}" data-tip="행복도 — 인구 성장 속도를 정합니다 (현재 월 ${Math.round(grBase)}명 기준, 주거 여유를 곱함). ${POP_UNREST_AT}% 아래로 떨어지면 1%p당 월 ${POP_UNREST_PER}명씩 인구가 줄어듭니다. 생산량에는 곱해지지 않습니다. 실업·과밀이 낮춤.">😊 ${happiness}%</span>
      <span class="si c-${cCls}" data-tip="범죄율 — 실업·과밀·인구가 높임. 치안 정책으로↓.">🚔 ${crime}%</span>
      <span class="si c-${gCls}" data-tip="인구 성장 ${gpct.toFixed(0)}% — ${gTip}">📈 ${gTxt}</span>
    </div>
    <div class="jb-h" style="margin-top:8px"><span>주거 사용</span><b>${Math.round(pops/Math.max(1,housing)*100)}%</b></div>
    <div class="bar" data-tip="인구 ${fmtPop(pops)} / 주거 정원 ${fmtPop(housing)} — 정원이 찰수록 인구 성장이 느려집니다"><i class="emp" style="width:${clamp(pops/Math.max(1,housing)*100,0,100)}%"></i></div>
    <div class="sr-sub"><span>${freeHouse>0?`주거 여유 ${fmtPop(freeHouse)}`:'주거 만실'}</span></div>
    <div class="jobbar">
      <div class="jb-h"><span>노동 인구 구성</span><b>${workPct}% 취업 · ${fmtPop(pops)}</b></div>
      <div class="jb-t" data-tip="총인구 ${fmtPop(pops)}를 100%로 놓고 직업별로 나눈 비율입니다. 빗금은 실업입니다.">${
        segs.map(g=>`<i class="j-${g.res}" style="width:${g.pct}%"></i>`).join("")
      }${idlePct>0.05?`<i class="j-idle" style="width:${idlePct}%"></i>`:""}</div>
      <div class="jb-l">${
        segs.map(g=>`<span><i style="background:var(--j-${g.res})"></i>${JOB_NAME[g.j]} <b>${fmtPop(g.n)}</b> ${Math.round(g.pct)}%</span>`).join("")
      }${unemployed>0.0005?`<span class="idle"><i style="background:#3a4761"></i>실업 <b>${fmtPop(unemployed)}</b> ${Math.round(idlePct)}%</span>`:`<span style="color:var(--habit)">완전고용 ✓</span>`}</div>
    </div>`;
}
function liveProdHTML(key){
  const cr=colonyRates(colonyInfo(key)), MM=SEC_PER_MONTH;
  return `<span class="pb-h">순생산 <small>/월</small></span>`+
    ["minerals","energy","goods","research","alloy"].map(k=>{const v=cr[k]*MM;
      if(Math.abs(v)<0.05) return "";
      return `<span class="pi ${v>=0?'p':'n'}">${rIco(k,12)} ${v>=0?'+':''}${v.toFixed(1)}</span>`;}).filter(Boolean).join("");
}
/* 건설 대기열 — 공사는 하나씩이지만 미리 줄을 세워둘 수 있다 */
function liveQueueHTML(key){
  const col=S.colonies[key], q=qOf(col);
  if(!col.bld && !q.length) return "";
  const row=(icon,name,right,idx)=>
    `<div class="bq-r"><span class="bq-n">${idx}</span><span class="bq-i">${icon}</span>`+
    `<span class="bq-t">${name}</span><span class="bq-d">${right}</span>`+
    `<button class="bq-x" data-cancel="${key}" data-qi="${idx-1}" data-tip="취소 — 건설비 전액 반환">✕</button></div>`;

let curTab="map";
const MODAL_TABS={tech:1,empire:1,settings:1};
function setTab(t){
  const app=document.querySelector(".app"), m=$("modal");
  if(!MODAL_TABS[t]) m.classList.remove("on");
  if(t==="map"){ app.classList.add("sheet-peek"); }
  else if(t==="planet"){ app.classList.remove("panel-closed"); app.classList.remove("sheet-peek");
    if(!selSys) selSys=firstColonySys()||"sol";
    renderPanel(); updateNodes(); }
  else if(t==="tech")     openEmpire();
  else if(t==="empire")   openEmpireStats();
  else if(t==="settings") openSettings();
  curTab=t; syncTabs();
}
function syncTabs(){
  const bar=$("tabbar"); if(!bar) return;
  const app=document.querySelector(".app"), open=$("modal").classList.contains("on");
  if(MODAL_TABS[curTab] && !open) curTab = app.classList.contains("sheet-peek") ? "map" : "planet";
  if(!MODAL_TABS[curTab]) curTab = app.classList.contains("sheet-peek") ? "map" : "planet";
  bar.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.tab===curTab));
}

function notify(msg,type){
  const log=$("log"); if(!log)return;
  const el=document.createElement("div"); el.className="logi "+(type||""); el.innerHTML=msg;
  log.prepend(el);
  while(log.children.length>3) log.lastChild.remove();   // 화면엔 최대 3개
  setTimeout(()=>{el.classList.add("out"); setTimeout(()=>el.remove(),450);}, 4200); // 4.2초 후 사라짐
}
function pushLog(msg,type){notify(msg,type);}
function toast(msg,type){notify(msg,type||"warn");}

const KEY="goldilocks_v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
/* 예전 저장 파일의 기술 성과를 새 격자로 옮긴다.
   여러 옛 기술이 한 새 기술로 합쳐지므로 레벨은 더하되 새 상한에서 자른다. */
function migrateTech(st){
  if(!st || !st.tech) return st;
  const old=st.tech, next={};
  for(const k in old){
    const lv=old[k]|0; if(lv<=0) continue;
    if(TECHS[k]){ next[k]=(next[k]||0)+lv; continue; }      // 이미 새 id
    const to=TECH_MIGRATE[k]; if(!to||!TECHS[to]) continue;  // 대응 없는 기술은 버린다
    next[to]=(next[to]||0)+lv;
  }
  for(const k in next){ const mx=TECHS[k].max; if(mx!==Infinity) next[k]=Math.min(next[k],mx); }
  /* 분기는 한쪽만 남긴다 */
  for(const k in next){ const T=TECHS[k];
    if(T.kind==="fork" && next[T.pair]) delete next[T.pair]; }
  /* 각인은 2개까지만 */
  let picked=0; DOCTS.forEach(([id])=>{ if(next[id]){ if(++picked>DOCT_PICK) delete next[id]; } });
  st.tech=next; return st;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=migrateTech(JSON.parse(raw));return true;}}catch(e){}return false;}
function exportSave(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function importSave(c){try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(o&&o.res&&o.colonies){S=migrateTech(o);won=primeCount()>=GOAL_PRIME;save();renderAll();return true;}}catch(e){}return false;}

   창마다 따로 닫기 버튼을 만들면 어떤 창은 아래, 어떤 창은 없는 지금 상태가 된다.
   closable=false 는 '반드시 골라야 하는 창'(사건 선택지)에만 쓴다. */
function closeModal(){ $("modal").classList.remove("on"); if(typeof syncTabs==="function") syncTabs(); }

  const m=$("modal"), c=$("modalCard");

   9계열(행) × 5시대(열) 격자. 시대 Ⅲ 뒤에 '택 1' 분기가 붙고, 아래에 각인 8개가 온다. */
const TG_BC={"확장":"var(--sky)","생산":"var(--marginal)","사회":"var(--j-research)"};
function tgState(k){
  const T=TECHS[k], l=techLvl(k);
  if(techBarred(k)) return "barred";
  if(T.max!==Infinity && l>=T.max) return "max";
  if(l>0) return "has";
  return techOpen(k) ? "open" : "lock";
}
function tgNode(k){
  const T=TECHS[k], l=techLvl(k), st=tgState(k);
  const pct = T.max===Infinity ? 100 : Math.round(l/T.max*100);
  return `<button class="tg-node ${st}${S.ractive===k?" act":""}${S.tsel===k?" sel":""}" data-tg="${k}"
    aria-label="${T.name}"><span class="ic">${T.icon}</span><span class="fl"><i style="width:${pct}%"></i></span></button>`;
}
function tgLattice(){
  const trunk={}; TRUNK.forEach(([id,,,era,ln])=>{ trunk[ln+"@"+era]=id; });
  const forkOf={}; for(let i=0;i<FORKS.length;i+=2) forkOf[FORKS[i][3]]=[FORKS[i][0],FORKS[i+1][0]];
  let h = tgDetail();                                   // 상세를 맨 위에 고정으로 둔다
  TECH_BRANCHES.forEach(br=>{
    const lns = LINE_ORDER.filter(ln=>LINES[ln].br===br);   // 갈래마다 계열 3개 = 3열
    h+=`<section class="tg-sec" style="--bc:${TG_BC[br]}">
      <div class="tg-bt"><i></i><u>${br}</u></div>
      <div class="tg-g">
        <div></div>`;
    lns.forEach(ln=>{ h+=`<div class="tg-ch"><b>${LINES[ln].n}</b><u>${LINES[ln].own}</u></div>`; });
    for(let e=1;e<=5;e++){
      // 시대 사이를 잇는 세로선 (앞 시대를 하나라도 올렸으면 불이 들어온다)
      if(e>1) h+=`<div class="tg-vr">`+lns.map(ln=>
        `<i class="${techLvl(trunk[ln+"@"+(e-1)])>0?"lit":""}"></i>`).join("")+`</div>`;
      h+=`<div class="tg-el ${curEra()===e?"now":eraOpen(e)?"on":""}"
             data-tip="시대 ${ERAS[e].rn} · ${ERAS[e].n} — 기술마다 ${ERAS[e].max}레벨${eraOpen(e)?"":` · 아직 열리지 않았습니다 (시대 ${ERAS[e-1].rn} 기술 ${ERA_GATE[e]}종 필요)`}">${ERAS[e].rn}</div>`;
      lns.forEach(ln=>{
        const k=trunk[ln+"@"+e], T=TECHS[k], l=techLvl(k), st=tgState(k);
        h+=`<div class="tg-vc ${st}">${tgNode(k)}<span class="tg-cp">${T.name}</span>
              <span class="tg-lv">${l}/${T.max}</span></div>`;
      });
      // 시대 Ⅲ 다음에 분기 줄
      if(e===3){
        h+=`<div class="tg-vr">`+lns.map(ln=>
          `<i class="${techLvl(trunk[ln+"@3"])>0?"lit":""}"></i>`).join("")+`</div>`;
        h+=`<div class="tg-el fk" data-tip="분기 — 계열마다 하나만 고를 수 있고, 고르지 않은 쪽은 영원히 잠깁니다">택1</div>`;
        lns.forEach(ln=>{
          const [a,b]=forkOf[ln], dec=techLvl(a)>0||techLvl(b)>0;
          h+=`<div class="tg-vc"><div class="tg-fkb${dec?" dec":""}">${tgNode(a)}${tgNode(b)}</div>
            <div class="tg-fc">${[a,b].map(x=>{
              const c = dec ? (techLvl(x)>0?"on":"off") : "";
              return `<span class="${c}">${TECHS[x].name}</span>`;}).join("")}</div></div>`;
        });
      }
    }
    h+=`</div></section>`;
  });
  // ── 각인 ──
  h+=`<div class="emp-h" style="margin-top:14px">각인 <small>시대 Ⅴ · 8개 중 <b style="color:var(--j-research)">${DOCT_PICK}개</b>만 선택 · 되돌릴 수 없음 (${doctPicked()}/${DOCT_PICK} 선택함)</small></div>`;
  h+=`<div class="tg-doc">`+DOCTS.map(([id])=>{
    const T=TECHS[id], st=tgState(id);
    return `<button class="tg-d ${st}" data-tg="${id}"><span class="ic">${T.icon}</span>
      <div><b>${T.name}</b><u>${effText(id,1).replace(/<[^>]+>/g,"")}</u></div></button>`;}).join("")+`</div>`;

  h+=`<div class="tg-doc">`+REPS.map(([id])=>{

      <u>${effText(id,1).replace(/<[^>]+>/g,"")}</u></div></button>`;}).join("")+`</div>`;

function tgDetail(){
  const k=S.tsel && TECHS[S.tsel] ? S.tsel : "p1";
  const T=TECHS[k], l=techLvl(k), c=techCost(k), st=tgState(k);
  const kindTxt = T.kind==="fork" ? "시대 Ⅲ · 택 1" : T.kind==="doct" ? "시대 Ⅴ · 각인"
                : T.kind==="rep" ? "반복 연구 · 무한" : `시대 ${ERAS[T.era].rn} ${ERAS[T.era].n}`;
  const stTxt = {barred:"포기함 — 영구 잠김", max:"확보 완료", has:"연구 중 아님 · 더 올릴 수 있음",
                 open:"연구 가능", lock:"선행 기술 필요"}[st];
  /* 수치 칸에서는 '레벨당' 줄과 겹치는 이름을 떼고 숫자만 남긴다 (좁은 화면에서 3줄이 되던 문제) */
  const base=effText(k,1);
  const trim=(t)=>{ if(T.max===1) return t; if(t===base) return t;
    let i=0; while(i<t.length&&i<base.length&&t[i]===base[i]) i++;
    const cut=t.slice(0,i).lastIndexOf(" ");
    return cut>1 ? t.slice(cut+1) : t; };
  const one  = T.max===1;                                   // 분기·각인은 레벨이 하나뿐
  const now  = one ? (l>0?"적용 중":"미적용") : (l>0 ? trim(effText(k,l)) : "—");
  const next = one ? (l>0?"—":"적용") : ((T.max!==Infinity && l>=T.max) ? "만렙" : trim(effText(k,l+1)));
  const canStart = !S.ractive && techOpen(k) && S.res.minerals>=c.minerals;
  let note = "";
  if(T.kind==="fork"){ const o=TECHS[T.pair];
    note = techLvl(T.pair)>0 ? `<b style="color:var(--hostile)">${o.name}</b> 을(를) 골라서 이 기술은 영원히 잠겼습니다.`
         : `이걸 고르면 <b>${o.name}</b> 은(는) 이 게임에서 영원히 잠깁니다.`; }
  else if(T.kind==="doct") note = `각인은 제국 전체에 붙습니다. <b>8개 중 ${DOCT_PICK}개</b>만 고를 수 있습니다.`;
  else if(T.kind==="rep")  note = `끝이 없는 반복 연구입니다.`;
  else note = `<b>${LINES[T.line].n}</b> 계열이 <b>${LINES[T.line].own}</b> 수치를 단독으로 담당합니다.`;
  return `<div class="tg-det">
    <div class="di">${T.icon}</div>
    <div class="db">
      <h4>${T.name}</h4>
      <div class="dm">${T.br} · ${T.lineName} · ${kindTxt} · ${stTxt}</div>
      <div class="de">레벨당 ${effText(k,1)}</div>
      <div class="tg-vs">
        <div><u>기술 보정 수치</u><b>${now}</b></div>
        <div><u>다음 레벨</u><b class="${next==="만렙"?"na":"up"}">${next}</b></div>
        <div><u>레벨</u><b>${l} / ${T.max===Infinity?"∞":T.max}</b></div>
      </div>
      <div class="dm" style="margin:6px 0 0">${note}</div>
    </div>
    <div class="dc"><u>비용</u><b>${rIco("research",11)}${fmt(c.research)}</b><b>${rIco("minerals",11)}${fmt(c.minerals)}</b>
      <button class="act ${canStart?"solid":""}" data-start="${k}" ${canStart?"":"disabled"}>${
        st==="barred"?"잠김":st==="max"?"완료":S.ractive?"연구 중":techOpen(k)?"연구 지정":"잠김"}</button></div>
  </div>`;
}

   if(a)a.onclick=()=>{save();toast("저장 완료","good");};
   if(b2)b2.onclick=()=>openSaveCode();
   if(c)c.onclick=()=>askReset();}
}
/* 폰에서는 상단바의 저장·세이브코드·새 게임 버튼이 자리 때문에 숨겨져 있다.
   같은 기능을 도움말 화면에서 쓸 수 있도록 따로 빼 둔다. */
function askReset(){
